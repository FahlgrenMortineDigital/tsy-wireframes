          <div class="kw-eff-ctrl-group">
            <span class="kw-eff-ctrl-label">CTR floor <span class="kw-eff-ctrl-val" id="kw-eff-ctr-val"></span></span>
            <input type="range" class="kw-eff-slider" id="kw-eff-ctr-slider" min="0" max="70" step="0.1">
          </div>
          <div class="kw-eff-ctrl-group">
            <span class="kw-eff-ctrl-label">CPA target</span>
            <input type="number" class="kw-eff-cpa-input" id="kw-eff-cpa-input" placeholder="e.g. 10.00" min="0" step="0.01">
          </div>
          <div class="kw-eff-ctrl-group">
            <span class="kw-eff-ctrl-label">Bubble size</span>
            <select class="kw-eff-select" id="kw-eff-bubble-select">
              <option value="cost">Cost</option>
              <option value="clicks">Clicks</option>
              <option value="conv">Conversions</option>
            </select>
          </div>
          <div class="kw-eff-legend">
            <span><span class="kw-eff-legend-dot" style="background:#1D9E75BB;border:1.5px solid #1D9E75"></span>Exact</span>
            <span><span class="kw-eff-legend-dot" style="background:#378ADDBB;border:1.5px solid #378ADD"></span>Phrase</span>
            <span><span class="kw-eff-legend-dot" style="background:#E24B4ABB;border:1.5px solid #E24B4A"></span>Broad</span>
          </div>
        </div>
        <div style="height:320px;position:relative"><canvas id="kw-eff-scatter"></canvas></div>
        <div class="kw-quad-grid">
          <div class="kw-quad-card" style="background:#EAF3DE;border-color:#97C459">
            <div class="kw-quad-card-name"><span class="kw-quad-card-dot" style="background:#1D9E75"></span>Stars</div>
            <div class="kw-quad-card-desc">High CTR + high CVR — scale budget here</div>
          </div>
          <div class="kw-quad-card" style="background:#E6F1FB;border-color:#85B7EB">
            <div class="kw-quad-card-name"><span class="kw-quad-card-dot" style="background:#378ADD"></span>Niche converters</div>
            <div class="kw-quad-card-desc">Low CTR + high CVR — strong intent, underinvested</div>
          </div>
          <div class="kw-quad-card" style="background:#FAEEDA;border-color:#FAC775">
            <div class="kw-quad-card-name"><span class="kw-quad-card-dot" style="background:#EF9F27"></span>Traffic sinks</div>
            <div class="kw-quad-card-desc">High CTR + low CVR — driving volume without results</div>
          </div>
          <div class="kw-quad-card" style="background:#F1EFE8;border-color:#D3D1C7">
            <div class="kw-quad-card-name"><span class="kw-quad-card-dot" style="background:#888780"></span>Review candidates</div>
            <div class="kw-quad-card-desc">Low CTR + low CVR — lowest priority</div>
          </div>
        </div>
      </div>
      <div id="kw-bucket-table-wrap"></div>
    </div>`;

  // ── Event wiring ──────────────────────────────────────────────────────────

  // KPI tile clicks
  container.querySelectorAll('#kw-kpi-grid .kpi-card').forEach(card=>{
    card.addEventListener('click',()=>{
      state.kwPageSelectedKpi=state.kwPageSelectedKpi===card.dataset.kpi?null:card.dataset.kpi;
      renderKeywordsPage();
    });
  });

  // Keyword pill × clear
  const kwClear=container.querySelector('[data-clear="kw"]');
  if(kwClear) kwClear.addEventListener('click',e=>{
    e.stopPropagation();
    state.activeKeyword=null;
    state.kwPageSelectedKw=null;
    renderAll();
  });

  // Filter chips
  container.querySelectorAll('.kw-chip').forEach(ch=>{
    ch.addEventListener('click',()=>{ state.kwPageFilter=ch.dataset.filter; renderKeywordsPage(); });
  });

  // Column sort headers
  container.querySelectorAll('#kw-table-card thead th[data-sort]').forEach(th=>{
    th.addEventListener('click',()=>{
      const key=th.dataset.sort;
      if(kwSort.key===key) kwSort.dir*=-1; else{kwSort.key=key;kwSort.dir=1;}
      renderKeywordsPage();
    });
  });

  // Row clicks — select / deselect keyword
  container.querySelectorAll('#kw-table-card tbody tr[data-kwkey]').forEach(tr=>{
    tr.addEventListener('click',()=>{
      const key=tr.dataset.kwkey;
      if(state.kwPageSelectedKw===key){
        state.kwPageSelectedKw=null;
        state.activeKeyword=null;
        state.activeKw=null; state.activeKwSource=null; state.expandedBucket=null;
        renderAll();
        return;
      }
      const kw=allKws.find(k=>k.kwKey===key);
      if(!kw) return;
      state.kwPageSelectedKw=key;
      state.activeKeyword=kw.kw;
      state.lastKeyword=kw.kw;
      state.activeCampaign=kw.campaign;
      state.lastCampaign=kw.campaign;
      // Find the matching scatter bubble (pick dominant match type by clicks)
      const scatterData=getKwScatterData(tableRows);
      const matches=scatterData.filter(k=>k.kw===kw.kw);
      if(matches.length){
        const dominant=matches.reduce((b,k)=>k.clicks>b.clicks?k:b,matches[0]);
        state.activeKw=dominant.key;
        state.activeKwSource='kw-table';
        // Floors guaranteed set by wiring block above, but guard anyway
        if(state.cvrFloor===null||state.ctrFloor===null){
          const fl=computeEfficiencyFloors(tableRows);
          if(state.cvrFloor===null) state.cvrFloor=fl.cvrFloor;
          if(state.ctrFloor===null) state.ctrFloor=fl.ctrFloor;
        }
        state.expandedBucket=getQuadrant(dominant);
      } else {
        state.activeKw=null; state.activeKwSource=null; state.expandedBucket=null;
      }
      renderAll();
    });
  });

  // Render inline chart
  if(showTrend) renderKwInlineChart(filtered,kpiDef);

  // Cache page data for sidebar
  _kwPageData={allKws,acctAgg,tableRows,tMinMs,tMaxMs,filtered,kpiDef};

  // ── Match type row clicks ─────────────────────────────────────────────────
  container.querySelectorAll('#kw-mt-card .mt-row').forEach(row=>{
    row.addEventListener('click',()=>{
      const mt=row.dataset.mt;
      state.kwPageSelectedMt=state.kwPageSelectedMt===mt?null:mt;
      renderKeywordsPage();
    });
  });

  // ── Scatter chart ─────────────────────────────────────────────────────────
  const scatterCanvas=document.getElementById('kw-scatter-chart');
  if(scatterCanvas&&allKws.length){
    const avgCpa4=acctAgg.cpa||0;
    const dotFill=kw=>{
      if(!kw.conv||kw.conv<1) return '#f1efe8';
      if(!avgCpa4) return '#e6f1fb';
      const r=kw.cpa/avgCpa4;
      return r<1?'#eaf3de':r<=1.2?'#faeeda':'#fcebeb';
    };
    const dotStroke=kw=>{
      if(!kw.conv||kw.conv<1) return '#888780';
      if(!avgCpa4) return '#378ADD';
      const r=kw.cpa/avgCpa4;
      return r<1?'#639922':r<=1.2?'#EF9F27':'#e24b4a';
    };
    const selIdx=allKws.findIndex(k=>k.kw===state.activeKeyword);
    // Dim non-selected dots; make selected dot larger
    const dotDim=(c,i)=>selIdx>=0&&i!==selIdx?c+'80':c;
    const radii=allKws.map((kw,i)=>{
      const base=Math.max(5,Math.sqrt((kw.clicks||0)/maxClicks4)*14);
      return selIdx>=0&&i===selIdx?base+4:base;
    });

    // Custom plugin for quadrant dividers + labels
    const quadPlugin={
      id:'kwQuad',
      afterDraw(chart){
        const {ctx,chartArea:{top,bottom,left,right},scales:{x,y}}=chart;
        if(!x||!y) return;
        const cx=x.getPixelForValue(medCost4), cy=y.getPixelForValue(medConv4);
        ctx.save();
        ctx.setLineDash([4,4]);
        ctx.strokeStyle='rgba(180,178,169,0.55)';
        ctx.lineWidth=1;
        if(cx>left&&cx<right){ctx.beginPath();ctx.moveTo(cx,top);ctx.lineTo(cx,bottom);ctx.stroke();}
        if(cy>top&&cy<bottom){ctx.beginPath();ctx.moveTo(left,cy);ctx.lineTo(right,cy);ctx.stroke();}
        ctx.setLineDash([]);
        ctx.font='9px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif';
        ctx.fillStyle='rgba(107,114,128,0.65)';
        const pad=5;
        if(cx>left+60&&cy>top+16){ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText('Low cost · High conv',left+pad,top+pad);}
        if(cx<right-60&&cy>top+16){ctx.textAlign='right';ctx.textBaseline='top';ctx.fillText('High cost · High conv',right-pad,top+pad);}
        if(cx>left+60&&cy<bottom-14){ctx.textAlign='left';ctx.textBaseline='bottom';ctx.fillText('Low cost · Low conv',left+pad,bottom-pad);}
        if(cx<right-60&&cy<bottom-14){ctx.textAlign='right';ctx.textBaseline='bottom';ctx.fillText('High cost · Low conv',right-pad,bottom-pad);}
        ctx.restore();
      }
    };

    // Plugin: draw keyword label above the selected dot
    const kwSelLabelPlugin={
      id:'kwSelLabel',
      afterDraw(chart){
        if(selIdx<0) return;
        const {ctx,scales:{x,y},data}=chart;
        const pt=data.datasets[0].data[selIdx];
        if(!pt) return;
        const px=x.getPixelForValue(pt.x),py=y.getPixelForValue(pt.y);
        ctx.save();
        ctx.font='bold 10px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif';
        ctx.fillStyle='#185fa5';ctx.textAlign='center';ctx.textBaseline='bottom';
        const lbl=allKws[selIdx].kw;
        ctx.fillText(lbl.length>22?lbl.slice(0,21)+'…':lbl,px,py-radii[selIdx]-2);
        ctx.restore();
      }
    };

    kwScatterChart=new Chart(scatterCanvas.getContext('2d'),{
      type:'scatter',
      plugins:[quadPlugin,kwSelLabelPlugin],
      data:{
        datasets:[{
          label:'Keywords',
          data:allKws.map(kw=>({x:kw.cost||0,y:kw.conv||0})),
          pointBackgroundColor:allKws.map((kw,i)=>dotDim(dotFill(kw),i)),
          pointBorderColor:allKws.map((kw,i)=>dotDim(dotStroke(kw),i)),
          pointRadius:radii,
          pointHoverRadius:radii.map(r=>r+2),
          pointBorderWidth:1.5,
        }]
      },
      options:{
        responsive:true,maintainAspectRatio:false,
        plugins:{
          legend:{display:false},
          tooltip:{
            callbacks:{
              title(items){return allKws[items[0].dataIndex]?.kw??'';},
              label(item){
                const kw=allKws[item.dataIndex];
                if(!kw) return '';
                return [
                  `Cost: ${fmtNum(kw.cost,'usd')}`,
                  `Conv.: ${fmtNum(kw.conv,'dec')}`,
                  `CPA: ${fmtNum(kw.cpa,'usd')}`,
                ];
              }
            }
          }
        },
        scales:{
          x:{
            title:{display:true,text:'Cost',color:'#888780',font:{size:11}},
            grid:{color:'rgba(128,128,128,0.06)'},
            ticks:{color:'#888780',font:{size:11},callback:v=>'$'+fmtNum(v,'int')},
          },
          y:{
            title:{display:true,text:'Conversions',color:'#888780',font:{size:11}},
            grid:{color:'rgba(128,128,128,0.06)'},
            ticks:{color:'#888780',font:{size:11}},
          }
        }
      }
    });
  }

  // ── CVR area chart (Row 5 right) ──────────────────────────────────────────
  const cvrCanvas=document.getElementById('kw-cvr-chart');
  if(cvrCanvas&&acctChunks5.length){
    const recentWindowPlugin5={
      id:'kwRecentWin',
      afterDraw(chart){
        if(recentStart5<1) return;
        const {ctx,chartArea:{top,bottom},scales:{x}}=chart;
        if(!x) return;
        const x1=x.getPixelForTick(recentStart5-1), x2=x.getPixelForTick(recentStart5);
        const xLine=(x1+x2)/2;
        ctx.save();
        ctx.setLineDash([4,3]);
        ctx.strokeStyle='#EF9F27';
        ctx.lineWidth=1.5;
        ctx.beginPath();ctx.moveTo(xLine,top);ctx.lineTo(xLine,bottom);ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle='#EF9F27';
        ctx.font='9px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif';
        ctx.textAlign='center';ctx.textBaseline='top';
        ctx.fillText('recent window',xLine,top+2);
        ctx.restore();
      }
    };
    kwCvrChart=new Chart(cvrCanvas.getContext('2d'),{
      type:'line',
      plugins:[recentWindowPlugin5],
      data:{
        labels:cvrChartLabels,
        datasets:[{
          data:cvrChartData,
          borderColor:C.blue,
          backgroundColor:'rgba(55,138,221,0.08)',
          fill:true,
          tension:0.35,
          pointRadius:4,
          pointBackgroundColor:cvrChartLabels.map((_,i)=>i>=recentStart5?C.blue:'#888780'),
          pointBorderColor:cvrChartLabels.map((_,i)=>i>=recentStart5?C.blue:'#888780'),
          borderWidth:2,
        }]
      },
      options:{
        responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{
          callbacks:{label(item){return 'CVR: '+(item.parsed.y*100).toFixed(2)+'%';}}
        }},
        scales:{
          x:{
            grid:{display:false},
            ticks:{
              color:ctx=>ctx.index>=recentStart5?C.blue:'#888780',
              font:{size:11},
            }
          },
          y:{
            grid:{color:'rgba(128,128,128,0.06)'},
            ticks:{color:'#888780',font:{size:10},callback:v=>(v*100).toFixed(1)+'%'},
          }
        }
      }
    });
  }

  // ── N-gram table ─────────────────────────────────────────────────────────
  renderNgramTable();

  container.querySelectorAll('.ng-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      ngramSize=parseInt(btn.dataset.n,10);
      ngramShowAll=false;
      container.querySelectorAll('.ng-btn').forEach(b=>b.classList.toggle('ng-active',b===btn));
      renderNgramTable();
    });
  });

  container.querySelectorAll('#ngram-table thead th[data-ngsort]').forEach(th=>{
    th.addEventListener('click',()=>{
      const c=th.dataset.ngsort;
      if(ngramSort.col===c) ngramSort.dir=ngramSort.dir==='asc'?'desc':'asc';
      else { ngramSort.col=c; ngramSort.dir=c==='gram'?'asc':'desc'; }
      renderNgramTable();
    });
  });

  const showMoreBtn=container.querySelector('#ngram-showmore');
  if(showMoreBtn) showMoreBtn.addEventListener('click',()=>{ ngramShowAll=!ngramShowAll; renderNgramTable(); });

  // ── Efficiency scatter controls ───────────────────────────────────────────
  // Compute floor defaults on first render (or after period change reset them to null)
  if(state.cvrFloor===null||state.ctrFloor===null){
    const floors=computeEfficiencyFloors(tableRows);
    if(state.cvrFloor===null) state.cvrFloor=floors.cvrFloor;
    if(state.ctrFloor===null) state.ctrFloor=floors.ctrFloor;
  }

  const cvrSlider =container.querySelector('#kw-eff-cvr-slider');
  const ctrSlider =container.querySelector('#kw-eff-ctr-slider');
  const cvrVal    =container.querySelector('#kw-eff-cvr-val');
  const ctrVal    =container.querySelector('#kw-eff-ctr-val');
  const cpaInput  =container.querySelector('#kw-eff-cpa-input');
  const bubbleSel =container.querySelector('#kw-eff-bubble-select');
  const bubbleLbl =container.querySelector('#kw-eff-bubble-label');

  const fmtFloor=v=>(v*100).toFixed(1)+'%';

  if(cvrSlider){
    cvrSlider.value=(state.cvrFloor*100).toFixed(1);
    cvrVal.textContent=fmtFloor(state.cvrFloor);
    cvrSlider.addEventListener('input',()=>{
      state.cvrFloor=+cvrSlider.value/100;
      cvrVal.textContent=fmtFloor(state.cvrFloor);
      renderEfficiencyScatter();
      renderBucketTable();
    });
  }
  if(ctrSlider){
    ctrSlider.value=(state.ctrFloor*100).toFixed(1);
    ctrVal.textContent=fmtFloor(state.ctrFloor);
    ctrSlider.addEventListener('input',()=>{
      state.ctrFloor=+ctrSlider.value/100;
      ctrVal.textContent=fmtFloor(state.ctrFloor);
      renderEfficiencyScatter();
      renderBucketTable();
    });
  }
  if(cpaInput){
    cpaInput.value=state.cpaTarget||'';
    cpaInput.addEventListener('change',()=>{
      const v=parseFloat(cpaInput.value);
      state.cpaTarget=isNaN(v)||v<=0?null:v;
      renderEfficiencyScatter();
    });
  }
  if(bubbleSel){
    bubbleSel.value=state.bubbleMetric;
    if(bubbleLbl) bubbleLbl.textContent=state.bubbleMetric;
    bubbleSel.addEventListener('change',()=>{
      state.bubbleMetric=bubbleSel.value;
      if(bubbleLbl) bubbleLbl.textContent=state.bubbleMetric;
      renderEfficiencyScatter();
    });
  }

  renderEfficiencyScatter();
  renderBucketTable();

  // ── IntersectionObserver + sidebar ───────────────────────────────────────
  const trendSectionEl=container.querySelector('#kw-trend-section');
  if(trendSectionEl){
    kwSidebarObserver=new IntersectionObserver(entries=>{
      const e=entries[0];
      kwInlineVisible=e.isIntersecting;
      if(!e.isIntersecting) kwSidebarClosed=false;
      renderKwSidebar();
    },{threshold:0});
    kwSidebarObserver.observe(trendSectionEl);
  }
  renderKwSidebar();
}

  {

    nbLabel:    'NB Clicks',
    brandLabel: 'Brand Conv.',
    getNb:      w => w.rows.filter(r=>!r.isBrand).reduce((s,r)=>s+r.clicks,0),
    getBrand:   w => w.rows.filter(r=>r.isBrand).reduce((s,r)=>s+r.conv,0),
    nbFmt:      v => Math.round(v).toLocaleString(),
    brandFmt:   v => v==null?'—':v.toFixed(1),
    lagNote:    lag => lag===0
      ? 'Same-period relationship — no consideration lag detected'
      : `Avg. consideration lag: ~${lag} days between NB click spike and brand conversion lift`,

    story:      'Awareness to branded intent quality',

// ─── VISUAL 2 — BRAND QUALITY SIGNAL CARD ───────────────────────────────────
// Pure renderer — two coloured panels (high NB green, low NB red) with pairwise
// normalised bars. High panel = 100% reference; low panel shows retained %.
// Lift badge on high panel only; low panel shows "Baseline".
// Syncs Brand Quality Signal card height to the NB Exposure preview card.
// Double rAF ensures renderBucketUnit's own rAF (which sets bucket card heights) fires first.
function renderNbExposureTrend(completeWeeks, scores, medianThreshold){
  const el = document.getElementById('bnb-exposure-trend');
  if(!el || !completeWeeks.length){ if(el) el.innerHTML=''; return; }

  const fmtScore = v => {
    if(v==null) return '—';
    if(v>=1e6) return (v/1e6).toFixed(1)+'M';
    if(v>=1e3) return (v/1e3).toFixed(1)+'k';
    return Math.round(v).toLocaleString();
  };

  const labels  = completeWeeks.map(w => {
    const d = new Date(w.weekStart+'T00:00:00');
    return d.toLocaleDateString('en-GB',{month:'short',day:'numeric'});
  });
  const isHigh  = scores.map(s => s >= medianThreshold);
  const highData = scores.map((s,i) => isHigh[i] ? s : null);
  const lowData  = scores.map((s,i) => !isHigh[i] ? s : null);

  el.innerHTML=`<div class="card">
    <div class="card-title">NB Weighted Exposure &mdash; Weekly Trend</div>
    <div class="card-sub">Each dot is one complete week, coloured by its NB exposure classification. Use this to see whether High NB weeks are declining over time or whether Low NB weeks are strengthening and converging toward the median.</div>
    <div style="position:relative;height:200px"><canvas id="nb-exposure-trend-canvas"></canvas></div>
    <div style="display:flex;gap:20px;align-items:center;margin-top:10px;font-size:12px;color:var(--muted);flex-wrap:wrap">
      <span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:50%;background:#1D9E75;display:inline-block"></span>High NB weeks (above median)</span>
      <span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:50%;background:#EF9F27;display:inline-block"></span>Low NB weeks (below median)</span>
      <span style="display:flex;align-items:center;gap:5px"><span style="width:18px;border-top:2px dashed rgba(127,119,221,0.7);display:inline-block"></span>Median threshold &mdash; ${fmtScore(medianThreshold)}</span>
    </div>
  </div>`;

  if(nbExposureTrendChart){ nbExposureTrendChart.destroy(); nbExposureTrendChart=null; }

  requestAnimationFrame(()=>{
    const canvas = document.getElementById('nb-exposure-trend-canvas');
    if(!canvas) return;

    const medianPlugin = {
      id:'nbTrendMedian',
      afterDraw(chart){
        const{ctx:c,scales:{x,y}}=chart;
        const yPx=y.getPixelForValue(medianThreshold);
        c.save();
        c.beginPath(); c.setLineDash([5,4]);
        c.strokeStyle='rgba(127,119,221,0.65)'; c.lineWidth=1.5;
        c.moveTo(x.left,yPx); c.lineTo(x.right,yPx); c.stroke();
        c.setLineDash([]);
        c.font='10px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif';
        c.fillStyle='#7F77DD'; c.textAlign='left'; c.textBaseline='bottom';
        c.fillText('Median',x.left+4,yPx-3);
        c.restore();
      }
    };

    nbExposureTrendChart = new Chart(canvas.getContext('2d'),{
      type:'line',
      plugins:[medianPlugin],
      data:{
        labels,
        datasets:[
          {
            // thin neutral connector so all dots are visually linked in time
            label:'_connector',
            data:scores,
            borderColor:'rgba(180,178,169,0.3)',
            borderWidth:1.5,
            pointRadius:0,
            tension:0.25,
            fill:false,
            spanGaps:true,
            order:3,
          },
          {
            label:'High NB weeks',
            data:highData,
            borderColor:'transparent',
            pointBackgroundColor:'#1D9E75',
            pointBorderColor:'#0F6E56',
            pointBorderWidth:1.5,
            pointRadius:7,
            pointHoverRadius:9,
            showLine:false,
            spanGaps:false,
            order:1,
          },
          {
            label:'Low NB weeks',
            data:lowData,
            borderColor:'transparent',
            pointBackgroundColor:'#EF9F27',
            pointBorderColor:'#C07A10',
            pointBorderWidth:1.5,
            pointRadius:7,
            pointHoverRadius:9,
            showLine:false,
            spanGaps:false,
            order:2,
          },
        ]
      },
      options:{
        responsive:true,
        maintainAspectRatio:false,
        plugins:{
          legend:{display:false},
          tooltip:{
            mode:'index',
            intersect:false,
            filter:item=>item.datasetIndex!==0,
            callbacks:{
              title(items){return items[0]?.label??'';},
              label(item){
                const s=scores[item.dataIndex];
                const hi=isHigh[item.dataIndex];
                return `${hi?'High NB':'Low NB'} week: ${fmtScore(s)} weighted exposure`;
              },
              afterBody(){
                return [`Median threshold: ${fmtScore(medianThreshold)}`];
              }
            }
          }
        },
        scales:{
          x:{
            grid:{color:'rgba(128,128,128,0.06)'},
            border:{display:false},
            ticks:{color:'#888780',font:{size:11},maxRotation:40}
          },
          y:{
            grid:{color:'rgba(128,128,128,0.06)'},
            border:{display:false},
            ticks:{color:'#888780',font:{size:11},callback:v=>fmtScore(v)}
          }
        }
      }
    });
  });
}

function renderQualityCard({highAgg, lowAgg, metricGaps, confidence, medianThreshold, nbMetricKey, highCount, lowCount, totalWeeks}){
  const el = document.getElementById('bnb-quality-card');

  // Safety guard (primary guard is in renderBnb, this handles edge cases)
  if(confidence && !confidence.meetsMinimum){
    el.innerHTML=`<div class="card"><div class="card-title">Brand Quality Signal</div>
      <div class="aw-warn"><span class="aw-warn-icon">&#9888;</span>Not enough complete weeks for a reliable signal — select a longer date range.</div></div>`;
    return;
  }

  // Baseline info row
  const NB_UNIT = {
    weighted_nb_exposure:'weighted exposure',
    nb_clicks:'NB clicks',
    nb_impressions:'NB impr.',
    nb_spend:'NB spend',
  };
  const nbUnitLabel = NB_UNIT[nbMetricKey]||'NB exposure';
  const fmtThresh = v => {
    if(v==null) return '—';
    if(v>=1e6) return (v/1e6).toFixed(1)+'M';
    if(v>=1e3) return (v/1e3).toFixed(1)+'k';
    return Math.round(v).toLocaleString();
  };

  // Per-metric value formatter used in drill-down mode
  function fmtBnbMetric(key, val){
    if(val==null) return '—';
    switch(key){
      case 'impressions': return val>=1e6?(val/1e6).toFixed(1)+'M':val>=1e3?(val/1e3).toFixed(1)+'k':Math.round(val).toLocaleString();
      case 'clicks':      return val>=1e3?(val/1e3).toFixed(1)+'k':Math.round(val).toLocaleString();
      case 'conversions': return val.toFixed(1);
      case 'ctr':         return (val*100).toFixed(2)+'%';
      case 'cvr':         return (val*100).toFixed(2)+'%';
      case 'cpa':         return '$'+val.toFixed(2);
      case 'cost':        return val>=1e3?'$'+(val/1e3).toFixed(1)+'k':'$'+val.toFixed(2);
      case 'cpc':         return '$'+val.toFixed(2);
      default:            return val.toFixed(2);
    }
  }

  // Build METRICS array: overview (no bucket) = one row per bucket using avgRetained;
  // drill-down (bucket selected) = individual metrics in that bucket.
  let METRICS, cardSubtitle;
  if(!selectedBucket){
    // Overview: Traffic / Engagement / Cost rows
    cardSubtitle = 'Overview — click a bucket to drill down';
    METRICS = ['traffic','engagement','cost'].map(bucket => {
      const gaps = (metricGaps||[]).filter(g=>(g.bucket===bucket||g.crossBucket===bucket)&&g.retained!=null);
      const avgRetained = gaps.length ? gaps.reduce((s,g)=>s+g.retained,0)/gaps.length : null;
      return {
        label: BUCKET_CONFIG[bucket].label,
        hVal: 1.0,
        lVal: avgRetained,
        hib: true,
        fmt: v => v==null?'—':(v*100).toFixed(1)+'%',
      };
    });
  } else {
    // Drill-down: individual metrics within the selected bucket
    const cfg = BUCKET_CONFIG[selectedBucket];
    cardSubtitle = cfg ? cfg.label+' bucket' : selectedBucket;
    const qcOrder = BUCKET_METRIC_ORDER[selectedBucket] || [];
    const qcFiltered = (metricGaps||[]).filter(g=>(g.bucket===selectedBucket||g.crossBucket===selectedBucket)&&g.highVal!=null&&g.lowVal!=null);
    const qcSorted = qcOrder.map(key=>qcFiltered.find(g=>g.key===key)).filter(Boolean);
    qcFiltered.forEach(g=>{ if(!qcSorted.includes(g)) qcSorted.push(g); });
    METRICS = qcSorted.map(g=>({
      label: g.label,
      hVal:  g.highVal,
      lVal:  g.lowVal,
      hib:   g.higherIsBetter,
      fmt:   v => fmtBnbMetric(g.key, v),
      key:   g.key,
    }));
  }

  // Bar widths: better-performing panel anchors at 100%, other panel is proportional.
  // For higher-is-better: best = max(hVal,lVal); each bar = val/best * 100.
  // For lower-is-better: best = min(hVal,lVal); each bar = best/val * 100.
  function calcBars(hVal, lVal, hib){
    if(!hVal||!lVal) return {highBar:0, lowBar:0};
    if(hib){
      const best=Math.max(hVal,lVal);
      return {highBar:(hVal/best)*100, lowBar:(lVal/best)*100};
    } else {
      const best=Math.min(hVal,lVal);
      return {highBar:(best/hVal)*100, lowBar:(best/lVal)*100};
    }
  }

  function panelMetrics(isHigh){
    return METRICS.map(m=>{
      const {label, hVal, lVal, hib, fmt} = m;
      const val = isHigh ? hVal : lVal;
      const {highBar, lowBar} = calcBars(hVal, lVal, hib);
      const barW = isHigh ? highBar : lowBar;

      // Badge on high panel only
      let badgeHtml = '';
      if(isHigh){
        if(hVal!=null && lVal!=null){
          let lift, isGood;
          if(hib){
            // Use high NB as denominator to match the dot plot's gap % (gap = (high-low)/high)
            lift = ((hVal - lVal) / Math.abs(hVal)) * 100;
            isGood = lift > 0;
            const sign = lift > 0 ? '+' : '';
            badgeHtml = `<span class="qc2-badge ${isGood?'qc2-badge-up':'qc2-badge-down'}">${sign}${lift.toFixed(1)}% vs baseline</span>`;
          } else {
            // lower-is-better: positive lift = cost reduction = good
            lift = ((lVal - hVal) / Math.abs(lVal)) * 100;
            isGood = lift > 0;
            if(isGood){
              badgeHtml = `<span class="qc2-badge qc2-badge-up">\u2212${lift.toFixed(1)}% vs baseline</span>`;
            } else {
              badgeHtml = `<span class="qc2-badge qc2-badge-down">+${Math.abs(lift).toFixed(1)}% vs baseline</span>`;
            }
          }
        }
      } else {
        badgeHtml = `<span class="qc2-badge-neutral">Baseline</span>`;
      }

      return `<div class="qc2-metric">
        <div class="qc2-metric-label">${label}</div>
        <div class="qc2-metric-val">${fmt(val)}</div>

  </div>`;
}

function renderLagBarsChart(canvasId, corrResults, peakLag, reliableMax){
  const existing=Chart.getChart(canvasId);
  if(existing) existing.destroy();
  const canvas=document.getElementById(canvasId);
  if(!canvas) return null;
  const bgColors=corrResults.map(c=>
    c.lag===peakLag?'#1D9E75':c.lag>reliableMax?'rgba(29,158,117,0.1)':'rgba(29,158,117,0.3)'
  );
  return new Chart(canvas.getContext('2d'),{
    type:'bar',
    data:{
      labels:corrResults.map(c=>c.lag),
      datasets:[{
        data:corrResults.map(c=>Math.max(0,c.r)),
        backgroundColor:bgColors,
        borderWidth:0,
        borderRadius:2,
      }]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{
        enabled:true,
        callbacks:{
          title:items=>`Lag ${corrResults[items[0].dataIndex].lag}d`,
          label:items=>`r = ${(corrResults[items[0].dataIndex].r*100).toFixed(1)}%${corrResults[items[0].dataIndex].lag>reliableMax?' (insufficient data)':''}`,
        }
      }},
      scales:{
        x:{
          grid:{display:false},
          border:{display:false},
          ticks:{
            font:{size:9},
            color:(ctx)=>{
              const lag=corrResults[ctx.index]?.lag;
              if(lag===peakLag) return '#1D9E75';
              if(lag>reliableMax) return 'rgba(150,150,150,0.3)';
              return '#6b7280';
            },
            callback:(v,i)=>(corrResults[i]?.lag%5===0||corrResults[i]?.lag===peakLag)?corrResults[i].lag:'',
          }
        },
        y:{display:false,min:0},
      }
    }
  });
}

function computeLagInsight(srcSeries, tgtSeries, lag, tgtFmt){
  const n=srcSeries.length;
  const srcP=srcSeries.slice(0,n-lag), tgtP=tgtSeries.slice(lag);
  const pc=srcP.length;
  if(pc<2) return {pairCount:pc,noData:true};
  const sorted=[...srcP].sort((a,b)=>a-b);
  const median=sorted[Math.floor(sorted.length/2)];
  const highTgt=tgtP.filter((_,i)=>srcP[i]>=median);
  const lowTgt =tgtP.filter((_,i)=>srcP[i]< median);
  const avgHigh=highTgt.length>0?highTgt.reduce((s,v)=>s+v,0)/highTgt.length:null;
  const avgLow =lowTgt.length >0?lowTgt.reduce((s,v)=>s+v,0) /lowTgt.length :null;
  const pctDiff=(avgHigh!==null&&avgLow!==null&&Math.abs(avgLow)>1e-9)
    ?(avgHigh-avgLow)/Math.abs(avgLow)*100:null;
  return{
    pairCount:pc, avgHigh, avgLow, pctDiff,
    avgHighFmt:avgHigh!==null?tgtFmt(avgHigh):null,
    avgLowFmt :avgLow !==null?tgtFmt(avgLow) :null,
  };
}

function getLagContextNote(srcKey, tgtKey, isPositive){
  if(isPositive){
    if(srcKey==='weighted_nb_exposure'||srcKey==='nb_impressions')
      return 'NB exposure likely builds brand awareness — users shown NB ads tend to search brand terms in subsequent weeks.';
    if(srcKey==='nb_clicks')
      return 'NB clicks bring users into the consideration funnel who may return via branded search later.';
    if(srcKey==='nb_spend')
      return 'Higher NB investment periods tend to drive downstream brand engagement.';
  } else {
    if(srcKey==='nb_spend'&&(tgtKey==='brand_ctr'||tgtKey==='brand_cvr'))
      return 'High NB spend may reallocate budget away from brand campaigns, reducing brand CTR or CVR.';
    return 'May reflect budget reallocation, competitive pressure during heavy NB periods, or inverse seasonal patterns.';
  }
  return '';
}

    ?`No consistent timing relationship at this lag. ${srcLabel} and ${tgtLabel} don't appear to move together when offset by ${lag_days} days.`
    :`When <b>${srcLabel}</b> was above average in a given week, <b>${tgtLabel}</b> tended to be <b>${dirWord}</b> ${lagWord}.`;

  let splitHtml='';
  if(insight.avgHighFmt&&insight.avgLowFmt){
    const delta=insight.pctDiff;

  return `
