// ─── ATTRIBUTION WINDOW CALCULATIONS ────────────────────────────────────────
function pearsonR(a, b){
  const n=a.length;
  if(n<2) return 0;
  const meanA=a.reduce((s,v)=>s+v,0)/n;
  const meanB=b.reduce((s,v)=>s+v,0)/n;
  const num=a.reduce((s,v,i)=>s+(v-meanA)*(b[i]-meanB),0);
  const den=Math.sqrt(a.reduce((s,v)=>s+(v-meanA)**2,0)*b.reduce((s,v)=>s+(v-meanB)**2,0));
  return den===0?0:num/den;
}
function crossCorrelation(nbSeries, brandSeries, maxLag=14){
  const results=[];
  for(let lag=0;lag<=maxLag;lag++){
    const a=nbSeries.slice(0,nbSeries.length-lag);
    const b=brandSeries.slice(lag);
    results.push({lag, r:pearsonR(a,b)});
  }
  return results;
}
function assessSharpness(corrResults){
  const peak=Math.max(...corrResults.map(c=>c.r));
  const mean=corrResults.reduce((s,c)=>s+c.r,0)/corrResults.length;
  const ratio=peak/Math.max(0.0001,mean);
  if(ratio>1.6) return 'Sharp';
  if(ratio>1.3) return 'Moderate';
  return 'Flat';
}

// ─── T-DISTRIBUTION P-VALUE (hand-rolled, no external dependency) ────────────
// Implements the two-tailed p-value via the regularized incomplete beta
// function using Lentz's continued-fraction algorithm.
// Accurate to ~6 sig figs for df >= 1, |t| up to ~20.
// Refs: Numerical Recipes §6.4; Abramowitz & Stegun §26.5.

function _logGamma(z){
  // Lanczos approximation (g=7, n=9). Accurate to ~15 sig figs.
  const C=[0.99999999999980993,676.5203681218851,-1259.1392167224028,
    771.32342877765313,-176.61502916214059,12.507343278686905,
    -0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
  if(z<0.5) return Math.log(Math.PI/Math.sin(Math.PI*z))-_logGamma(1-z);
  z-=1;
  let x=C[0]; for(let i=1;i<9;i++) x+=C[i]/(z+i);
  const t=z+7.5;
  return 0.5*Math.log(2*Math.PI)+(z+0.5)*Math.log(t)-t+Math.log(x);
}

function _betaCF(x,a,b){
  // Lentz's algorithm for the CF representation of I_x(a,b).
  const MAXIT=300,EPS=3e-7,FPMIN=1e-30;
  const qab=a+b,qap=a+1,qam=a-1;
  let c=1,d=1-qab*x/qap;
  if(Math.abs(d)<FPMIN)d=FPMIN; d=1/d; let h=d;
  for(let m=1;m<=MAXIT;m++){
    const m2=2*m;
    let aa=m*(b-m)*x/((qam+m2)*(a+m2));
    d=1+aa*d; if(Math.abs(d)<FPMIN)d=FPMIN;
    c=1+aa/c; if(Math.abs(c)<FPMIN)c=FPMIN;
    d=1/d; h*=d*c;
    aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));
    d=1+aa*d; if(Math.abs(d)<FPMIN)d=FPMIN;
    c=1+aa/c; if(Math.abs(c)<FPMIN)c=FPMIN;
    d=1/d; const del=d*c; h*=del;
    if(Math.abs(del-1)<EPS)break;
  }
  return h;
}

function _incompleteBeta(x,a,b){
  if(x<=0)return 0; if(x>=1)return 1;
  const lb=_logGamma(a)+_logGamma(b)-_logGamma(a+b);
  if(x<(a+1)/(a+b+2)){
    return Math.exp(a*Math.log(x)+b*Math.log(1-x)-lb)/a*_betaCF(x,a,b);
  }
  return 1-Math.exp(b*Math.log(1-x)+a*Math.log(x)-lb)/b*_betaCF(1-x,b,a);
}

/**
 * Two-tailed p-value: P(|T| >= |t|) with `df` degrees of freedom.
 * Guard: |t|=Infinity (perfect r=±1) → p=0 exactly.
 */
function tDistPValue(t, df){
  if(!isFinite(t))return 0;
  if(df<=0)return NaN;
  if(t===0)return 1;
  return _incompleteBeta(df/(df+t*t), df/2, 0.5);
}

// ─── Step 2: Bonferroni multiple-comparison correction ───────────────────────
// Eligible lags: lag ≥ 1 AND (totalWeeks − lag) ≥ 8 (spec §3).
// Peak = highest r among eligible lags. Two-tailed p × m, capped at 1.
function computeBonferroni(corrResults, totalWeeks, alpha = 0.05) {
  const eligible = corrResults.filter(c => c.lag >= 1 && (totalWeeks - c.lag) >= 8);
  const m = eligible.length;

  if (m === 0) {
    return {
      bonferroni_family_size:      0,
      bonferroni_peak_p_raw:       null,
      bonferroni_peak_p_corrected: null,
      bonferroni_peak_survives:    false,
      bonferroni_peak_df:          null,
    };
  }

  const peak  = eligible.reduce((best, c) => c.r > best.r ? c : best, eligible[0]);
  const n_k   = totalWeeks - peak.lag;
  const df_k  = n_k - 2;
  const t_k   = Math.abs(peak.r) >= 1
    ? Infinity
    : peak.r * Math.sqrt(df_k) / Math.sqrt(1 - peak.r ** 2);
  const p_raw       = tDistPValue(t_k, df_k);
  const p_corrected = Math.min(1.0, p_raw * m);

  return {
    bonferroni_family_size:      m,
    bonferroni_peak_p_raw:       p_raw,
    bonferroni_peak_p_corrected: p_corrected,
    bonferroni_peak_survives:    p_corrected <= alpha,
    bonferroni_peak_df:          df_k,
  };
}

// ─── DATA LAYER ───────────────────────────────────────────────────────────────
// All BNB calculation logic lives here. No visual ever calculates data.
// Every function is pure — same inputs → same outputs, no DOM/global reads.
// When a filter changes, re-run only from the appropriate step, not from scratch.
const DataLayer = {

  // ── Classification ──────────────────────────────────────────────────────────
  BRAND_RE: /(?<!non[-\s])(?<!non)\b(brand(?:ed)?)\b/i,

  /** Tag each row with .isBrand. Called once at data load; result is cached. */
  classifyCampaigns(rows){
    const map={};
    for(const r of rows){
      if(r.campaign in map) continue;
      map[r.campaign]=DataLayer.BRAND_RE.test(r.campaign)||DataLayer.BRAND_RE.test(r.label??'');
    }
    for(const r of rows) r.isBrand=map[r.campaign]||false;
    // Log unclassified (non-brand) campaigns for developer awareness
    Object.entries(map).filter(([,v])=>!v).forEach(([c])=>console.log(`[BnB] Non-brand campaign: "${c}"`));
    return rows;
  },

  // ── NB Exposure Signal ──────────────────────────────────────────────────────
  /** Position-weighted NB impression score for a set of rows (non-brand only). */
  calcWeightedNBExposureScore(nbRows){
    let s=0;
    for(const r of nbRows){
      const topOnly=Math.max(0,r.imprTopPct-r.imprAbsTopPct);
      s+=r.imprAbsTopPct*r.impr*1.0+topOnly*r.impr*0.6+(1-r.imprTopPct)*r.impr*0.2;
    }
    return s;
  },

  // ── Week Splitting ───────────────────────────────────────────────────────────
  /**
   * Split weeks into high / low NB groups at the median of the chosen signal.
   * nbMetricKey: 'weighted_nb_exposure' | 'nb_clicks' | 'nb_impressions' | 'nb_spend'
   */
  splitWeeksByNBExposure(weeks, nbMetricKey='weighted_nb_exposure'){
    const getFn={
      weighted_nb_exposure: w=>DataLayer.calcWeightedNBExposureScore(w.rows.filter(r=>!r.isBrand)),
      nb_clicks:            w=>w.rows.filter(r=>!r.isBrand).reduce((s,r)=>s+r.clicks,0),
      nb_impressions:       w=>w.rows.filter(r=>!r.isBrand).reduce((s,r)=>s+r.impr,0),
      nb_spend:             w=>w.rows.filter(r=>!r.isBrand).reduce((s,r)=>s+r.cost,0),
    }[nbMetricKey]??(w=>0);
    const scores=weeks.map(getFn);
    const sorted=[...scores].sort((a,b)=>a-b);
    const medianThreshold=sorted[Math.floor(sorted.length/2)]??0;
    return{
      highWeeks: weeks.filter((_,i)=>scores[i]>=medianThreshold),
      lowWeeks:  weeks.filter((_,i)=>scores[i]< medianThreshold),
      medianThreshold, nbMetricKey, scores,
    };
  },

  /** Aggregate brand metrics across a set of weeks. Rate metrics derived from raw totals. */
  aggregateBrandMetrics(weeks){
    let impr=0,clicks=0,conv=0,cost=0,sisElig=0,sisWon=0;
    for(const w of weeks){
      for(const r of w.rows.filter(r=>r.isBrand)){
        impr+=r.impr; clicks+=r.clicks; conv+=r.conv; cost+=r.cost;
        const e=r.sis>0?r.impr/r.sis:0; sisElig+=e; sisWon+=e*r.sis;
      }
    }
    const nw=weeks.length||1;
    return{
      impressions:impr, clicks, conversions:conv, cost,
      sis:sisElig>0?sisWon/sisElig*100:null,
      ctr:impr>0?clicks/impr:null,
      cvr:clicks>0?conv/clicks:null,
      cpa:conv>0?cost/conv:null,
      cpc:clicks>0?cost/clicks:null,
      avgWeeklyClicks:clicks/nw,
      avgWeeklyConv:conv/nw,
      avgWeeklyCost:cost/nw,
    };
  },

  // ── Gap Calculation ──────────────────────────────────────────────────────────
  /**
   * Pairwise normalised gap between two values.
   * higherIsBetter=true  → high NB is "better"; retained = lowVal/highVal
   * higherIsBetter=false → low NB is "better" (lower CPA etc.); retained = highVal/lowVal
   * Returns null when either value is missing or zero.
   */
  calcMetricGap(highVal, lowVal, higherIsBetter){
    if(highVal==null||lowVal==null||highVal===0||lowVal===0) return null;
    if(higherIsBetter){
      const retained=lowVal/highVal;
      return{retained, gap:1-retained, pctDelta:(highVal-lowVal)/Math.abs(lowVal)*100};
    } else {
      const retained=highVal/lowVal;
      return{retained, gap:1-retained, pctDelta:(lowVal-highVal)/Math.abs(highVal)*100};
    }
  },

  /** Run calcMetricGap across all METRIC_DEFINITIONS. */
  calcAllMetricGaps(highAgg, lowAgg){
    return METRIC_DEFINITIONS.map(def=>{
      const hv=highAgg[def.key], lv=lowAgg[def.key];
      const g=DataLayer.calcMetricGap(hv,lv,def.higherIsBetter);
      return{...def, highVal:hv, lowVal:lv, ...(g??{retained:null,gap:null,pctDelta:null})};
    });
  },

  // ── Confidence ───────────────────────────────────────────────────────────────
  /**
   * Single confidence object consumed by all visuals.
   * high:   totalWeeks >= 8, no major flags
   * medium: totalWeeks >= 6, minor flags only
   * low:    totalWeeks < 6 OR major flags present
   * none:   no data or unrecoverable
   */
  assessConfidence(totalWeeks, recentWeeksCount, warnings=[], bonferroni=null, n_peak=null){
    const MAJOR=['ALL_NEGATIVE','LOW_VARIANCE_SOURCE','LOW_VARIANCE_TARGET'];
    const majorFlags=warnings.filter(w=>MAJOR.includes(w));
    const minorFlags=warnings.filter(w=>!MAJOR.includes(w));
    let level;
    if(totalWeeks===0||majorFlags.length>0) level='none';
    else if(totalWeeks<6) level='low';
    else if(totalWeeks<8||minorFlags.length>0) level='medium';
    else level='high';

    // Spec §5–6: one-tier downgrade helper (floor: low); directional sits between medium and low
    const _downOne = t => t==='high'?'medium': t==='medium'?'directional': t==='directional'?'low':t;

    // §5.2 Bonferroni downgrade
    let bonferroni_downgrade_reason = null;
    if(bonferroni && bonferroni.bonferroni_family_size > 0 && !bonferroni.bonferroni_peak_survives && level!=='none'){
      level = _downOne(level);
      bonferroni_downgrade_reason = 'A peak lag is observed, but the relationship is not statistically validated. This may indicate a weak or noisy signal rather than a clear timing pattern.';
    }

    // §6 Pair count downgrade (independent of Bonferroni)
    let pair_count_downgraded = false;
    if(n_peak !== null && n_peak < 12 && level !== 'none'){
      level = _downOne(level);
      pair_count_downgraded = true;
    }

    return{level,warnings,totalWeeks,recentWeeks:recentWeeksCount,meetsMinimum:level==='medium'||level==='high',bonferroni_downgrade_reason,pair_count_downgraded};
  },

  // ── Momentum ─────────────────────────────────────────────────────────────────
  /**
   * Compares last-N-weeks gap trend to full-period gap.
   * Narrowing gap = improving (green ↑). Widening = worsening (red ↓). <0.8pp = flat.
   * Returns null when confidence is low/none or insufficient recent weeks.
   */
  calcMomentum(metricGaps, recentWeeks, confidence){
    if(!confidence||!['medium','high'].includes(confidence.level))
      return{type:null,delta:null,arrow:null,label:null,color:null,suppressed:true,reason:'Confidence too low'};
    if(!recentWeeks||recentWeeks.length<3)
      return{type:null,delta:null,arrow:null,label:null,color:null,suppressed:true,reason:'Insufficient recent weeks'};
    const validGaps=metricGaps.filter(g=>g.gap!=null);
    if(!validGaps.length) return null;
    const fullAvg=validGaps.reduce((s,g)=>s+g.gap,0)/validGaps.length;
    // Recompute gaps for recent weeks only
    const{highWeeks:rHigh,lowWeeks:rLow}=DataLayer.splitWeeksByNBExposure(recentWeeks);
    const rHighAgg=DataLayer.aggregateBrandMetrics(rHigh);
    const rLowAgg =DataLayer.aggregateBrandMetrics(rLow);
    const recentGaps=DataLayer.calcAllMetricGaps(rHighAgg,rLowAgg).filter(g=>g.gap!=null);
    if(!recentGaps.length) return null;
    const recentAvg=recentGaps.reduce((s,g)=>s+g.gap,0)/recentGaps.length;
    const delta=recentAvg-fullAvg; // negative = narrowing = good
    const ABS=Math.abs(delta);
    if(ABS<0.008) return{type:'flat',delta,arrow:'→',label:'Stable gap trend',color:'#B4B2A9',suppressed:false,reason:null};
    if(delta<0)   return{type:'improving',delta,arrow:'↑',label:`Gap narrowing (${(ABS*100).toFixed(1)}pp)`,color:'#1D9E75',suppressed:false,reason:null};
    return       {type:'worsening',delta,arrow:'↓',label:`Gap widening (+${(ABS*100).toFixed(1)}pp)`,color:'#E24B4A',suppressed:false,reason:null};
  },

  /** Per-bucket momentum — same logic as calcMomentum but filtered to one bucket. */
  calcBucketMomentum(bucket, metricGaps, recentWeeks, confidence){
    if(!confidence||!['medium','high'].includes(confidence.level))
      return{type:null,arrow:null,label:null,color:null,suppressed:true,reason:'Confidence too low'};
    if(!recentWeeks||recentWeeks.length<3)
      return{type:null,arrow:null,label:null,color:null,suppressed:true,reason:'Insufficient recent weeks'};
    const bucketGaps=metricGaps.filter(g=>(g.bucket===bucket||g.crossBucket===bucket)&&g.gap!=null);
    if(!bucketGaps.length) return{type:null,arrow:null,label:null,color:null,suppressed:true,reason:'No data'};
    const fullAvg=bucketGaps.reduce((s,g)=>s+g.gap,0)/bucketGaps.length;
    const{highWeeks:rHigh,lowWeeks:rLow}=DataLayer.splitWeeksByNBExposure(recentWeeks);
    const rHighAgg=DataLayer.aggregateBrandMetrics(rHigh);
    const rLowAgg=DataLayer.aggregateBrandMetrics(rLow);
    const recentBucketGaps=DataLayer.calcAllMetricGaps(rHighAgg,rLowAgg).filter(g=>(g.bucket===bucket||g.crossBucket===bucket)&&g.gap!=null);
    if(!recentBucketGaps.length) return{type:null,arrow:null,label:null,color:null,suppressed:true,reason:'No recent data'};
    const recentAvg=recentBucketGaps.reduce((s,g)=>s+g.gap,0)/recentBucketGaps.length;
    const delta=recentAvg-fullAvg;
    const ABS=Math.abs(delta);
    if(ABS<0.008) return{type:'flat',delta,arrow:'\u2192',label:'Stable vs period avg',color:'#B4B2A9',suppressed:false,reason:null};
    if(delta<0)   return{type:'improving',delta,arrow:'\u2191',label:`Gap narrowing \u2212${(ABS*100).toFixed(1)}pp vs period avg`,color:'#1D9E75',suppressed:false,reason:null};
    return       {type:'worsening',delta,arrow:'\u2193',label:`Gap widening +${(ABS*100).toFixed(1)}pp vs period avg`,color:'#E24B4A',suppressed:false,reason:null};
  },

  // ── Period Utilities ─────────────────────────────────────────────────────────
  /**
   * Detect appropriate chunk size for the selected period.
   * mode:'signal' — calendar-aware, no absorption (used on this page).
   * mode:'projection' — equal chunks with absorption (future page, TBD).
   */
  detectChunkSize(dateRange, mode='signal'){
    if(mode==='signal'){
      if(dateRange<=7)  return{chunkSize:1,  unit:'day',   mode};
      if(dateRange<=90) return{chunkSize:7,  unit:'week',  mode};
      return{chunkSize:'month',unit:'month',mode};
    }
    return{chunkSize:7,unit:'week',mode}; // projection TBD
  },

  /** Return the most recent n complete weeks from a weeks array. */
  getRecentWeeks(weeks, n=4){
    return weeks.slice(-Math.min(n,weeks.length));
  },

  /**
   * Zero-fill (volume metrics) or exclude missing dates (rate metrics).
   * Returns [{date, value}] sorted ascending.
   */
  alignSeries(rows, metricKey, dateRange){
    const RATE=['ctr','cvr','cpa','cpc'];
    const isRate=RATE.includes(metricKey);
    const byDate={};
    for(const r of rows){
      if(!byDate[r.date]) byDate[r.date]={impr:0,clicks:0,conv:0,cost:0};
      const d=byDate[r.date];
      d.impr+=r.impr; d.clicks+=r.clicks; d.conv+=r.conv; d.cost+=r.cost;
    }
    return Object.entries(byDate).sort().map(([date,d])=>{
      let value;
      if(metricKey==='impressions') value=d.impr;
      else if(metricKey==='clicks') value=d.clicks;
      else if(metricKey==='conversions') value=d.conv;
      else if(metricKey==='cost') value=d.cost;
      else if(metricKey==='ctr')  value=d.impr>0?d.clicks/d.impr:null;
      else if(metricKey==='cvr')  value=d.clicks>0?d.conv/d.clicks:null;
      else if(metricKey==='cpa')  value=d.conv>0?d.cost/d.conv:null;
      else if(metricKey==='cpc')  value=d.clicks>0?d.cost/d.clicks:null;
      else value=0;
      return{date,value:value??0};
    }).filter(p=>!isRate||p.value!==0);
  },
};
// ─────────────────────────────────────────────────────────────────────────────

function calcAttributionWindow(weeks){
  const nbSeries=[], brandSeries=[];
  for(const w of weeks){
    const nb=w.rows.filter(r=>!r.isBrand);
    const br=w.rows.filter(r=>r.isBrand);
    // NB exposure: position-weighted impressions (abs-top > top > other)
    let nbScore=0;
    for(const r of nb){
      const topOnly=Math.max(0, r.imprTopPct-r.imprAbsTopPct);
      nbScore += r.imprAbsTopPct*r.impr*1.0 + topOnly*r.impr*0.6 + (1-r.imprTopPct)*r.impr*0.2;
    }
    // Brand signal: weighted-average Search Impression Share
    let brElig=0, brWon=0;
    for(const r of br){
      const elig=r.sis>0?r.impr/r.sis:0;
      brElig+=elig; brWon+=elig*r.sis;
    }
    nbSeries.push(nbScore);
    brandSeries.push(brElig>0?brWon/brElig:0);
  }
  // Always compute all 15 lags (0-14) so the bar chart is fully populated.
  const corrResults=crossCorrelation(nbSeries, brandSeries, 14);
  // For peak selection, only consider lags with at least 3 paired data points.
  // At lag k, there are (n - k) paired data points. Require at least 3: k ≤ n-3.
  // e.g. 6 weeks → reliableMax 3; 12 weeks → reliableMax 9; 17+ weeks → reliableMax 14.
  const reliableMax=Math.min(14, Math.max(0, weeks.length-3));
  const reliableResults=corrResults.filter(c=>c.lag<=reliableMax);
  const peakObj=(reliableResults.length>0?reliableResults:corrResults)
    .reduce((best,c)=>c.r>best.r?c:best, (reliableResults.length>0?reliableResults:corrResults)[0]);
  const sharpness=assessSharpness(reliableResults.length>0?reliableResults:corrResults);
  return {corrResults, reliableMax, peakLag:peakObj.lag, peakR:peakObj.r, sharpness, nbSeries, brandSeries, weeks};
}

// Orchestration layer: calls DataLayer → passes pre-computed data to renderers.
// Visuals never calculate — they only render what they receive.
function renderBnb(){
  const noCols = !META.hasBnbColumns;
  const insuffWarn = (msg) => `<div class="aw-warn"><span class="aw-warn-icon">&#9888;</span>${msg}</div>`;

  if(noCols){
    document.getElementById('bnb-lagged-chart').innerHTML = '';
    document.getElementById('bnb-quality-card').innerHTML = '';
    document.getElementById('bnb-attribution').innerHTML  = insuffWarn('The uploaded file is missing position share columns (Impr. (top) %, Impr. (Abs. Top) %, Search exact match IS). Re-export your report with these columns to enable Brand vs. Non-brand analysis.');
    document.getElementById('bnb-lag-dist').innerHTML     = '';
    document.getElementById('bnb-gap-chart').innerHTML       = '';
    document.getElementById('bnb-bucket-scorecard-2').innerHTML = '';
    document.getElementById('bnb-exposure-trend').innerHTML = '';
    return;
  }

  // ── Step 1: filter + chunk ──────────────────────────────────────────────────
  const periodRows    = filterByPeriod(RAW, state.activePeriod);
  const completeWeeks = getCompleteWeeks(periodRows);
  const recentWeeks   = DataLayer.getRecentWeeks(completeWeeks, 4);
  const confidence    = DataLayer.assessConfidence(completeWeeks.length, recentWeeks.length, []);

  if(!confidence.meetsMinimum){
    const w = insuffWarn('Not enough complete weeks for a reliable signal — select a longer date range for this analysis.');
    ['bnb-lagged-chart','bnb-quality-card','bnb-attribution','bnb-lag-dist','bnb-gap-chart','bnb-bucket-scorecard-2','bnb-exposure-trend'].forEach(id=>{
      const title={'bnb-lagged-chart':'Consideration Journey','bnb-quality-card':'Brand Quality Signal','bnb-attribution':'Attribution Window','bnb-lag-dist':'Lag Distribution','bnb-gap-chart':'NB Exposure Sensitivity','bnb-bucket-scorecard-2':'NB Exposure Sensitivity','bnb-exposure-trend':'NB Exposure Trend'}[id];
      document.getElementById(id).innerHTML=`<div class="card"><div class="card-title">${title}</div>${w}</div>`;
    });
    return;
  }

  // ── Step 2: split weeks + aggregate brand metrics ───────────────────────────
  const nbMetricKey = bnbLagSrc.startsWith('nb_') ? bnbLagSrc : 'weighted_nb_exposure';
  const {highWeeks, lowWeeks, medianThreshold, scores: nbScores} = DataLayer.splitWeeksByNBExposure(completeWeeks, nbMetricKey);
  const highAgg  = DataLayer.aggregateBrandMetrics(highWeeks);
  const lowAgg   = DataLayer.aggregateBrandMetrics(lowWeeks);
  const metricGaps     = DataLayer.calcAllMetricGaps(highAgg, lowAgg);
  const momentum       = DataLayer.calcMomentum(metricGaps, recentWeeks, confidence);
  const bucketMomentum = {
    traffic:    DataLayer.calcBucketMomentum('traffic',    metricGaps, recentWeeks, confidence),
    engagement: DataLayer.calcBucketMomentum('engagement', metricGaps, recentWeeks, confidence),
    cost:       DataLayer.calcBucketMomentum('cost',       metricGaps, recentWeeks, confidence),
  };

  // ── Step 3: attribution window + lag distribution ───────────────────────────
  const aw      = calcAttributionWindow(completeWeeks);
  const lagData = computeLagDistribution(completeWeeks, bnbLagSrc, bnbLagTgt);

  // ── Step 4: push to renderers (pure display — no calculations inside) ───────
  renderV1Chart(aw, completeWeeks);
  _qualityCardData = {highAgg, lowAgg, metricGaps, confidence, momentum, medianThreshold, nbMetricKey, highCount:highWeeks.length, lowCount:lowWeeks.length, totalWeeks:completeWeeks.length};
  renderQualityCard(_qualityCardData);
  renderAttributionCard(aw, completeWeeks, lagData);
  renderLagDistributionCard(lagData);
  renderGapBarChart(metricGaps);
  renderNbExposureTrend(completeWeeks, nbScores, medianThreshold);
  _bucketSlots = [];
  renderBucketUnit(metricGaps, bucketMomentum, confidence, completeWeeks.length, 'bnb-bucket-scorecard-2');
  syncQualityCardHeight();
}

function renderKwInlineChart(filtered, kpiDef){
  const canvas = document.getElementById('kw-trend-chart');
  if(!canvas) return;
  if(kwTrendChart){ kwTrendChart.destroy(); kwTrendChart=null; }

  const isWeekly = isWeeklyMode();
  const buckets={};
  for(const r of filtered){
    const k=isWeekly?getWeekLabel(r.dateMs):new Date(r.dateMs).toISOString().slice(0,10);
    if(!buckets[k]) buckets[k]=[];
    buckets[k].push(r);
  }
  const labels=Object.keys(buckets).sort();
  const agg=labels.map(l=>sumRows(buckets[l]));

  const spanDays=state.customRange?Math.round((state.customRange.endMs-state.customRange.startMs)/86400000):null;
  const smoothWin=spanDays?(spanDays<=14?3:7):(state.activePeriod==='7D'?3:state.activePeriod==='30D'?7:3);
  const rawRank=agg.map(a=>+(a.isLostRank*100).toFixed(2));
  const rawBudget=agg.map(a=>+(a.isLostBudget*100).toFixed(2));

  const datasets=[
    {label:'SIS %',     data:agg.map(a=>+(a.sis*100).toFixed(2)), borderColor:C.green, backgroundColor:'transparent', borderWidth:2, pointRadius:0, tension:0.3, yAxisID:'y', borderDash:[]},
    {label:'IS Lost Rank',   data:movingAvg(rawRank,smoothWin),   borderColor:C.muted, backgroundColor:'transparent', borderWidth:1.5, pointRadius:0, tension:0.3, yAxisID:'y', borderDash:[5,4]},
    {label:'IS Lost Budget', data:movingAvg(rawBudget,smoothWin), borderColor:C.muted, backgroundColor:'transparent', borderWidth:1.5, pointRadius:0, tension:0.3, yAxisID:'y', borderDash:[2,3]},
  ];
  if(kpiDef){
    datasets.push({label:kpiDef.label, data:agg.map(a=>{const v=a[kpiDef.key];return(v===null||!isFinite(v))?null:v}), borderColor:C.blue, backgroundColor:'transparent', borderWidth:2, pointRadius:0, tension:0.3, yAxisID:'y2', borderDash:[]});
  }

  function y2Tick(v){
    if(v===null) return '';
    if(!kpiDef) return v;
    if(kpiDef.fmt==='pct') return (v*100).toFixed(1)+'%';
    if(kpiDef.fmt==='usd') return '$'+v.toFixed(2);
    return Math.round(v).toLocaleString();
  }

  kwTrendChart=new Chart(canvas.getContext('2d'),{
    type:'line', data:{labels,datasets},
    options:{
      responsive:true, maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{display:true,position:'top',labels:{boxWidth:24,font:{size:11},color:'#6b7280'}},
        tooltip:{mode:'index',callbacks:{label:ctx=>{const ds=ctx.dataset,v=ctx.parsed.y;if(v===null)return null;if(ds.yAxisID==='y')return`${ds.label}: ${v.toFixed(1)}%`;return`${ds.label}: ${y2Tick(v)}`;}}}
      },
      scales:{
        x:{grid:{color:'#f0f1f7'},ticks:{color:C.muted,maxTicksLimit:12,font:{size:11}}},
        y:{min:0,max:100,grid:{color:'#f0f1f7'},ticks:{color:C.muted,callback:v=>v+'%',font:{size:11}}},
        y2:{display:!!kpiDef,position:'right',grid:{drawOnChartArea:false},ticks:{color:C.blue,callback:y2Tick,font:{size:11}}}
      }
    }
  });
}

      if(tp==='kw'){state.kwPageSelectedKw=null;state.activeKeyword=null;}
      if(tp==='mt') state.kwPageSelectedMt=null;
      renderKeywordsPage();
    });
  });
  body.querySelectorAll('.kw-sb-expand').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const tp=btn.closest('.kw-sb-card')?.dataset.cardType;
      if(tp) openKwExpandOverlay(tp);
    });
  });

  if(showKpi&&pd){const c=document.getElementById('kw-sb-kpi-canvas');if(c)kwSbKpiChart=renderSbKpiChart(c,pd.filtered,KPI_DEFS.find(k=>k.key===state.kwPageSelectedKpi));}
  if(showKw&&pd){const kw=pd.allKws.find(k=>k.kwKey===state.kwPageSelectedKw);const c=document.getElementById('kw-sb-kw-canvas');if(c&&kw)kwSbKwChart=renderSbKwChart(c,kw,pd.tMinMs,pd.tMaxMs);}
  if(showMt&&pd){const c=document.getElementById('kw-sb-mt-canvas');if(c)kwSbMtChart=renderSbMtChart(c,state.kwPageSelectedMt,pd.tableRows,pd.tMinMs,pd.tMaxMs,pd.acctAgg);}
}

function openKwExpandOverlay(cardType){
  const pd=_kwPageData;
  if(!pd) return;
  const MT_CLR6={'Exact match':C.blue,'Phrase match':'#7F77DD','Broad match':'#888780'};
  let title='',badge='',chartH=120,sourceHtml='';
  if(cardType==='kpi'){
    const kd=KPI_DEFS.find(k=>k.key===state.kwPageSelectedKpi);
    if(!kd) return;
    title=`SIS + ${kd.label}`;badge='Account · period';chartH=140;
    const kVal=sumRows(pd.filtered)[kd.key]??0;
    sourceHtml=`<div class="kpi-card" style="max-width:180px;pointer-events:none">
      <div class="kpi-label">${esc(kd.label)}</div><div class="kpi-value">${fmtKpi(kd,kVal)}</div>
    </div>`;
  } else if(cardType==='kw'){
    const kw=pd.allKws.find(k=>k.kwKey===state.kwPageSelectedKw);
    if(!kw) return;
    title=kw.kw;badge='CVR · chunks';
    const mc=MT_CLR6[kw.matchType]||C.muted;
    const cvrC=pd.acctAgg.cvr>0&&kw.cvr<pd.acctAgg.cvr?C.red:'inherit';
    const cpaC=pd.acctAgg.cpa&&kw.cpa!=null?(kw.cpa<pd.acctAgg.cpa?C.green:(kw.cpa>pd.acctAgg.cpa*1.25?C.red:'inherit')):'inherit';
    const sig=kw.signal==='scale'?`<span class="kw-sig-badge" style="background:#EAF3DE;color:#27500A">Scale</span>`
      :kw.signal==='drag'?`<span class="kw-sig-badge" style="background:#FCEBEB;color:#791F1F">Dragger</span>`:'';
    sourceHtml=`<table class="data-table" style="width:100%"><tbody><tr>
      <td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600">${esc(kw.kw)}</td>
      <td><span class="kw-mt-pill" style="background:${mc}1a;color:${mc}">${esc(kw.matchType||'—')}</span></td>
      <td style="color:${cvrC}">${fmtNum(kw.cvr,'pct')}</td>
      <td style="color:${cpaC}">${fmtNum(kw.cpa,'usd')}</td>
      <td>${fmtNum(kw.cost,'usd')}</td><td>${sig}</td>
    </tr></tbody></table>`;
  } else if(cardType==='mt'){
    const mt=state.kwPageSelectedMt;
    if(!mt) return;
    title=mt;badge='clicks · conv. · cost';
    const m4={clicks:0,conv:0,cost:0,impr:0};
    for(const kw of pd.allKws){if(kw.matchType!==mt)continue;m4.clicks+=kw.clicks||0;m4.conv+=kw.conv||0;m4.cost+=kw.cost||0;m4.impr+=kw.impr||0;}
    m4.ctr=m4.impr>0?m4.clicks/m4.impr:0;m4.cvr=m4.clicks>0?m4.conv/m4.clicks:0;
    const tk=pd.acctAgg.clicks||1,tn=pd.acctAgg.conv||1,ts=pd.acctAgg.cost||1;
    const cp=m4.clicks/tk*100,np=m4.conv/tn*100,sp=m4.cost/ts*100;
    const mc=MT_CLR6[mt]||C.muted;
    sourceHtml=`<div>
      <div style="display:flex;justify-content:space-between;margin-bottom:5px">
        <span class="kw-mt-pill" style="background:${mc}1a;color:${mc}">${esc(mt)}</span>
        <span style="font-size:11px;color:var(--muted)">CTR ${fmtNum(m4.ctr,'pct')} · CVR ${fmtNum(m4.cvr,'pct')}</span>
      </div>
      <div style="display:flex;gap:2px;height:9px;border-radius:4px;overflow:hidden;background:#f0f0ef">
        <div style="width:${cp.toFixed(1)}%;background:#378ADD"></div>
        <div style="width:${np.toFixed(1)}%;background:#1D9E75"></div>
        <div style="width:${sp.toFixed(1)}%;background:#EF9F27"></div>
      </div>
      <div style="display:flex;gap:8px;margin-top:3px;font-size:10px">
        <span style="color:#378ADD">${cp.toFixed(0)}% clicks</span>
        <span style="color:#1D9E75">${np.toFixed(0)}% conv.</span>
        <span style="color:#EF9F27">${sp.toFixed(0)}% cost</span>
      </div>
    </div>`;
  }
  document.getElementById('kw-overlay')?.remove();
  if(kwOverlayChart){kwOverlayChart.destroy();kwOverlayChart=null;}
  const typeLabel=cardType==='kpi'?'KPI tile':cardType==='kw'?'keyword row':'match type';
  document.body.insertAdjacentHTML('beforeend',`<div id="kw-overlay">
    <div id="kw-overlay-card">
      <div id="kw-overlay-head">
        <span>${esc(title)} <span style="font-size:11px;font-weight:400;color:var(--muted)">${badge}</span></span>
        <button id="kw-overlay-close">×</button>
      </div>
      <div id="kw-overlay-chart-wrap" style="height:${chartH}px"><canvas id="kw-overlay-canvas"></canvas></div>
      <div id="kw-overlay-source">
        <div class="kw-overlay-source-lbl">Source — ${typeLabel}</div>
        ${sourceHtml}
      </div>
    </div>
  </div>`);
  const overlay=document.getElementById('kw-overlay');
  const closeOv=()=>{if(kwOverlayChart){kwOverlayChart.destroy();kwOverlayChart=null;}overlay.remove();};
  document.getElementById('kw-overlay-close').addEventListener('click',closeOv);
  overlay.addEventListener('click',e=>{if(e.target===overlay)closeOv();});
  const canvas=document.getElementById('kw-overlay-canvas');
  if(!canvas) return;
  if(cardType==='kpi') kwOverlayChart=renderSbKpiChart(canvas,pd.filtered,KPI_DEFS.find(k=>k.key===state.kwPageSelectedKpi));
  else if(cardType==='kw'){const kw=pd.allKws.find(k=>k.kwKey===state.kwPageSelectedKw);if(kw)kwOverlayChart=renderSbKwChart(canvas,kw,pd.tMinMs,pd.tMaxMs);}
  else if(cardType==='mt') kwOverlayChart=renderSbMtChart(canvas,state.kwPageSelectedMt,pd.tableRows,pd.tMinMs,pd.tMaxMs,pd.acctAgg);
}

function renderEfficiencyScatter(){
  const canvas=document.getElementById('kw-eff-scatter');
  if(!canvas||!_kwPageData) return;

  const kwData=getKwScatterData(_kwPageData.tableRows);
  if(!kwData.length){
    if(kwEfficiencyChart){kwEfficiencyChart.destroy();kwEfficiencyChart=null;}
    return;
  }

  // Bubble sizing — relative to average so sizes are meaningful regardless of account scale
  const metricKey=state.bubbleMetric;
  const avg=kwData.reduce((s,k)=>s+(k[metricKey]||0),0)/kwData.length;
  const getR=v=>Math.max(4,Math.min(24,Math.round((v/Math.max(avg,0.0001))*10)));

  // Axis bounds in % units (data stored as decimals)
  const allCtr=kwData.map(k=>k.ctr*100);
  const allCvr=kwData.map(k=>k.cvr*100);
  // Use p95 to prevent outliers from collapsing the scale; also ensure the floor
  // line appears at most ~50% up the axis so sliders feel centred when mid-range.
  const _p95=arr=>{const s=[...arr].sort((a,b)=>a-b);return s[Math.floor(0.95*(s.length-1))]||0;};
  const maxCtr=Math.max(_p95(allCtr)*1.20, state.ctrFloor*100*2.0, 5)||10;
  const maxCvr=Math.max(_p95(allCvr)*1.20, state.cvrFloor*100*2.0, 5)||10;

  // Match type colour config — activeFill is the darkened shade for the selected bubble
  const MT_CFG={
    'Exact match': {fill:'#1D9E75BB',activeFill:'#085041',border:'#1D9E75'},
    'Phrase match':{fill:'#378ADDBB',activeFill:'#042C53',border:'#378ADD'},
    'Broad match': {fill:'#E24B4ABB',activeFill:'#501313',border:'#E24B4A'},
  };
  const MT_FALLBACK={fill:'#888780BB',activeFill:'#333331',border:'#888780'};

  const byMt={};
  kwData.forEach(kw=>{
    const mt=kw.matchType||'Unknown';
    if(!byMt[mt]) byMt[mt]=[];
    byMt[mt].push(kw);
  });

  const datasets=Object.entries(byMt).map(([mt,kws])=>{
    const cfg=MT_CFG[mt]||MT_FALLBACK;
    return{
      label:mt,
      data:kws.map(kw=>({x:kw.ctr*100,y:kw.cvr*100,r:getR(kw[metricKey]||0),_kw:kw})),
      // Per-point arrays: active bubble gets dark fill + thicker border
      backgroundColor:kws.map(kw=>kw.key===state.activeKw?cfg.activeFill:cfg.fill),
      borderColor:kws.map(()=>cfg.border),
      borderWidth:kws.map(kw=>kw.key===state.activeKw?2.5:1.5),
    };
  });

  // If chart already exists (slider / metric / activeKw / bucket change), update in place
  if(kwEfficiencyChart){
    kwEfficiencyChart.data.datasets=datasets;
    if(state.expandedBucket){
      const bKws=kwData.filter(k=>getQuadrant(k)===state.expandedBucket);
      const bCtr=bKws.map(k=>k.ctr*100), bCvr=bKws.map(k=>k.cvr*100);
      kwEfficiencyChart.options.scales.x.max=bCtr.length?Math.max(_p95(bCtr)*1.20,state.ctrFloor*100*2.0,5):maxCtr;
      kwEfficiencyChart.options.scales.y.max=bCvr.length?Math.max(_p95(bCvr)*1.20,state.cvrFloor*100*2.0,5):maxCvr;
    } else {
      kwEfficiencyChart.options.scales.x.max=maxCtr;
      kwEfficiencyChart.options.scales.y.max=maxCvr;
    }
    kwEfficiencyChart.update({duration:300});
    return;
  }

  // ── Quadrant shading + reference lines (beforeDraw) ───────────────────────
  // Reads state directly — stays live on chart.update() without recreating.
  const quadrantPlugin={
    id:'kwEffQuadrant',
    beforeDraw(chart){
      const{ctx,scales:{x,y},chartArea:{left,right,top,bottom}}=chart;
      const ctrPx=x.getPixelForValue(state.ctrFloor*100);
      const cvrPx=y.getPixelForValue(state.cvrFloor*100);
      const eb=state.expandedBucket;
      const op=b=>eb?(b===eb?0.14:0.02):0.07;
      ctx.save();
      ctx.fillStyle=`rgba(29,158,117,${op('stars')})`;   ctx.fillRect(ctrPx,top,right-ctrPx,cvrPx-top);
      ctx.fillStyle=`rgba(55,138,221,${op('niche')})`;   ctx.fillRect(left,top,ctrPx-left,cvrPx-top);
      ctx.fillStyle=`rgba(239,159,39,${op('traffic')})`; ctx.fillRect(ctrPx,cvrPx,right-ctrPx,bottom-cvrPx);
      ctx.fillStyle=`rgba(136,135,128,${op('review')})`; ctx.fillRect(left,cvrPx,ctrPx-left,bottom-cvrPx);
      ctx.setLineDash([5,4]); ctx.strokeStyle='rgba(0,0,0,0.2)'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(ctrPx,top);  ctx.lineTo(ctrPx,bottom); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(left,cvrPx); ctx.lineTo(right,cvrPx);  ctx.stroke();
      ctx.setLineDash([]);
      ctx.font='10px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif';
      ctx.fillStyle='rgba(107,114,128,0.85)';
      ctx.textAlign='center'; ctx.textBaseline='bottom';
      ctx.fillText('CTR '+(state.ctrFloor*100).toFixed(1)+'%',ctrPx,top-2);
      ctx.textAlign='left'; ctx.textBaseline='middle';
      ctx.fillText('CVR '+(state.cvrFloor*100).toFixed(1)+'%',right+5,cvrPx);
      ctx.restore();
    }
  };

  // ── Active keyword label pill (afterDraw — renders last, never obscured) ──
  const activeKwLabelPlugin={
    id:'kwEffLabel',
    afterDraw(chart){
      if(!state.activeKw) return;
      let px,py,bubR,label;
      chart.data.datasets.forEach((ds,di)=>{
        ds.data.forEach((pt,pi)=>{
          if(pt._kw?.key!==state.activeKw) return;
          const meta=chart.getDatasetMeta(di);
          const elem=meta.data[pi];
          if(!elem) return;
          px=elem.x; py=elem.y; bubR=elem.options.radius||10;
          label=pt._kw.kw;
        });
      });
      if(px===undefined) return;

      const{ctx,chartArea:{top}}=chart;
      ctx.save();
      ctx.font='500 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif';
      const PADX=6,PADY=3,RR=3;
      const tw=ctx.measureText(label).width;
      const pw=tw+PADX*2, ph=11+PADY*2;
      const cx=px;
      const cy=Math.max(top+2, py-bubR-16-ph);

      // Pill background (cross-browser manual round rect)
      ctx.fillStyle='rgba(44,44,42,0.82)';
      ctx.beginPath();
      ctx.moveTo(cx-pw/2+RR,cy);
      ctx.lineTo(cx+pw/2-RR,cy);
      ctx.arcTo(cx+pw/2,cy,cx+pw/2,cy+RR,RR);
      ctx.lineTo(cx+pw/2,cy+ph-RR);
      ctx.arcTo(cx+pw/2,cy+ph,cx+pw/2-RR,cy+ph,RR);
      ctx.lineTo(cx-pw/2+RR,cy+ph);
      ctx.arcTo(cx-pw/2,cy+ph,cx-pw/2,cy+ph-RR,RR);
      ctx.lineTo(cx-pw/2,cy+RR);
      ctx.arcTo(cx-pw/2,cy,cx-pw/2+RR,cy,RR);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle='#fff';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.fillText(label,cx,cy+ph/2);
      ctx.restore();
    }
  };

  // If a bucket is already expanded when the chart is (re)created, zoom to it immediately
  const _initBkws=state.expandedBucket?kwData.filter(k=>getQuadrant(k)===state.expandedBucket):null;
  const initXMax=_initBkws?.length?Math.max(_p95(_initBkws.map(k=>k.ctr*100))*1.20,state.ctrFloor*100*2.0,5):maxCtr;
  const initYMax=_initBkws?.length?Math.max(_p95(_initBkws.map(k=>k.cvr*100))*1.20,state.cvrFloor*100*2.0,5):maxCvr;

  kwEfficiencyChart=new Chart(canvas.getContext('2d'),{
    type:'bubble',
    plugins:[quadrantPlugin,activeKwLabelPlugin],
    data:{datasets},
    options:{
      responsive:true,
      maintainAspectRatio:false,
      animation:{duration:200},
      onClick(evt,elements){
        if(elements.length){
          const el=elements[0];
          const pt=kwEfficiencyChart.data.datasets[el.datasetIndex].data[el.index];
          const key=pt?._kw?.key;
          if(key){
            if(state.activeKw===key){
              state.activeKw=null; state.activeKwSource=null; state.expandedBucket=null;
            } else {
              state.activeKw=key; state.activeKwSource='scatter';
              state.expandedBucket=getQuadrant(pt._kw);
            }
            renderEfficiencyScatter();
            renderBucketTable();
          }
        } else {
          if(state.activeKw){
            state.activeKw=null; state.activeKwSource=null; state.expandedBucket=null;
            renderEfficiencyScatter();
            renderBucketTable();
          }
        }
      },
      plugins:{
        legend:{display:false},
        tooltip:{
          backgroundColor:'#2C2C2A',
          filter:item=>item.element.options.radius>0,
          callbacks:{
            title(items){
              const kw=items[0]?.raw?._kw;
              return kw?`${kw.kw} (${kw.matchType||'Unknown'})`:'';
            },
            label(item){
              const kw=item.raw?._kw;
              if(!kw) return '';
              const mLabel={cost:'Cost',clicks:'Clicks',conv:'Conv.'}[state.bubbleMetric]||'';
              const mVal=state.bubbleMetric==='cost'?fmtNum(kw.cost,'usd')
                        :state.bubbleMetric==='clicks'?fmtNum(kw.clicks,'int')
                        :fmtNum(kw.conv,'dec');
              return[
                `CTR: ${(kw.ctr*100).toFixed(2)}%   CVR: ${(kw.cvr*100).toFixed(2)}%`,
                `CPA: ${kw.cpa?fmtNum(kw.cpa,'usd'):'—'}   ${mLabel}: ${mVal}`,
              ];
            }
          }
        }
      },
      scales:{
        x:{
          title:{display:true,text:'CTR (%)',color:'#888780',font:{size:11}},
          min:0,max:initXMax,
          grid:{color:'rgba(128,128,128,0.06)'},
          ticks:{color:'#888780',font:{size:11},callback:v=>v+'%'},
        },
        y:{
          title:{display:true,text:'CVR (%)',color:'#888780',font:{size:11}},
          min:0,max:initYMax,
          grid:{color:'rgba(128,128,128,0.06)'},
          ticks:{color:'#888780',font:{size:10},callback:v=>v+'%'},
        }
      }
    }
  });
}

function renderBucketTable(){
  const wrap=document.getElementById('kw-bucket-table-wrap');
  if(!wrap||!_kwPageData) return;

  const kwData=getKwScatterData(_kwPageData.tableRows);
  const showVsTarget=!!state.cpaTarget;
  const totalCols=showVsTarget?8:7;

  const BUCKETS=[
    {key:'stars',   label:'Stars',             textColor:'#27500A',dot:'#1D9E75',bg:'#EAF3DE'},
    {key:'niche',   label:'Niche converters',  textColor:'#0C447C',dot:'#378ADD',bg:'#E6F1FB'},
    {key:'traffic', label:'Traffic sinks',     textColor:'#633806',dot:'#EF9F27',bg:'#FAEEDA'},
    {key:'review',  label:'Review candidates', textColor:'#3C3B37',dot:'#888780',bg:'#F1EFE8'},
  ];

  const bucketMap={stars:[],niche:[],traffic:[],review:[]};
  kwData.forEach(kw=>bucketMap[getQuadrant(kw)].push(kw));

  const bucketAgg=bk=>{
    const kws=bucketMap[bk];
    if(!kws.length) return{n:0,avgCvr:0,avgCtr:0,avgCpa:null,totCost:0};
    const tC=kws.reduce((s,k)=>s+k.clicks,0), tV=kws.reduce((s,k)=>s+k.conv,0);
    const tI=kws.reduce((s,k)=>s+k.impr,0),  tK=kws.reduce((s,k)=>s+k.cost,0);
    return{n:kws.length,avgCvr:tC>0?tV/tC:0,avgCtr:tI>0?tC/tI:0,avgCpa:tV>0?tK/tV:null,totCost:tK};
  };

  const sortKws=kws=>{
    if(state.cpaTarget){
      return [...kws].sort((a,b)=>{
        if(!a.cpa&&!b.cpa) return 0;
        if(!a.cpa) return 1; if(!b.cpa) return -1;
        return (b.cpa-state.cpaTarget)-(a.cpa-state.cpaTarget);
      });
    }
    return [...kws].sort((a,b)=>b.cost-a.cost);
  };

  const fmtVsDiff=cpa=>{
    if(!state.cpaTarget||!cpa) return '<span style="color:var(--muted)">—</span>';
    const d=((cpa-state.cpaTarget)/state.cpaTarget)*100;
    const clr=d<0?'#27500A':'#791F1F';
    return `<span style="color:${clr};font-weight:600">${d>=0?'+':''}${d.toFixed(1)}%</span>`;
  };

  let html=`<div class="card" style="margin-top:12px">
    <div class="card-title">Quadrant breakdown</div>
    <table class="data-table"><thead><tr>
      <th>Quadrant</th>
      <th style="text-align:center">KWs</th>
      <th style="text-align:right">Avg CVR</th>
      <th style="text-align:right">Avg CTR</th>
      <th style="text-align:right">Avg CPA</th>
      <th style="text-align:right">Total cost</th>
      ${showVsTarget?'<th style="text-align:right">Avg vs target</th>':''}
      <th style="width:20px"></th>
    </tr></thead><tbody>`;

  BUCKETS.forEach(b=>{
    const a=bucketAgg(b.key);
    const isExp=state.expandedBucket===b.key;
    html+=`<tr class="kw-bucket-row" data-bucket="${b.key}" style="cursor:pointer;${isExp?'background:'+b.bg+';':''}">
      <td><span style="display:inline-flex;align-items:center;gap:7px">
        <span style="width:8px;height:8px;border-radius:50%;background:${b.dot};display:inline-block;flex-shrink:0"></span>
        <span style="font-weight:600;color:${b.textColor}">${b.label}</span>
      </span></td>
      <td style="text-align:center">${a.n}</td>
      <td style="text-align:right">${a.avgCvr?(a.avgCvr*100).toFixed(2)+'%':'—'}</td>
      <td style="text-align:right">${a.avgCtr?(a.avgCtr*100).toFixed(2)+'%':'—'}</td>
      <td style="text-align:right">${a.avgCpa?fmtNum(a.avgCpa,'usd'):'—'}</td>
      <td style="text-align:right">${fmtNum(a.totCost,'usd')}</td>
      ${showVsTarget?`<td style="text-align:right">${fmtVsDiff(a.avgCpa)}</td>`:''}
      <td style="text-align:center;color:var(--muted);font-size:14px;transition:transform .2s;transform:${isExp?'rotate(90deg)':'rotate(0)'}">&rsaquo;</td>
    </tr>`;

    if(isExp&&a.n>0){
      const sorted=sortKws(bucketMap[b.key]);
      html+=`<tr><td colspan="${totalCols}" style="padding:0;background:#f9fafb;border-top:1px solid var(--border)">
        <table style="width:100%;border-collapse:collapse;font-size:11px">
          <thead><tr style="color:var(--muted)">
            <th style="padding:4px 8px 4px 28px;text-align:left;font-weight:600;font-size:10px">Keyword</th>
            <th style="padding:4px 8px;text-align:right;font-weight:600;font-size:10px">CTR</th>
            <th style="padding:4px 8px;text-align:right;font-weight:600;font-size:10px">CVR</th>
            <th style="padding:4px 8px;text-align:right;font-weight:600;font-size:10px">Clicks</th>
            <th style="padding:4px 8px;text-align:right;font-weight:600;font-size:10px">Conv.</th>
            <th style="padding:4px 8px;text-align:right;font-weight:600;font-size:10px">Cost</th>
            <th style="padding:4px 8px;text-align:right;font-weight:600;font-size:10px">CPA</th>
            ${showVsTarget?'<th style="padding:4px 8px;text-align:right;font-weight:600;font-size:10px">vs target</th>':''}
          </tr></thead><tbody>`;

      sorted.forEach(kw=>{
        const fromBucket=state.activeKw===kw.key&&(state.activeKwSource==='bucket-table'||state.activeKwSource==='scatter');
        const fromKwTable=state.activeKw===kw.key&&state.activeKwSource==='kw-table';
        const rowBg=fromBucket?'#E6F1FB':fromKwTable?'#FAEEDA':'';
        const rowClr=fromBucket?'#0C447C':'';
        const trunc=kw.kw.length>40?kw.kw.slice(0,39)+'…':kw.kw;
        html+=`<tr class="kw-bucket-kw-row" data-kwkey="${kw.key}"
          style="cursor:pointer;${rowBg?'background:'+rowBg+';':''}${rowClr?'color:'+rowClr+';':''}">
          <td style="padding:3px 8px 3px 28px" title="${kw.kw}">${trunc} <span style="color:var(--muted);font-size:10px">(${kw.matchType||'?'})</span></td>
          <td style="padding:3px 8px;text-align:right">${(kw.ctr*100).toFixed(2)}%</td>
          <td style="padding:3px 8px;text-align:right">${(kw.cvr*100).toFixed(2)}%</td>
          <td style="padding:3px 8px;text-align:right">${fmtNum(kw.clicks,'int')}</td>
          <td style="padding:3px 8px;text-align:right">${fmtNum(kw.conv,'dec')}</td>
          <td style="padding:3px 8px;text-align:right">${fmtNum(kw.cost,'usd')}</td>
          <td style="padding:3px 8px;text-align:right">${kw.cpa?fmtNum(kw.cpa,'usd'):'—'}</td>
          ${showVsTarget?`<td style="padding:3px 8px;text-align:right">${fmtVsDiff(kw.cpa)}</td>`:''}
        </tr>`;
      });

      html+=`</tbody></table></td></tr>
      <tr style="background:#f9fafb"><td colspan="${totalCols}" style="padding:0;border-bottom:2px solid var(--border)"></td></tr>`;
    }
  });

  html+='</tbody></table></div>';
  wrap.innerHTML=html;

  wrap.querySelectorAll('.kw-bucket-row').forEach(row=>{
    row.addEventListener('click',()=>{
      const b=row.dataset.bucket;
      if(state.expandedBucket===b){
        // Collapsing — clear active keyword if it came from this table
        if(state.activeKwSource==='bucket-table'){
          state.activeKw=null; state.activeKwSource=null;
          state.activeKeyword=null; state.kwPageSelectedKw=null;
        }
        state.expandedBucket=null;
      } else {
        state.expandedBucket=b;
      }
      renderAll();
    });
  });

  wrap.querySelectorAll('.kw-bucket-kw-row').forEach(row=>{
    row.addEventListener('click',e=>{
      e.stopPropagation();
      const key=row.dataset.kwkey;
      if(state.activeKw===key&&state.activeKwSource==='bucket-table'){
        // Deselect — clear global filter, keep bucket expanded
        state.activeKw=null; state.activeKwSource=null;
        state.activeKeyword=null; state.kwPageSelectedKw=null;
      } else {
        const kw=kwData.find(k=>k.key===key);
        if(!kw) return;
        state.activeKw=key; state.activeKwSource='bucket-table';
        state.activeKeyword=kw.kw; state.lastKeyword=kw.kw;
        state.kwPageSelectedKw=kw.campaign+'|||'+kw.kw;
        state.activeCampaign=kw.campaign; state.lastCampaign=kw.campaign;
      }
      renderAll();
    });
  });
}

function renderNgramTable(){
  const tbody=document.getElementById('ngram-tbody');
  const showMoreBtn=document.getElementById('ngram-showmore');
  const scopeLbl=document.getElementById('ngram-scope');
  if(!tbody||!_kwPageData) return;
  const {tableRows}=_kwPageData;
  const grams=computeNgrams(tableRows,ngramSize);

  // Account-level CVR/CPA for colour thresholds
  const acctClicks=tableRows.reduce((s,r)=>s+(r.clicks||0),0);
  const acctConv=tableRows.reduce((s,r)=>s+(r.conv||0),0);
  const acctCost=tableRows.reduce((s,r)=>s+(r.cost||0),0);
  const acctCvr=acctClicks>0?acctConv/acctClicks:0;
  const acctCpa=acctConv>0?acctCost/acctConv:0;

  // Sort
  const {col,dir}=ngramSort;
  grams.sort((a,b)=>{
    const av=a[col]??0, bv=b[col]??0;
    if(typeof av==='string') return dir==='asc'?av.localeCompare(bv):bv.localeCompare(av);
    return dir==='asc'?av-bv:bv-av;
  });

  // Update sort arrows
  const cols=['gram','kwCount','impr','clicks','ctr','conv','cvr','cost','cpc','cpa'];
  cols.forEach(c=>{
    const el=document.getElementById('ngs-'+c);
    if(!el) return;
    el.textContent=c===col?(dir==='asc'?' ↑':' ↓'):'';
  });

  const LIMIT=10;
  const slice=ngramShowAll?grams:grams.slice(0,LIMIT);

  const pct=(n,d)=>d>0?(n/d*100).toFixed(1)+'%':'—';
  const cvrCls=cvr=>!acctCvr?'':(cvr>acctCvr*1.1?'ng-cvr-high':cvr<acctCvr*0.9?'ng-cvr-low':'');
  const cpaCls=cpa=>!acctCpa?'':(cpa<acctCpa*0.9?'ng-cpa-good':cpa>acctCpa*1.1?'ng-cpa-bad':'');

  let html='';
  slice.forEach((g,idx)=>{
    const kwSorted=[...g.keywords].sort((a,b)=>b.clicks-a.clicks).slice(0,10);
    const subCls=`ng-sub-${idx}`;
    const bgSub='background:#f9fafb';
    const borderT='border-top:1px solid var(--border)';
    html+=`<tr>
      <td style="font-weight:500">${g.gram}</td>
      <td style="text-align:center"><span class="ng-kw-count" data-idx="${idx}">${g.kwCount}</span></td>
      <td style="text-align:right">${fmtNum(g.impr,'int')}</td>
      <td style="text-align:right">${fmtNum(g.clicks,'int')}</td>
      <td style="text-align:right">${(g.ctr*100).toFixed(2)}%</td>
      <td style="text-align:right">${fmtNum(g.conv,'dec')}</td>
      <td style="text-align:right" class="${cvrCls(g.cvr)}">${(g.cvr*100).toFixed(2)}%</td>
      <td style="text-align:right">${fmtNum(g.cost,'usd')}</td>
      <td style="text-align:right">${fmtNum(g.cpc,'usd')}</td>
      <td style="text-align:right" class="${cpaCls(g.cpa)}">${g.cpa?fmtNum(g.cpa,'usd'):'—'}</td>
    </tr>
    <tr class="${subCls}" style="display:none;${bgSub}">
      <td colspan="3" style="padding:4px 8px 2px 28px;font-size:10px;font-weight:600;color:var(--muted);${borderT}">KEYWORD</td>
      <td style="padding:4px 8px 2px;text-align:right;font-size:10px;font-weight:600;color:var(--muted);${borderT}">% CLICKS</td>
      <td style="${borderT}"></td>
      <td style="padding:4px 8px 2px;text-align:right;font-size:10px;font-weight:600;color:var(--muted);${borderT}">% CONV.</td>
      <td style="${borderT}"></td>
      <td style="padding:4px 8px 2px;text-align:right;font-size:10px;font-weight:600;color:var(--muted);${borderT}">% COST</td>
      <td colspan="2" style="${borderT}"></td>
    </tr>
    ${kwSorted.map(k=>`<tr class="${subCls}" style="display:none;${bgSub}">
      <td colspan="3" style="padding:3px 8px 3px 28px;font-size:11px">${k.kw}</td>
      <td style="padding:3px 8px;text-align:right;font-size:11px">${pct(k.clicks,g.clicks)}</td>
      <td></td>
      <td style="padding:3px 8px;text-align:right;font-size:11px">${pct(k.conv,g.conv)}</td>
      <td></td>
      <td style="padding:3px 8px;text-align:right;font-size:11px">${pct(k.cost,g.cost)}</td>
      <td colspan="2"></td>
    </tr>`).join('')}
    <tr class="${subCls}" style="display:none;${bgSub}"><td colspan="10" style="padding:0;border-bottom:2px solid var(--border)"></td></tr>`;
  });
  tbody.innerHTML=html;

  // Wire expand toggles (re-queried since tbody was replaced)
  tbody.querySelectorAll('.ng-kw-count').forEach(span=>{
    span.addEventListener('click',e=>{
      e.stopPropagation();
      const rows=tbody.querySelectorAll(`.ng-sub-${span.dataset.idx}`);
      const hidden=rows[0]?.style.display==='none';
      rows.forEach(r=>r.style.display=hidden?'':'none');
    });
  });

  if(scopeLbl) scopeLbl.textContent=`${grams.length} n-gram${grams.length!==1?'s':''}`;

  if(showMoreBtn){
    if(grams.length>LIMIT){
      showMoreBtn.style.display='block';
      showMoreBtn.textContent=ngramShowAll?'Show less ↑':`Show ${grams.length-LIMIT} more ↓`;
    } else {
      showMoreBtn.style.display='none';
    }
  }
}

function renderKeywordsPage(){
  const container=document.getElementById('kw-container');
  if(!container) return;
  if(kwTrendChart){      kwTrendChart.destroy();      kwTrendChart=null; }
  if(kwScatterChart){    kwScatterChart.destroy();    kwScatterChart=null; }
  if(kwCvrChart){        kwCvrChart.destroy();        kwCvrChart=null; }
  if(kwEfficiencyChart){ kwEfficiencyChart.destroy(); kwEfficiencyChart=null; }
  if(kwSidebarObserver){ kwSidebarObserver.disconnect(); kwSidebarObserver=null; }

  // ── KPI grid ─────────────────────────────────────────────────────────────
  const filtered=getFilteredRows();
  let prior=filterPriorPeriod(RAW,state.activePeriod);
  if(state.activeCampaign) prior=prior.filter(r=>r.campaign===state.activeCampaign);
  if(state.activeKeyword)  prior=prior.filter(r=>r.keyword===state.activeKeyword);
  const curr=sumRows(filtered),prev=sumRows(prior);
  const isWeekly=isWeeklyMode();
  const dayMap={};
  for(const r of filtered){
    const k=isWeekly?getWeekLabel(r.dateMs):new Date(r.dateMs).toISOString().slice(0,10);
    if(!dayMap[k]) dayMap[k]=[];
    dayMap[k].push(r);
  }
  const sortedDays=Object.keys(dayMap).sort();
  let kpiHtml='';
  for(const kpi of KPI_DEFS){
    const cVal=curr[kpi.key],pVal=prev[kpi.key];
    const pct=(pVal!==null&&pVal!==undefined&&pVal!==0&&isFinite(pVal))?(cVal-pVal)/Math.abs(pVal):null;
    const isGood=pct===null?null:(kpi.goodUp?pct>=0:pct<=0);
    const badgeCls=isGood===null?C.muted:(isGood?C.green:C.red);
    const badgeTxt=pct===null?'':(pct>=0?'+':'')+(pct*100).toFixed(1)+'%';
    const sparkVals=sortedDays.map(d=>{const s=sumRows(dayMap[d]);return s[kpi.key]||0});
    const isActive=state.kwPageSelectedKpi===kpi.key;
    kpiHtml+=`<div class="kpi-card${isActive?' kpi-active':''}" data-kpi="${kpi.key}">
      <div class="kpi-label">${kpi.label}</div>
      <div class="kpi-value">${fmtKpi(kpi,cVal)}</div>
      <div class="kpi-badge" style="color:${badgeCls}">${badgeTxt}</div>
      <div class="kpi-spark">${sparklineSVG(sparkVals,badgeCls)}</div>
    </div>`;
  }

  // ── Trend section ─────────────────────────────────────────────────────────
  const kpiDef=state.kwPageSelectedKpi?KPI_DEFS.find(k=>k.key===state.kwPageSelectedKpi):null;
  const showTrend=!!(state.kwPageSelectedKpi||state.activeKeyword);
  let badgeHtml='';
  if(state.activeKeyword){
    const short=state.activeKeyword.length>32?state.activeKeyword.slice(0,31)+'…':state.activeKeyword;
    badgeHtml+=`<span class="kw-trend-pill">${esc(short)}<span class="kw-tp-x" data-clear="kw" title="Clear keyword selection">×</span></span>`;
  }
  if(kpiDef) badgeHtml+=`<span class="kw-trend-kpi-label">· ${esc(kpiDef.label)}</span>`;

  // ── Keyword table ─────────────────────────────────────────────────────────
  // Table rows: period-filtered + campaign-scoped; NOT keyword-scoped (show all kws)
  let tableRows=filterByPeriod(RAW,state.activePeriod);
  if(state.activeCampaign) tableRows=tableRows.filter(r=>r.campaign===state.activeCampaign);
  // kwScopeRows: further filtered by keyword when one is selected — used by Rows 4/5
  const kwScopeRows=state.activeKeyword?tableRows.filter(r=>r.keyword===state.activeKeyword):tableRows;
  const acctAgg=sumRows(filterByPeriod(RAW,state.activePeriod));

  // Actual date extent for chunk sizing (Option A)
  let tMinMs=Infinity,tMaxMs=-Infinity;
  for(const r of tableRows){if(r.dateMs<tMinMs)tMinMs=r.dateMs;if(r.dateMs>tMaxMs)tMaxMs=r.dateMs;}
  if(!isFinite(tMinMs)) tMinMs=tMaxMs=Date.now();

  const allKws=aggregateKeywords(tableRows).map(kw=>({
    ...kw,
    trend:classifyKwTrend(kw.rows,tMinMs,tMaxMs),
    signal:classifyKwSignal(kw,acctAgg),
    cvrChunks:buildChunks(kw.rows,tMinMs,tMaxMs).map(c=>c.agg.cvr||0),
    kwKey:`${kw.campaign}|||${kw.kw}`,
  }));

  // scopeKws: Rows 4/5 scope to selected keyword; scatter keeps full allKws for context
  const scopeKws=state.activeKeyword?allKws.filter(k=>k.kw===state.activeKeyword):allKws;

  // Sort — default: clicks descending
  const sk=kwSort.key||'clicks', sd=kwSort.key?kwSort.dir:1;
  allKws.sort((a,b)=>{
    if(sk==='kw')        return sd*a.kw.localeCompare(b.kw);
    if(sk==='matchType') return sd*a.matchType.localeCompare(b.matchType);
    if(sk==='trend')     return sd*a.trend.localeCompare(b.trend);
    if(sk==='signal')    return sd*(a.signal||'').localeCompare(b.signal||'');
    const av=a[sk]??-Infinity,bv=b[sk]??-Infinity;
    return sd*(bv-av);
  });

  // Filter counts (for chip labels)
  const counts={
    all:allKws.length,
    improving:allKws.filter(k=>k.trend==='improving').length,
    declining:allKws.filter(k=>k.trend==='declining').length,
    stable:allKws.filter(k=>k.trend==='stable'||k.trend==='recovery').length,
    scale:allKws.filter(k=>k.signal==='scale').length,
    drag:allKws.filter(k=>k.signal==='drag').length,
  };

  // Apply active filter
  const f=state.kwPageFilter;
  const visKws=f==='all'?allKws
    :f==='improving'?allKws.filter(k=>k.trend==='improving')
    :f==='declining'?allKws.filter(k=>k.trend==='declining')
    :f==='stable'?allKws.filter(k=>k.trend==='stable'||k.trend==='recovery')
    :f==='scale'?allKws.filter(k=>k.signal==='scale')
    :allKws.filter(k=>k.signal==='drag');

  const displayKws=visKws.slice(0,10);
  const moreCount=visKws.length-10;

  // Chip strip
  const chip=(filter,label,count,activeCls)=>{
    const act=f===filter;
    return `<button class="kw-chip${act?' kw-chip-active '+activeCls:''}" data-filter="${filter}">${label} (${count})</button>`;
  };
  const chipHtml=
    chip('all','All',counts.all,'kw-chip-active-all')+
    chip('improving','Improving',counts.improving,'kw-chip-active-pos')+
    chip('declining','Declining',counts.declining,'kw-chip-active-neg')+
    chip('stable','Stable',counts.stable,'kw-chip-active-neu')+
    chip('scale','Scale',counts.scale,'kw-chip-active-pos')+
    chip('drag','Draggers',counts.drag,'kw-chip-active-neg');

  // Table rows
  const MT_CLR={'Exact match':C.blue,'Phrase match':'#7F77DD','Broad match':'#888780'};
  const TREND_ICON={improving:'↑',declining:'↓',recovery:'↗',stable:'→'};
  const TREND_CLR={improving:C.green,declining:C.red,recovery:'#E07040',stable:C.muted};
  function thCls(key){return kwSort.key===key?(kwSort.dir===1?'sort-desc':'sort-asc'):'';}

  let tRows='';
  if(!displayKws.length){
    tRows=`<tr><td colspan="11" style="text-align:center;padding:24px;color:var(--muted)">No keywords match this filter</td></tr>`;
  } else {
    for(const kw of displayKws){
      const isSelected=state.kwPageSelectedKw===kw.kwKey;
      const mtColor=MT_CLR[kw.matchType]||C.muted;
      const cvrColor=acctAgg.cvr>0&&kw.cvr<acctAgg.cvr?C.red:'inherit';
      const cpaColor=acctAgg.cpa&&kw.cpa!=null
        ?(kw.cpa<acctAgg.cpa?C.green:(kw.cpa>acctAgg.cpa*1.25?C.red:'inherit')):'inherit';
      const tIcon=TREND_ICON[kw.trend]||'→', tClr=TREND_CLR[kw.trend]||C.muted;
      const spark=sparklineSVG(kw.cvrChunks,tClr,64,20);
      const sigBadge=kw.signal==='scale'
        ?`<span class="kw-sig-badge" style="background:#EAF3DE;color:#27500A">Scale</span>`
        :kw.signal==='drag'
        ?`<span class="kw-sig-badge" style="background:#FCEBEB;color:#791F1F">Dragger</span>`
        :'';
      tRows+=`<tr class="${isSelected?'row-active':''}" data-kwkey="${esc(kw.kwKey)}">
        <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(kw.kw)}</td>
        <td><span class="kw-mt-pill" style="background:${mtColor}1a;color:${mtColor}">${esc(kw.matchType||'—')}</span></td>
        <td>${fmtNum(kw.clicks,'int')}</td>
        <td>${fmtNum(kw.ctr,'pct')}</td>
        <td>${fmtNum(kw.conv,'dec')}</td>
        <td style="color:${cvrColor}">${fmtNum(kw.cvr,'pct')}</td>
        <td style="color:${cpaColor}">${fmtNum(kw.cpa,'usd')}</td>
        <td>${fmtNum(kw.cost,'usd')}</td>
        <td style="color:${tClr};white-space:nowrap">${tIcon} ${kw.trend.charAt(0).toUpperCase()+kw.trend.slice(1)}</td>
        <td>${spark}</td>
        <td>${sigBadge}</td>
      </tr>`;
    }
  }

  const footerHtml=moreCount>0
    ?`<div class="kw-more-footer">+ ${moreCount} more keyword${moreCount>1?'s':''} — sort or filter to explore the full set</div>`
    :'';

  // ── Match type breakdown (Row 4 left) ────────────────────────────────────
  const MT_ORDER4=['Exact match','Phrase match','Broad match'];
  const MT_BG4={'Exact match':'#e6f1fb','Phrase match':'#ede9fb','Broad match':'#f1efe8'};
  const MT_CLR4={'Exact match':C.blue,'Phrase match':'#7F77DD','Broad match':'#888780'};
  const mtMap4={};
  for(const kw of scopeKws){
    const mt=kw.matchType||'Other';
    if(!mtMap4[mt]) mtMap4[mt]={clicks:0,conv:0,cost:0,impr:0};
    mtMap4[mt].clicks+=kw.clicks||0;
    mtMap4[mt].conv+=kw.conv||0;
    mtMap4[mt].cost+=kw.cost||0;
    mtMap4[mt].impr+=kw.impr||0;
  }
  const tClicks4=acctAgg.clicks||1, tConv4=acctAgg.conv||1, tCost4=acctAgg.cost||1;
  for(const mt of Object.keys(mtMap4)){
    const m=mtMap4[mt];
    m.ctr=m.impr>0?m.clicks/m.impr:0;
    m.cvr=m.clicks>0?m.conv/m.clicks:0;
  }
  const activeMts=MT_ORDER4.filter(mt=>mtMap4[mt]);

  let mtRowsHtml='';
  let footerCalloutHtml='';
  for(const mt of activeMts){
    const m=mtMap4[mt], clr=MT_CLR4[mt]||C.muted, bg=MT_BG4[mt]||'#f5f5f5';
    const cp=(m.clicks/tClicks4*100), np=(m.conv/tConv4*100), sp=(m.cost/tCost4*100);
    const isSel=state.kwPageSelectedMt===mt;
    const segLbl=(pct,color)=>pct>=5
      ?`<span style="width:${pct.toFixed(1)}%;font-size:10px;color:${color};overflow:hidden;min-width:0">${pct.toFixed(0)}%</span>`
      :`<span style="width:${pct.toFixed(1)}%;min-width:0"></span>`;
    mtRowsHtml+=`<div class="mt-row${isSel?' mt-row-sel':''}" data-mt="${esc(mt)}"${isSel?` style="background:${bg}"`:''}>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
        <span style="font-size:13px;font-weight:600;color:${clr}">${isSel?'● ':''}<span class="kw-mt-pill" style="background:${clr}1a;color:${clr}">${esc(mt)}</span></span>
        <span style="font-size:11px;color:var(--muted)">CTR ${fmtNum(m.ctr,'pct')} · CVR ${fmtNum(m.cvr,'pct')}</span>
      </div>
      <div style="display:flex;gap:2px;height:9px;border-radius:4px;overflow:hidden;background:#f0f0ef">
        <div style="width:${cp.toFixed(1)}%;background:#378ADD" title="Clicks ${cp.toFixed(0)}%"></div>
        <div style="width:${np.toFixed(1)}%;background:#1D9E75" title="Conv. ${np.toFixed(0)}%"></div>
        <div style="width:${sp.toFixed(1)}%;background:#EF9F27" title="Cost ${sp.toFixed(0)}%"></div>
      </div>
      <div style="display:flex;gap:2px;margin-top:3px">
        ${segLbl(cp,'#378ADD')}${segLbl(np,'#1D9E75')}${segLbl(sp,'#EF9F27')}
      </div>
    </div>`;
    if(!footerCalloutHtml && Math.abs(sp-np)>15){
      footerCalloutHtml=`<div class="mt-callout">${esc(mt)} is absorbing ${sp.toFixed(0)}% of cost while generating only ${np.toFixed(0)}% of conversions.</div>`;
    }
  }
  if(!mtRowsHtml) mtRowsHtml=`<div style="padding:20px;color:var(--muted);text-align:center;font-size:12px">No match type data</div>`;

  // ── Scatter chart data prep (Row 4 right) ─────────────────────────────────
  const maxClicks4=allKws.reduce((m,k)=>Math.max(m,k.clicks||0),1);
  const medIdx=n=>Math.floor(n/2);
  const sortedCostArr=[...allKws].sort((a,b)=>a.cost-b.cost);
  const sortedConvArr=[...allKws].sort((a,b)=>a.conv-b.conv);
  const medCost4=sortedCostArr[medIdx(sortedCostArr.length)]?.cost??0;
  const medConv4=sortedConvArr[medIdx(sortedConvArr.length)]?.conv??0;

  // ── CPA spread (Row 5 left) ───────────────────────────────────────────────
  const avgCpa5=acctAgg.cpa||0;
  const cpaSpread={below:0,near:0,above:0,noConv:0};
  for(const kw of scopeKws){
    if(!kw.conv||kw.conv<1){cpaSpread.noConv++;continue;}
    if(!avgCpa5){cpaSpread.near++;continue;}
    const r=kw.cpa/avgCpa5;
    if(r<1) cpaSpread.below++;
    else if(r<=1.2) cpaSpread.near++;
    else cpaSpread.above++;
  }
  const totalKws5=scopeKws.length||1;
  const cpaBarRow=(label,count,color,hr)=>{
    const pct=(count/totalKws5*100).toFixed(1);
    return `<div class="kw-cpa-bar-row"${hr?' style="border-top:1px solid var(--border);margin-top:10px;padding-top:10px"':''}>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <span style="font-size:12px">${label}</span>

  const cpaSpreadHtml=
    cpaBarRow('Below avg CPA',cpaSpread.below,'#639922',false)+

    cpaBarRow('Above avg CPA',cpaSpread.above,'#E24B4A',false)+
    cpaBarRow('No conv. data',cpaSpread.noConv,'#b4b2a9',true);

  // ── Trend signal (Row 5 right) ────────────────────────────────────────────
  const trendCounts5={
    improving:scopeKws.filter(k=>k.trend==='improving').length,
    stable:scopeKws.filter(k=>k.trend==='stable'||k.trend==='recovery').length,
    declining:scopeKws.filter(k=>k.trend==='declining').length,
  };
  const tTile=(label,count,bg,color)=>
    `<div class="kw-trend-tile" style="background:${bg}">
      <div class="kw-trend-tile-val" style="color:${color}">${count}</div>
      <div class="kw-trend-tile-lbl" style="color:${color}">${label}</div>
    </div>`;
  const trendTilesHtml=
    tTile('Improving',trendCounts5.improving,'#eaf3de','#27500A')+
    tTile('Stable',trendCounts5.stable,'#f1efe8','#6b7280')+
    tTile('Declining',trendCounts5.declining,'#fcebeb','#791F1F');

  // CVR chunks: scoped to selected keyword when active (keeps same time axis)
  const acctChunks5=buildChunks(kwScopeRows.length?kwScopeRows:tableRows,tMinMs,tMaxMs);
  const cvrChartLabels=acctChunks5.map((_,i)=>`Ch ${i+1}`);
  const cvrChartData=acctChunks5.map(c=>c.agg.cvr||0);
  const recentStart5=Math.max(0,acctChunks5.length-2);

  // ── Assemble page HTML ────────────────────────────────────────────────────
  container.innerHTML=`
    <div id="kw-kpi-grid">${kpiHtml}</div>
    <div id="kw-trend-section" class="card"${showTrend?'':' style="display:none"'}>
      <div class="card-title">Trend

      </div>
      <div style="height:260px;position:relative"><canvas id="kw-trend-chart"></canvas></div>
      <div class="trend-hint" id="kw-trend-hint"${kpiDef?' style="display:none"':''}>Click a KPI card to overlay it on the chart</div>
    </div>
    <div class="card" style="padding:0;overflow:hidden" id="kw-table-card">
      <div class="kw-chip-strip">${chipHtml}</div>
      <div style="overflow-x:auto">
        <table class="data-table">

            <th class="${thCls('signal')}" data-sort="signal">Signal</th>
          </tr></thead>

        </table>
      </div>
      ${footerHtml}
    </div>
    <div class="kw-row4">
      <div class="card" id="kw-mt-card">
        <div class="card-title">Match type breakdown
          <span style="font-size:11px;font-weight:400;color:var(--muted);text-transform:none;letter-spacing:0">Clicks · Conv. · Cost share</span>
        </div>
        ${mtRowsHtml}
        ${footerCalloutHtml}
        <div style="display:flex;gap:16px;padding:10px 14px 2px;font-size:11px;color:var(--muted)">
          <span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#378ADD;margin-right:3px;vertical-align:middle"></span>Clicks</span>
          <span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#1D9E75;margin-right:3px;vertical-align:middle"></span>Conv.</span>
          <span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#EF9F27;margin-right:3px;vertical-align:middle"></span>Cost</span>
        </div>
      </div>
      <div class="card" id="kw-scatter-card">
        <div class="card-title">Cost vs. Conversions</div>
        <div style="height:240px;position:relative"><canvas id="kw-scatter-chart"></canvas></div>
        <div class="kw-scatter-legend">
          <span><span class="kw-scatter-legend-dot" style="background:#eaf3de;border-color:#639922"></span>Below avg CPA</span>
          <span><span class="kw-scatter-legend-dot" style="background:#faeeda;border-color:#EF9F27"></span>Near avg CPA</span>
          <span><span class="kw-scatter-legend-dot" style="background:#fcebeb;border-color:#e24b4a"></span>Above avg CPA</span>
          <span><span class="kw-scatter-legend-dot" style="background:#f1efe8;border-color:#888780"></span>No conv.</span>
          <span style="margin-left:4px">Dot size = click volume</span>

    </div>
    <div class="card" id="kw-ngram-card">

        <div style="display:flex;align-items:center;gap:8px;font-weight:400;text-transform:none;letter-spacing:0">

          <div style="display:flex;gap:4px">
            <button class="ng-btn ng-active" data-n="1">1</button>
            <button class="ng-btn" data-n="2">2</button>
            <button class="ng-btn" data-n="3">3</button>
          </div>
        </div>
      </div>
      <div style="overflow-x:auto">
        <table class="data-table" id="ngram-table">
          <thead><tr>
            <th data-ngsort="gram">N-gram<span id="ngs-gram"></span></th>
            <th data-ngsort="kwCount" style="text-align:center">KWs<span id="ngs-kwCount"></span></th>
            <th data-ngsort="impr" style="text-align:right">Impr.<span id="ngs-impr"></span></th>
            <th data-ngsort="clicks" style="text-align:right">Clicks<span id="ngs-clicks"> ↓</span></th>
            <th data-ngsort="ctr" style="text-align:right">CTR<span id="ngs-ctr"></span></th>
            <th data-ngsort="conv" style="text-align:right">Conv.<span id="ngs-conv"></span></th>
            <th data-ngsort="cvr" style="text-align:right">CVR<span id="ngs-cvr"></span></th>
            <th data-ngsort="cost" style="text-align:right">Cost<span id="ngs-cost"></span></th>
            <th data-ngsort="cpc" style="text-align:right">CPC<span id="ngs-cpc"></span></th>
            <th data-ngsort="cpa" style="text-align:right">CPA<span id="ngs-cpa"></span></th>
          </tr></thead>
          <tbody id="ngram-tbody"></tbody>
        </table>
      </div>
      <div id="ngram-showmore" style="display:none;padding:10px 16px;font-size:12px;color:var(--blue);cursor:pointer;text-align:center;border-top:1px solid var(--border)"></div>
    </div>
    <div class="kw-row5">
      <div class="card" id="kw-cpa-spread-card">
        <div class="card-title">CPA spread</div>
        ${cpaSpreadHtml}
      </div>
      <div class="card" id="kw-trend-signal-card">
        <div class="card-title">Trend signal</div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px">${trendTilesHtml}</div>
        <div style="height:140px;position:relative"><canvas id="kw-cvr-chart"></canvas></div>
        <div style="font-size:10px;color:var(--muted);margin-top:8px;line-height:1.5">Period split into equal chunks. Dashed line marks the recent window (last 2 chunks). Keywords trending above the long-term slope are flagged as Improving; those below as Declining.</div>

    <div id="kw-eff-section">
      <div class="card">
        <div class="card-title">Keyword efficiency scatter
          <span style="font-size:11px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted)">CTR vs CVR — bubble size = <span id="kw-eff-bubble-label">cost</span></span>
