// ─── Curve shape classifier (lag extension spec §1) ──────────────────────────
function classifyCurveShape(lagResults, bonferroni_peak_survives, totalWeeks) {
  const eligibleLags = lagResults.filter(l => l.lag_days > 0);
  if (eligibleLags.length === 0) {
    return {shape:'FLAT_OR_NOISY',confidence:'none',extension_eligible:false,
            extension_reason:null,suppression_flag:'INSUFFICIENT_SIGNAL'};
  }

  const rValues   = eligibleLags.map(l => l.raw_score);
  const peakEntry = eligibleLags.reduce((best,l) => l.raw_score > best.raw_score ? l : best, eligibleLags[0]);
  const peakR     = peakEntry.raw_score;

  const _sR   = [...rValues].sort((a,b) => a-b);
  const _mid  = Math.floor(_sR.length / 2);
  const medianR = _sR.length % 2 === 0 ? (_sR[_mid-1]+_sR[_mid])/2 : _sR[_mid];
  const _mean   = rValues.reduce((s,v) => s+v, 0) / rValues.length;
  const stdDevR = Math.sqrt(rValues.reduce((s,v) => s+(v-_mean)**2, 0) / rValues.length);

  const boundaryLag = Math.max(...eligibleLags.map(l => l.lag_days));
  const midpointLag = Math.floor(boundaryLag / 2);
  const midpointR   = (lagResults.find(l => l.lag_days === midpointLag) ?? {raw_score:0}).raw_score;

  const earlyLags = eligibleLags.filter(l => l.lag_days <= 4);
  const midLags   = eligibleLags.filter(l => l.lag_days >= 5 && l.lag_days <= boundaryLag - 3);

  if (peakR < 0.15 || stdDevR < 0.10) {
    return {shape:'FLAT_OR_NOISY',confidence:'none',extension_eligible:false,
            extension_reason:null,suppression_flag:'INSUFFICIENT_SIGNAL'};
  }

  // Bonferroni survival check for an arbitrary lag entry (used by BIMODAL)
  const _survivesBonf = (lagEntry) => {
    const m = lagResults.filter(c => c.lag_days >= 1 && (totalWeeks - c.lag_days) >= 8).length;
    if (m === 0) return false;
    const nk = totalWeeks - lagEntry.lag_days;
    const df = nk - 2; if (df < 1) return false;
    const t = Math.abs(lagEntry.raw_score) >= 1 ? Infinity
      : lagEntry.raw_score * Math.sqrt(df) / Math.sqrt(1 - lagEntry.raw_score ** 2);
    return Math.min(1, tDistPValue(t, df) * m) <= 0.05;
  };

  const lagsBeforePeak = eligibleLags.filter(l => l.lag_days < peakEntry.lag_days);
  const lagsAfterPeak  = eligibleLags.filter(l => l.lag_days > peakEntry.lag_days);
  const final3Lags     = eligibleLags.filter(l => l.lag_days >= boundaryLag - 2);

  // ── Shape 1: PEAK_AND_DECAY ──────────────────────────────────────────────────
  const s1r1 = peakEntry.lag_days !== eligibleLags[0].lag_days;
  const s1r2 = peakEntry.lag_days !== boundaryLag;
  const s1r3 = lagsBeforePeak.filter(l => l.raw_score < peakR).length >= 2;
  const s1r4 = lagsAfterPeak.filter(l => l.raw_score < peakR).length >= 2;
  const s1r5 = peakR - medianR >= 0.15;
  const s1r6 = !final3Lags.some(l => l.raw_score >= peakR - 0.20);
  if (s1r1 && s1r2 && s1r3 && s1r4 && s1r5) {
    if (s1r6) {
      return {shape:'PEAK_AND_DECAY',
              confidence: peakR >= 0.5 ? 'high' : peakR >= 0.35 ? 'medium' : 'low',
              extension_eligible:false, extension_reason:null, suppression_flag:null};
    }
    // Rule 6 fails → BIMODAL branch; only re-check condition 3
    const secEntry = final3Lags.reduce((best,l) => l.raw_score > best.raw_score ? l : best, final3Lags[0]);
    if (totalWeeks - secEntry.lag_days >= 8) {
      const extElig = secEntry.raw_score > peakR && _survivesBonf(secEntry);
      return {shape:'BIMODAL',
              confidence: peakR >= 0.5 ? 'medium' : 'low',
              extension_eligible: extElig,
              extension_reason: extElig ? 'Secondary peak outscores primary — testing whether longer window reveals true peak' : null,
              suppression_flag: extElig ? null : 'SECONDARY_RISE_DETECTED'};
    }
    // Condition 3 fails — fall through
  }

  // ── Shape 2: MONOTONIC_DECAY ─────────────────────────────────────────────────
  if (peakEntry.lag_days <= 2 &&
      lagsAfterPeak.length > 0 &&
      lagsAfterPeak.filter(l => l.raw_score < peakR).length / lagsAfterPeak.length >= 0.7 &&
      midpointR < peakR * 0.5) {
    return {shape:'MONOTONIC_DECAY',confidence:'low',extension_eligible:false,
            extension_reason:null,suppression_flag:'AUTOCORRELATION_DOMINANCE'};
  }

  // ── Shapes 3 & 4 share three common rules ───────────────────────────────────
  const riseBase = peakEntry.lag_days >= boundaryLag - 1 &&
    eligibleLags.filter(l => l.raw_score <= peakR).length / eligibleLags.length >= 0.7 &&
    midpointR < peakR * 0.80;

  // ── Shape 3: MONOTONIC_RISE_VALIDATED ────────────────────────────────────────
  if (riseBase && bonferroni_peak_survives === true &&
      rValues.filter(r => r < 0).length / rValues.length < 0.3) {
    return {shape:'MONOTONIC_RISE_VALIDATED',confidence:'medium',extension_eligible:true,
            extension_reason:'Curve rising toward boundary with statistical validation — true peak may be beyond current window',
            suppression_flag:null};
  }

  // ── Shape 4: MONOTONIC_RISE_UNVALIDATED ──────────────────────────────────────
  if (riseBase && bonferroni_peak_survives === false) {
    return {shape:'MONOTONIC_RISE_UNVALIDATED',confidence:'low',extension_eligible:false,
            extension_reason:null,suppression_flag:'TREND_CONTAMINATION'};
  }

  // ── Shape 5: LATE_SPIKE ───────────────────────────────────────────────────────
  const earlyMid    = [...earlyLags, ...midLags];
  const earlyMidLow = earlyMid.filter(l => l.raw_score < 0.15).length;
  const _emS        = earlyMid.map(l => l.raw_score).sort((a,b) => a-b);
  const _emMid      = Math.floor(_emS.length / 2);
  const earlyMidMed = _emS.length === 0 ? 0
    : _emS.length % 2 === 0 ? (_emS[_emMid-1]+_emS[_emMid])/2 : _emS[_emMid];
  const _l3fb       = lagResults.find(l => l.lag_days === boundaryLag - 3);
  if (peakEntry.lag_days >= boundaryLag - 2 &&
      earlyMidLow >= 4 &&
      earlyMid.length > 0 && peakR - earlyMidMed >= 0.30 &&
      peakR >= (_l3fb ? _l3fb.raw_score : 0) + 0.25) {
    const extElig = bonferroni_peak_survives === true;
    return {shape:'LATE_SPIKE',confidence:'low',
            extension_eligible: extElig,
            extension_reason: extElig ? 'Late spike at boundary validated by Bonferroni — may indicate delayed consideration effect' : null,
            suppression_flag: extElig ? null : 'LATE_SPIKE_UNVALIDATED'};
  }

  // ── Shape 6: BIMODAL (standalone) ────────────────────────────────────────────
  if (midLags.length > 0) {
    const midPeak  = midLags.reduce((best,l) => l.raw_score > best.raw_score ? l : best, midLags[0]);
    const mpR      = midPeak.raw_score;
    const mpBefore = eligibleLags.filter(l => l.lag_days < midPeak.lag_days);
    const mpAfter  = eligibleLags.filter(l => l.lag_days > midPeak.lag_days);
    const midPeakRules1to5 =
      midPeak.lag_days !== eligibleLags[0].lag_days &&
      midPeak.lag_days !== boundaryLag &&
      mpBefore.filter(l => l.raw_score < mpR).length >= 2 &&
      mpAfter.filter(l => l.raw_score < mpR).length >= 2 &&
      mpR - medianR >= 0.15;
    if (midPeakRules1to5) {
      const secCand = final3Lags.find(l => l.raw_score >= mpR - 0.20);
      if (secCand) {
        const bestSec = final3Lags.reduce((best,l) => l.raw_score > best.raw_score ? l : best, final3Lags[0]);
        if (totalWeeks - bestSec.lag_days >= 8) {
          const extElig = bestSec.raw_score > mpR && _survivesBonf(bestSec);
          return {shape:'BIMODAL',
                  confidence: mpR >= 0.5 ? 'medium' : 'low',
                  extension_eligible: extElig,
                  extension_reason: extElig ? 'Secondary peak outscores primary — testing whether longer window reveals true peak' : null,
                  suppression_flag: extElig ? null : 'SECONDARY_RISE_DETECTED'};
        }
      }
    }
  }

  // ── Shape 7: FLAT_OR_NOISY (catch-all) ───────────────────────────────────────
  return {shape:'FLAT_OR_NOISY',confidence:'none',extension_eligible:false,
          extension_reason:null,suppression_flag:'INSUFFICIENT_SIGNAL'};
}

// ─── Layer 2 fallback signal scorer (lag extension spec §3.2) ─────────────────
function computeFallbackScore(lagResults, bonferroniResult) {
  const eligibleLags = lagResults.filter(l => l.lag_days > 0);
  if (eligibleLags.length === 0)
    return {peakClarityScore:0, stabilityScore:0, bonferroniScore:0, fallbackScore:0, fallback_tier:'none'};

  const rValues   = eligibleLags.map(l => l.raw_score);
  const peakEntry = eligibleLags.reduce((best,l) => l.raw_score > best.raw_score ? l : best, eligibleLags[0]);
  const peakR     = peakEntry.raw_score;

  const _sR   = [...rValues].sort((a,b) => a-b);
  const _mid  = Math.floor(_sR.length / 2);
  const medianR = _sR.length % 2 === 0 ? (_sR[_mid-1]+_sR[_mid])/2 : _sR[_mid];
  const _mean   = rValues.reduce((s,v) => s+v, 0) / rValues.length;
  const stdDevR = Math.sqrt(rValues.reduce((s,v) => s+(v-_mean)**2, 0) / rValues.length);

  // Score 1: peak clarity — how far peak stands above median relative to spread
  let peakClarityScore = stdDevR === 0 ? 0 : (peakR - medianR) / stdDevR / 3;
  peakClarityScore = Math.max(0, Math.min(1, peakClarityScore));

  // Score 2: peak stability — are neighbouring lags also elevated?
  const surroundingLags = eligibleLags.filter(l =>
    Math.abs(l.lag_days - peakEntry.lag_days) <= 2 && l.lag_days !== peakEntry.lag_days
  );
  let stabilityScore;
  if (peakR === 0) {
    stabilityScore = 0;
  } else if (surroundingLags.length < 2) {
    stabilityScore = 0.5;  // neutral — too few neighbours to assess
  } else {
    const surroundMean = surroundingLags.reduce((s,l) => s+l.raw_score, 0) / surroundingLags.length;
    stabilityScore = Math.max(0, Math.min(1, surroundMean / peakR));
  }

  // Score 3: Bonferroni gate
  const bonferroniScore = bonferroniResult.bonferroni_peak_survives ? 1 : 0;

  const fallbackScore = +(peakClarityScore * 0.4 + stabilityScore * 0.4 + bonferroniScore * 0.2).toFixed(6);
  const fallback_tier = fallbackScore >= 0.6 ? 'directional'
    : fallbackScore >= 0.3 ? 'weak'
    : 'none';

  return {peakClarityScore, stabilityScore, bonferroniScore, fallbackScore, fallback_tier};
}

// context = { usableWeeks, period, sourceMetric, targetMetric }
function buildShapeLog(shapeResult, fallbackResult, lagResults, bonferroniResult, context = {}) {
  if (shapeResult.shape !== 'FLAT_OR_NOISY') {
    return {
      triggered: false,
      r_values: null, peak_lag: null, peak_r: null,
      bonferroni_survived: null, total_weeks: null, period: null,
      source_metric: null, target_metric: null,
      fallback_score: null, fallback_tier: null, shape_tests_failed: null,
    };
  }

  const eligibleLags = lagResults.filter(l => l.lag_days > 0);
  const peakEntry = eligibleLags.length > 0
    ? eligibleLags.reduce((best, l) => l.raw_score > best.raw_score ? l : best, eligibleLags[0])
    : null;

  return {
    triggered: true,
    r_values:          eligibleLags.map(l => l.raw_score),
    peak_lag:          peakEntry ? peakEntry.lag_days  : null,
    peak_r:            peakEntry ? peakEntry.raw_score : null,
    bonferroni_survived: bonferroniResult.bonferroni_peak_survives,
    total_weeks:       context.usableWeeks  ?? null,
    period:            context.period       ?? null,
    source_metric:     context.sourceMetric ?? null,
    target_metric:     context.targetMetric ?? null,
    fallback_score:    fallbackResult.fallbackScore,
    fallback_tier:     fallbackResult.fallback_tier,
    shape_tests_failed: ['PEAK_AND_DECAY','MONOTONIC_DECAY','MONOTONIC_RISE_VALIDATED',
                         'MONOTONIC_RISE_UNVALIDATED','LATE_SPIKE','BIMODAL'],
  };
}

// ─── Two-layer analysis orchestrator (lag extension spec §3.3) ────────────────
function runTwoLayerAnalysis(lagResults, bonferroniResult, usableWeeks) {
  const shapeResult    = classifyCurveShape(lagResults, bonferroniResult.bonferroni_peak_survives, usableWeeks);
  const fallbackResult = computeFallbackScore(lagResults, bonferroniResult);

  const _down = c => c==='high'?'medium': c==='medium'?'directional': c==='directional'?'low':c;

  let primaryResult;
  if (shapeResult.shape !== 'FLAT_OR_NOISY') {
    primaryResult = { ...shapeResult, layer_discrepancy_noted: false };
    if (fallbackResult.fallback_tier === 'none' && shapeResult.confidence !== 'low') {
      primaryResult.confidence            = _down(primaryResult.confidence);
      primaryResult.layer_discrepancy_noted = true;
    }
  } else {
    const conf = fallbackResult.fallback_tier === 'weak' ? 'low' : fallbackResult.fallback_tier;
    primaryResult = {
      shape: 'FLAT_OR_NOISY', confidence: conf,
      extension_eligible: false, driven_by_fallback: true,
      layer_discrepancy_noted: false,
    };
  }

  return {
    ...primaryResult,
    fallback_score:         fallbackResult.fallbackScore,
    fallback_tier:          fallbackResult.fallback_tier,
    unrecognised_shape_log: buildShapeLog(shapeResult, fallbackResult, lagResults, bonferroniResult),
  };
}

// ─── Adaptive lag window extension (lag extension spec §2.4) ─────────────────
function attemptLagExtension(sourceSeries, targetSeries, currentMaxLag, usableWeeks, shapeResult) {
  if (!shapeResult.extension_eligible)
    return {extended: false, reason: 'Shape not eligible for extension'};

  const maxAllowed = Math.min(42, Math.floor(usableWeeks * 0.33));

  if (currentMaxLag >= maxAllowed)
    return {extended: false, reason: 'Already at maximum allowed lag for this data volume'};

  let nextMaxLag = currentMaxLag + 7;
  let bestResult = null;

  while (nextMaxLag <= maxAllowed) {
    const newCorrResults = crossCorrelation(sourceSeries, targetSeries, nextMaxLag);
    const newBonferroni  = computeBonferroni(newCorrResults, usableWeeks);
    const newLagResults  = newCorrResults.map(c => ({lag_days: c.lag, raw_score: c.r}));
    const newShape       = classifyCurveShape(newLagResults, newBonferroni.bonferroni_peak_survives, usableWeeks);

    const eligible = newLagResults.filter(l => l.lag_days > 0);
    const newPeakEntry = eligible.length > 0
      ? eligible.reduce((best, l) => l.raw_score > best.raw_score ? l : best, eligible[0])
      : null;
    const newPeakLag     = newPeakEntry ? newPeakEntry.lag_days : nextMaxLag;
    const peakAtBoundary = newPeakLag >= nextMaxLag - 1;

    if (!peakAtBoundary && newBonferroni.bonferroni_peak_survives) {
      bestResult = {
        extended: true,
        final_max_lag: nextMaxLag,
        lag_results: newLagResults,
        bonferroni: newBonferroni,
        shape: newShape,
        extension_steps_taken: (nextMaxLag - currentMaxLag) / 7,
        note: 'Peak found within extended window at Day ' + newPeakLag,
      };
      break;
    }

    if (peakAtBoundary && nextMaxLag >= maxAllowed) {
      bestResult = {
        extended: true,
        final_max_lag: nextMaxLag,
        lag_results: newLagResults,
        bonferroni: newBonferroni,
        shape: newShape,
        extension_steps_taken: (nextMaxLag - currentMaxLag) / 7,
        note: 'Peak still at boundary after maximum extension — true peak may be beyond tested range',
      };
      break;
    }

    nextMaxLag += 7;
  }

  return bestResult ?? {extended: false, reason: 'Extension did not improve result'};
}

function computeLagDistribution(weeks, srcKey, tgtKey){
  const srcSeries=weeks.map(w=>LAG_SOURCE_METRICS[srcKey].fn(w)??0);
  const tgtSeries=weeks.map(w=>LAG_TARGET_METRICS[tgtKey].fn(w)??0);
  const n=weeks.length;
  let effectiveMaxLag=Math.min(14, Math.max(0, n-3));
  let corrResults=crossCorrelation(srcSeries, tgtSeries, 14);
  let bonferroni=computeBonferroni(corrResults, n);

  // Variance check (relative to mean to handle scale differences)
  const srcMean=srcSeries.reduce((s,v)=>s+v,0)/n;
  const tgtMean=tgtSeries.reduce((s,v)=>s+v,0)/n;
  const srcVar=srcSeries.reduce((s,v)=>s+(v-srcMean)**2,0)/n;
  const tgtVar=tgtSeries.reduce((s,v)=>s+(v-tgtMean)**2,0)/n;
  const srcLowVar=srcVar<1e-8*(Math.abs(srcMean)+1);
  const tgtLowVar=tgtVar<1e-8*(Math.abs(tgtMean)+1);

  const tgtFmt=LAG_TARGET_METRICS[tgtKey]?.fmt??(v=>v.toFixed(2));

  const _buildLagScores=(cr,maxLag)=>{
    const er=cr.filter(c=>c.lag>0&&c.lag<=maxLag&&c.r>0).reduce((s,c)=>s+c.r,0);
    let cw=0;
    return cr.map(c=>{
      const isRef=c.lag===0, unrel=c.lag>maxLag;
      const cs=(!isRef&&!unrel&&c.r>0)?c.r:0;
      const w=er>0?cs/er:0; cw+=w;
      return {lag_days:c.lag, raw_score:c.r, cleaned_score:cs, weight:w,
              cumulative_weight:Math.min(1,cw),
              note:isRef?'reference_only':unrel?'unreliable':null,
              insight:isRef?null:computeLagInsight(srcSeries,tgtSeries,c.lag,tgtFmt)};
    });
  };
  let lagScores=_buildLagScores(corrResults, effectiveMaxLag);

  // Two-layer analysis (lag extension spec §3.3)
  let twoLayer=runTwoLayerAnalysis(lagScores, bonferroni, n);

  // Adaptive lag extension (lag extension spec §2.4)
  const extFields={lag_extension_attempted:false, lag_extension_applied:false,
                   lag_extension_final_max:null, lag_extension_steps_taken:null, lag_extension_note:null};
  if(twoLayer.extension_eligible){
    extFields.lag_extension_attempted=true;
    const extResult=attemptLagExtension(srcSeries, tgtSeries, effectiveMaxLag, n, twoLayer);
    if(extResult.extended){
      effectiveMaxLag=extResult.final_max_lag;
      bonferroni=extResult.bonferroni;
      corrResults=crossCorrelation(srcSeries, tgtSeries, effectiveMaxLag);
      lagScores=_buildLagScores(corrResults, effectiveMaxLag);
      twoLayer=runTwoLayerAnalysis(extResult.lag_results, bonferroni, n);
      extFields.lag_extension_applied=true;
      extFields.lag_extension_final_max=extResult.final_max_lag;
      extFields.lag_extension_steps_taken=extResult.extension_steps_taken;
      extFields.lag_extension_note=extResult.note;
    }
  }

  // Peak: best r among reliable lags (lag > 0 only)
  const reliableLags=lagScores.filter(d=>d.lag_days>0&&d.lag_days<=effectiveMaxLag);
  const peakEntry=reliableLags.length>0
    ?reliableLags.reduce((best,d)=>d.raw_score>best.raw_score?d:best, reliableLags[0])
    :null;
  const peakLag=peakEntry?peakEntry.lag_days:1;
  const peakR=peakEntry?peakEntry.raw_score:0;

  // Median / p80 from cumulative weight
  let medianLag=null, p80Lag=null;
  for(const d of lagScores){
    if(d.lag_days===0||d.weight===0) continue;
    if(medianLag===null&&d.cumulative_weight>=0.5) medianLag=d.lag_days;
    if(p80Lag===null&&d.cumulative_weight>=0.8) p80Lag=d.lag_days;
  }

  const allNegative=reliableLags.length>0&&reliableLags.every(d=>d.raw_score<=0);

  // Warnings
  const warnings=[];
  if(n<6) warnings.push('LOW_DATA');
  if(!allNegative&&reliableLags.length>0){
    const relCorr=reliableLags.map(d=>({lag:d.lag_days,r:d.raw_score}));
    if(assessSharpness(relCorr)==='Flat') warnings.push('FLAT_DISTRIBUTION');
  }
  if(allNegative) warnings.push('ALL_NEGATIVE');
  if(peakEntry&&peakLag===effectiveMaxLag&&effectiveMaxLag<14) warnings.push('PEAK_AT_BOUNDARY');
  if(srcLowVar) warnings.push('LOW_VARIANCE_SOURCE');
  if(tgtLowVar) warnings.push('LOW_VARIANCE_TARGET');
  // §8 new warning flags
  if(!bonferroni.bonferroni_peak_survives) warnings.push('BONFERRONI_FAILED');
  const n_peak = n - peakLag;
  if(n_peak < 12) warnings.push('LOW_PAIR_COUNT');
  // Shape-based warning flags (lag extension spec §1.5)
  if(twoLayer.suppression_flag && twoLayer.suppression_flag !== 'INSUFFICIENT_SIGNAL')
    warnings.push(twoLayer.suppression_flag);
  if(twoLayer.driven_by_fallback) warnings.push('SHAPE_UNRECOGNISED');

  // §5.1 r-based confidence tier
  let confidence;
  if(n<4||allNegative) confidence='none';
  else if(n<6||peakR<0.2) confidence='low';
  else if(n<10||peakR<0.35) confidence='medium';
  else confidence='high';

  // Merge with two-layer confidence — take the more conservative of the two
  const _tierRank={none:0,low:1,directional:2,medium:3,high:4};
  if((_tierRank[twoLayer.confidence]??3) < (_tierRank[confidence]??3)) confidence=twoLayer.confidence;

  // §5–6 Pair count downgrade (independent of Bonferroni; kept as soft warning step)
  const _downOne = t => t==='high'?'medium': t==='medium'?'directional': t==='directional'?'low':t;

  let pair_count_downgraded = false;
  if(n_peak < 12 && confidence !== 'none'){
    confidence = _downOne(confidence);
    pair_count_downgraded = true;
  }

  // Override floors — applied last, after all layer logic (lag extension spec §3.5)
  // Floor 1: thin data — fewer than 8 aligned pairs → cap at 'low'
  if(n_peak < 8 && confidence !== 'none') confidence = 'low';
  // Floor 2: Bonferroni failure — replaces old one-tier downgrade; hard cap at 'low'
  if(!bonferroni.bonferroni_peak_survives && confidence !== 'low' && confidence !== 'none') confidence = 'low';
  // Floor 3: suppression must always be explained
  const suppression_message = confidence === 'none'
    ? (allNegative
        ? 'No positive lag relationship detected between these metrics for the selected period.'
        : 'Insufficient data to calculate a reliable lag relationship for this metric pairing.')
    : null;

  return {
    source_metric:srcKey, target_metric:tgtKey,
    data_window_start:weeks[0]?.weekStart??'', data_window_end:weeks[weeks.length-1]?.weekStart??'',
    excluded_recent_days:0, usable_days:n*7, effective_max_lag:effectiveMaxLag,
    peak_lag:peakLag, peak_r:peakR, median_lag:medianLag, p80_lag:p80Lag,
    confidence, warnings, lag_scores:lagScores,
    suppression_message, pair_count_downgraded, n_peak,
    curve_shape:twoLayer.shape, curve_shape_confidence:twoLayer.confidence,
    curve_shape_extension_eligible:twoLayer.extension_eligible,
    curve_shape_suppression_flag:twoLayer.suppression_flag??null,
    ...extFields,
    fallback_score:twoLayer.fallback_score, fallback_tier:twoLayer.fallback_tier,
    layer_discrepancy_noted:twoLayer.layer_discrepancy_noted,
    unrecognised_shape_log:twoLayer.unrecognised_shape_log,
    ...bonferroni
  };
}

function renderLagDistributionCard(lagData){
  const el=document.getElementById('bnb-lag-dist');
  const srcLabel=LAG_SOURCE_METRICS[lagData?.source_metric]?.label??'';
  const tgtLabel=LAG_TARGET_METRICS[lagData?.target_metric]?.label??'';

  // Metric selector
  const srcPills=Object.entries(LAG_SOURCE_METRICS).map(([k,v])=>
    `<button class="lag-pill lag-dist-src${bnbLagSrc===k?' active':''}" data-src="${k}">${v.label}</button>`
  ).join('');
  const tgtPills=Object.entries(LAG_TARGET_METRICS).map(([k,v])=>
    `<button class="lag-pill lag-dist-tgt${bnbLagTgt===k?' active':''}" data-tgt="${k}">${v.label}</button>`
  ).join('');
  const selectorHtml=`<div class="ld-selector-row">
    <div class="ld-selector-group">${srcPills}</div>
    <span class="ld-arrow">&#8594;</span>
    <div class="ld-selector-group">${tgtPills}</div>
  </div>`;

  // No-data state
  const noRender=!lagData||!lagData.lag_scores||lagData.lag_scores.length===0
    ||lagData.confidence==='none'||lagData.warnings.includes('ALL_NEGATIVE');
  if(noRender){
    const msg=lagData?.warnings.includes('ALL_NEGATIVE')
      ?`No positive lag relationship detected between ${srcLabel} and ${tgtLabel} for the selected period. Try a different metric pairing or a longer date range.`
      :'No lag relationship could be calculated for this metric pairing.';
    el.innerHTML=`<div class="card">
      <div class="card-title">Lag correlation distribution</div>
      <div class="card-sub">Pearson r between source metric (offset by k days) and target metric.</div>
      ${selectorHtml}
      <div class="aw-warn"><span class="aw-warn-icon">&#9888;</span>${msg}</div>
    </div>`;
    el.querySelectorAll('.lag-dist-src').forEach(b=>b.addEventListener('click',()=>{bnbLagSrc=b.dataset.src;renderBnb();}));
    el.querySelectorAll('.lag-dist-tgt').forEach(b=>b.addEventListener('click',()=>{bnbLagTgt=b.dataset.tgt;renderBnb();}));
    return;
  }

  // Warning banners (not ALL_NEGATIVE — that triggers no-render)
  const W={
    LOW_DATA:'This distribution is based on fewer than 6 complete weeks of data. Results may shift significantly as more data becomes available.',
    FLAT_DISTRIBUTION:'No single lag dominates this distribution. This may indicate a diffuse consideration journey, a weak relationship between these metrics, or insufficient data to detect a clear signal.',
    PEAK_AT_BOUNDARY:`The strongest lag falls at the edge of the tested range (Day ${lagData.effective_max_lag}). Consider extending the max lag to see if the relationship continues.`,
    LOW_VARIANCE_SOURCE:`${srcLabel} metric has very low variance in this period. Correlation results may be unstable.`,
    LOW_VARIANCE_TARGET:`${tgtLabel} metric has very low variance in this period. Correlation results may be unstable.`,
    BONFERRONI_FAILED:'The identified peak lag does not pass statistical validation after correcting for multiple comparisons. Confidence has been downgraded. Interpret with caution or extend the date range.',
    LOW_PAIR_COUNT:'The peak lag is supported by fewer than 12 aligned week pairs. Results are directional. A longer date range will improve reliability.',
    AUTOCORRELATION_DOMINANCE:'The correlation peaks at Day 1–2 and decays rapidly. This pattern suggests the source series\' own day-to-day persistence may be inflating early lag scores rather than a true consideration lag. Results are directional only.',
    TREND_CONTAMINATION:'The correlation rises consistently toward the boundary but does not pass statistical validation. This may indicate both series are trending together over this period rather than a true lag relationship. Consider using the 90D period instead.',
    LATE_SPIKE_UNVALIDATED:'A late spike is present near the boundary but does not pass statistical validation. This may be a noise artefact at thin data. Extend the date range to test whether the pattern holds.',
    SECONDARY_RISE_DETECTED:'A secondary rise near the boundary suggests a possible second consideration window. Primary peak is reported. A longer date range may reveal whether a true secondary pattern exists.',
    SHAPE_UNRECOGNISED:'The correlation curve does not match a known pattern. A directional result is shown using the best available signal. Extend the date range or try a different metric pairing for a more reliable estimate.',
  };
  const warnHtml=lagData.warnings.filter(w=>w!=='ALL_NEGATIVE')
    .map(w=>W[w]?`<div class="aw-warn" style="margin-bottom:10px"><span class="aw-warn-icon">&#9888;</span>${W[w]}</div>`:'')
    .join('');

  // Stats
  const {peak_lag:peakLag,peak_r:peakR,median_lag:medianLag,p80_lag:p80Lag,confidence,warnings}=lagData;
  const nWeeks=Math.round((lagData.usable_days||0)/7);
  const confColor=confidence==='high'?'#1D9E75':confidence==='medium'?'#EF9F27':'#E24B4A';
  const confLabel=confidence.charAt(0).toUpperCase()+confidence.slice(1);
  const flagNote=warnings.length?` \u00b7 ${warnings.length} flag${warnings.length>1?'s':''}` :'';

  el.innerHTML=`<div class="card">
    <div class="card-title">Lag correlation distribution${srcLabel&&tgtLabel?' \u2014 '+srcLabel+' \u2192 '+tgtLabel:''}</div>
    <div class="card-sub">Pearson r between source metric (offset by k days) and target metric. Each point shows the strength of the timing relationship at that lag. Lag 0 shown for reference only \u2014 excluded from distribution weights.</div>
    ${selectorHtml}
    ${warnHtml}
    <div style="position:relative;height:260px"><canvas id="lag-dist-canvas"></canvas><div id="lag-dist-popup" class="ld-popup" style="display:none"></div></div>
    <div class="ld-stats-row">
      <div class="ld-stat">
        <div class="ld-stat-label">Peak lag</div>
        <div class="ld-stat-val" style="color:#7F77DD">Day ${peakLag}</div>
        <div class="ld-stat-sub">r\u2009=\u2009${(peakR*100).toFixed(1)}% \u2014 strongest signal</div>
      </div>
      <div class="ld-stat">
        <div class="ld-stat-label">Median lag</div>
        <div class="ld-stat-val">${medianLag!==null?'Day '+medianLag:'\u2014'}</div>
        <div class="ld-stat-sub">50% of relationship by this day</div>
      </div>
      <div class="ld-stat">
        <div class="ld-stat-label">80% influence window</div>
        <div class="ld-stat-val">${p80Lag!==null?'Day '+p80Lag:'\u2014'}</div>
        <div class="ld-stat-sub">80% of relationship materialised</div>
      </div>
      <div class="ld-stat">
        <div class="ld-stat-label">Confidence</div>
        <div class="ld-stat-val" style="color:${confColor}">${confLabel}</div>
        <div class="ld-stat-sub">${nWeeks} complete weeks${flagNote}</div>
        <!-- TBD PLACEMENT: validation indicator — move here when final location confirmed -->
        ${(()=>{const sv=lagData.bonferroni_peak_survives;const vc=sv?'#1D9E75':'#E24B4A';const vt=sv?'Statistically validated':'Not statistically validated';return`<div style="margin-top:4px;font-size:11px;font-weight:600;color:${vc}">${vt}</div>`;})()}
      </div>
    </div>
    <div class="ld-footer-note">Correlation measures timing association, not causal contribution. This is not conversion attribution. Results reflect population-level behaviour across the selected period.</div>
  </div>`;

  el.querySelectorAll('.lag-dist-src').forEach(b=>b.addEventListener('click',()=>{bnbLagSrc=b.dataset.src;renderBnb();}));
  el.querySelectorAll('.lag-dist-tgt').forEach(b=>b.addEventListener('click',()=>{bnbLagTgt=b.dataset.tgt;renderBnb();}));

  // Chart.js
  if(lagDistChart){lagDistChart.destroy();lagDistChart=null;}
  const canvas=document.getElementById('lag-dist-canvas');
  const ctx=canvas.getContext('2d');

  const corrValues=lagData.lag_scores.map(d=>d.raw_score??0);
  const labels=lagData.lag_scores.map(d=>'Day '+d.lag_days);

  // Dynamic y-axis bounds: respect spec's -0.1/0.9 range but expand when data exceeds it
  const dataMin=Math.min(...corrValues), dataMax=Math.max(...corrValues);
  const yMin=Math.min(-0.1, Math.floor(dataMin*10)/10-0.05);
  const yMax=Math.max(0.9,  Math.ceil(dataMax*10)/10+0.05);

  const gradient=ctx.createLinearGradient(0,0,0,240);
  gradient.addColorStop(0,'rgba(127,119,221,0.12)');
  gradient.addColorStop(1,'rgba(127,119,221,0)');

  const ptBg=lagData.lag_scores.map((_,i)=>i===peakLag?'#7F77DD':i===0?'rgba(175,169,236,0.4)':'rgba(175,169,236,0.7)');
  const ptBd=lagData.lag_scores.map((_,i)=>i===peakLag?'#534AB7':i===0?'rgba(175,169,236,0.4)':'rgba(175,169,236,0.7)');
  const ptR =lagData.lag_scores.map((_,i)=>i===peakLag?8:5);
  const ptHR=lagData.lag_scores.map((_,i)=>i===peakLag?10:7);

  lagDistChart=new Chart(ctx,{
    type:'line',
    plugins:[{
      id:'lagDistAnnotation',
      afterDraw(chart){
        const{ctx:c,scales:{x,y}}=chart;
        const xPos=x.getPixelForValue(peakLag);
        const yPos=y.getPixelForValue(peakR);
        c.save();
        // Dashed vertical line to peak
        c.beginPath();c.setLineDash([4,4]);
        c.strokeStyle='rgba(127,119,221,0.3)';c.lineWidth=1;
        c.moveTo(xPos,y.top);c.lineTo(xPos,yPos-10);c.stroke();
        c.setLineDash([]);
        // Lag 0 "Ref. only" label
        c.font='9px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif';
        c.fillStyle='#B4B2A9';c.textAlign='center';
        c.fillText('Ref. only',x.getPixelForValue(0),y.getPixelForValue(corrValues[0])-14);
        c.restore();
      }
    }],
    data:{
      labels,
      datasets:[{
        data:corrValues,
        borderColor:'#7F77DD',borderWidth:2,
        backgroundColor:gradient,fill:true,tension:0.35,
        pointBackgroundColor:ptBg,pointBorderColor:ptBd,
        pointRadius:ptR,pointHoverRadius:ptHR,pointBorderWidth:2,
      }]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{display:false},
        tooltip:{
          enabled:false,
          external(context){
            const popup=document.getElementById('lag-dist-popup');
            if(!popup) return;
            const{tooltip}=context;
            if(!tooltip.dataPoints||tooltip.opacity===0){popup.style.display='none';return;}
            const idx=tooltip.dataPoints[0].dataIndex;
            popup.innerHTML=buildLagPopupHTML(lagData.lag_scores[idx],srcLabel,tgtLabel,bnbLagSrc,bnbLagTgt);
            popup.style.display='block';
            // Position: offset from caret, flip if near edges
            const cW=context.chart.canvas.offsetWidth;
            const cH=context.chart.canvas.offsetHeight;
            const pw=230, ph=popup.offsetHeight||180;
            let left=tooltip.caretX+14, top=tooltip.caretY-10;
            if(left+pw>cW-4) left=tooltip.caretX-pw-14;
            if(top+ph>cH) top=Math.max(0,cH-ph-4);
            top=Math.max(0,top);
            popup.style.left=left+'px'; popup.style.top=top+'px';
          }
        }
      },
      scales:{
        x:{
          title:{display:true,text:'Lag offset (days)',color:'#888780',font:{size:11}},
          grid:{color:'rgba(128,128,128,0.06)'},
          ticks:{
            color:ctx=>ctx.index===peakLag?'#534AB7':ctx.index===0?'#B4B2A9':'#888780',
            font:{size:11}
          }
        },
        y:{
          title:{display:true,text:'Correlation (r)',color:'#888780',font:{size:11}},
          min:yMin,max:yMax,
          grid:{color:ctx=>ctx.tick.value===0?'rgba(128,128,128,0.2)':'rgba(128,128,128,0.06)'},
          ticks:{color:'#888780',font:{size:11},callback:v=>v.toFixed(1)}
        }
      }
    }
  });
}

// ─── VISUAL 6 — BUCKETED SCORECARD + DOT PLOT ────────────────────────────────
function renderBucketUnit(metricGaps, bucketMomentum, confidence, totalWeeks, slotId='bnb-bucket-scorecard-2'){
  _bucketUnitData = {metricGaps, bucketMomentum, confidence, totalWeeks};
  if(!_bucketSlots.includes(slotId)) _bucketSlots.push(slotId);
  const canvasId = slotId + '-canvas';
  const el = document.getElementById(slotId);
  if(!el) return;

  const BUCKETS = ['traffic','engagement','cost'];

  function bucketAvgGap(bucket){
    const gs = metricGaps.filter(g => (g.bucket === bucket || g.crossBucket === bucket) && g.gap != null);
    if(!gs.length) return null;
    return gs.reduce((s,g) => s + g.gap, 0) / gs.length;
  }

  function momentumHtml(mom, cfg){
    const sep = `border-top:1px solid ${cfg.sep};padding-top:8px;margin-top:auto;font-size:11px;line-height:1.4`;
    if(!mom || mom.suppressed)
      return `<div style="${sep};color:#9ca3af">\u2014 Insufficient data for momentum</div>`;
    const pill = confidence.level === 'medium'
      ? `<span style="background:rgba(239,159,39,0.15);color:#854F0B;font-size:9px;padding:1px 6px;border-radius:3px;margin-left:5px;vertical-align:middle">Limited data</span>` : '';
    return `<div style="${sep}">
      <span style="color:${mom.color};font-size:15px;font-weight:700;margin-right:4px">${mom.arrow}</span>
      <span style="color:${mom.color}">${mom.label}</span>${pill}
    </div>`;
  }

  const cardHtml = BUCKETS.map(bucket => {
    const cfg = BUCKET_CONFIG[bucket];
    const avgGap = bucketAvgGap(bucket);
    const isSelected = selectedBucket === bucket;
    const bdr = isSelected ? `2px solid ${cfg.selBorder}` : `1px solid ${cfg.border}`;
    const gapTxt = avgGap != null
      ? avgGap >= 0
        ? `\u2212${(avgGap*100).toFixed(1)}%`
        : `+${(Math.abs(avgGap)*100).toFixed(1)}%`
      : '\u2014';
    return `<div class="bnb-bucket-card" data-bucket="${bucket}"
      style="background:${cfg.bg};border:${bdr};border-radius:10px;padding:10px;cursor:pointer;user-select:none;transition:border 0.12s;flex:1;min-height:0;display:flex;flex-direction:column">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
        <span style="font-size:10px;font-weight:700;letter-spacing:.06em;color:${cfg.sub};text-transform:uppercase">${cfg.label}</span>
        <span style="font-size:11px;color:#9ca3af">${totalWeeks}w</span>
      </div>
      <div style="font-size:28px;font-weight:500;color:${cfg.text};line-height:1.0">${gapTxt}</div>
      <div style="font-size:11px;color:${cfg.sub};margin-top:2px">avg. gap in low NB weeks</div>
      ${momentumHtml(bucketMomentum[bucket], cfg)}
    </div>`;
  }).join('');

  // Build plot data
  let plotData, dotPlotTitle;
  if(selectedBucket){
    const cfg = BUCKET_CONFIG[selectedBucket];
    const order = BUCKET_METRIC_ORDER[selectedBucket] || [];
    const filtered = metricGaps.filter(g => (g.bucket === selectedBucket || g.crossBucket === selectedBucket) && g.gap != null);
    const sorted = order.map(key => filtered.find(g => g.key === key)).filter(Boolean);
    filtered.forEach(g => { if(!sorted.includes(g)) sorted.push(g); }); // append any unlisted metrics
    plotData = sorted.map((m, i) => ({
      label: m.label, yIndex: i, highX: 100,
      lowX: m.retained != null ? +(m.retained * 100).toFixed(2) : null,
      gap: m.gap, dotColor: cfg.dot,
    }));
    dotPlotTitle = `${cfg.label} \u2014 metric breakdown`;
  } else {
    plotData = BUCKETS.map((bucket, i) => {
      const avgGap = bucketAvgGap(bucket);
      const cfg    = BUCKET_CONFIG[bucket];
      return {
        label: cfg.label, yIndex: i, highX: 100,
        lowX: avgGap != null ? +((1 - avgGap) * 100).toFixed(2) : null,
        gap: avgGap, dotColor: cfg.dot,
      };
    });
    dotPlotTitle = 'NB Exposure Sensitivity \u2014 overview';
  }

  const chartH = plotData.length * 50 + 60;
  el.innerHTML = `
    <div style="display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:start">
      <div data-leftcol style="display:flex;flex-direction:column;gap:8px">${cardHtml}</div>
      <div class="card" style="padding-bottom:12px">
        <div class="card-title">${dotPlotTitle}</div>
        <div class="card-sub">Each row shows how far low NB weeks fall from the high NB baseline. Closer to 100% = smaller gap. Click a bucket card to drill into individual metrics.</div>
        <div style="position:relative;height:${chartH}px"><canvas id="${canvasId}"></canvas></div>
        <div style="font-size:10px;color:#9ca3af;margin-top:12px;padding-top:10px;border-top:1px solid var(--border);font-style:italic;line-height:1.6">
          Gaps are pairwise normalised per metric \u2014 comparable across rows within the dot plot.<br>
          Momentum = last 4 complete weeks vs full-period avg. gap. Arrow suppressed when confidence is low or data is insufficient. CPA appears in both Engagement and Cost.<br>
          Signal only \u2014 not causal attribution.
        </div>
      </div>
    </div>`;

  el.querySelectorAll('.bnb-bucket-card').forEach(card => {
    card.addEventListener('click', () => {
      const b = card.dataset.bucket;
      selectedBucket = (selectedBucket === b) ? null : b;
      if(_bucketUnitData){
        const{metricGaps:mg, bucketMomentum:bm, confidence:cf, totalWeeks:tw} = _bucketUnitData;
        _bucketSlots.forEach(sid => renderBucketUnit(mg, bm, cf, tw, sid));
      }
      if(_qualityCardData) renderQualityCard(_qualityCardData);
      syncQualityCardHeight();
    });
  });

  renderDotPlot(plotData, canvasId);

  // After browser layout: set left column height to match the dot plot card's
  // natural height so cards shrink to fit rather than stretching the chart.
  requestAnimationFrame(() => {
    const leftCol  = el.querySelector('[data-leftcol]');
    const rightCard = el.querySelector('.card');
    if(leftCol && rightCard) leftCol.style.height = rightCard.offsetHeight + 'px';
  });
}

function renderDotPlot(plotData, canvasId='bnb-bucket-scorecard-2-canvas'){
  if(dotPlotCharts[canvasId]){dotPlotCharts[canvasId].destroy(); delete dotPlotCharts[canvasId];}
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const n   = plotData.length;

  const xVals = plotData.filter(p => p.lowX != null).map(p => p.lowX);
  // Always include 100 (High NB baseline) so it's never pushed off the axis
  const allXVals = [...xVals, 100];
  const xMin = Math.floor(Math.min(...allXVals)) - 5;
  const xMax = Math.max(110, Math.ceil(Math.max(...allXVals)) + 5);

  const connectorPlugin = {
    id:'dotConnector',
    afterDatasetsDraw(chart){
      const{ctx:c, scales:{x,y}} = chart;
      c.save();
      plotData.forEach(p => {
        if(p.lowX == null) return;
        const x1 = x.getPixelForValue(p.lowX);
        const x2 = x.getPixelForValue(100);
        const yPx= y.getPixelForValue(p.yIndex);
        c.beginPath(); c.setLineDash([3,3]);
        c.strokeStyle='#B4B2A9'; c.lineWidth=1.5;
        c.moveTo(x1,yPx); c.lineTo(x2,yPx); c.stroke();
        c.setLineDash([]);
        if(x2-x1 > 32 && p.gap != null){
          c.font='11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif';
          c.fillStyle='#888780'; c.textAlign='center'; c.textBaseline='bottom';
          c.fillText(`\u2212${(p.gap*100).toFixed(1)}%`, (x1+x2)/2, yPx-7);
        }
      });
      c.restore();
    }
  };

  const baselinePlugin = {
    id:'dotBaseline',
    afterDraw(chart){
      const{ctx:c, scales:{x,y}} = chart;
      const x100 = x.getPixelForValue(100);
      c.save();
      c.beginPath(); c.setLineDash([4,3]);
      c.strokeStyle='rgba(127,119,221,0.4)'; c.lineWidth=1.5;
      c.moveTo(x100,y.top); c.lineTo(x100,y.bottom); c.stroke();
      c.setLineDash([]);
      c.font='10px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif';
      c.fillStyle='#7F77DD'; c.textAlign='center'; c.textBaseline='bottom';
      c.fillText('High NB baseline', x100, y.top-2);
      c.restore();
    }
  };

  dotPlotCharts[canvasId] = new Chart(ctx, {
    type:'scatter',
    plugins:[connectorPlugin, baselinePlugin],
    data:{
      datasets:[
        {
          label:'High NB weeks',
          data: plotData.map(p=>({x:100, y:p.yIndex})),
          pointBackgroundColor:'#1D9E75',
          pointBorderColor:'#0F6E56',
          pointRadius:8, pointHoverRadius:10, pointBorderWidth:1.5,
        },
        {
          label:'Low NB weeks',
          data: plotData.map(p=>({x: p.lowX ?? NaN, y:p.yIndex})),
          pointBackgroundColor: plotData.map(p=>p.dotColor),
          pointBorderColor:     plotData.map(p=>p.dotColor),
          pointRadius:8, pointHoverRadius:10, pointBorderWidth:1.5,
        },
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{display:true, position:'bottom',
          labels:{usePointStyle:true, pointStyle:'circle', font:{size:11}, color:'#6b7280', padding:16}},
        tooltip:{
          mode:'nearest', intersect:true,
          callbacks:{
            title(items){ return plotData[items[0].dataIndex]?.label ?? ''; },
            label(item){
              const p = plotData[item.dataIndex];
              if(!p) return '';
              if(item.datasetIndex === 0) return 'High NB weeks: 100% (baseline)';
              if(p.lowX == null) return 'Low NB weeks: \u2014';
              const gapStr = p.gap >= 0 ? `\u2212${(p.gap*100).toFixed(1)}%` : `+${(Math.abs(p.gap)*100).toFixed(1)}%`;
              return `Low NB weeks: ${p.lowX.toFixed(1)}% \u2014 gap: ${gapStr}`;
            },
            afterBody(){ return ['','Gaps are pairwise normalised \u2014 comparable across rows.']; }
          }
        }
      },
      scales:{
        x:{
          min:xMin, max:xMax,
          title:{display:true, text:'% of high NB week value', color:'#888780', font:{size:11}},
          grid:{color:'rgba(128,128,128,0.06)'},
          ticks:{color:'#888780', font:{size:11}, callback:v=>v+'%'},
        },
        y:{
          type:'linear', min:-0.5, max:n-0.5, reverse:true,
          afterBuildTicks(scale){ scale.ticks = plotData.map((_,i)=>({value:i})); },
          grid:{display:false}, border:{display:false},
          ticks:{
            color:'#6b7280', font:{size:12},
            callback:(v)=> plotData[Math.round(v)]?.label ?? null,
          }
        }
      }
    }
  });
}

function renderGapBarChart(metricGaps){
  const el=document.getElementById('bnb-gap-chart');
  if(!el) return;

  // Filter nulls, sort by gap descending (most sensitive first)
  const validGaps=metricGaps.filter(g=>g.gap!=null&&g.retained!=null)
    .sort((a,b)=>b.gap-a.gap);

  if(!validGaps.length){
    el.innerHTML=`<div class="card" style="flex:1"><div class="card-title">NB Exposure Sensitivity</div>
      <div class="aw-warn"><span class="aw-warn-icon">&#9888;</span>No metric gap data available for the current period.</div></div>`;
    return;
  }

  const n=validGaps.length;
  const chartH=Math.min(n*40+80,260);

  function fmtMetricVal(key,val){
    if(val==null||!isFinite(val)) return '\u2014';
    switch(key){
      case 'impressions': case 'clicks': return Math.round(val).toLocaleString();
      case 'conversions': return val.toFixed(1);
      case 'ctr': case 'cvr': return (val*100).toFixed(2)+'%';
      case 'cpa': case 'cost': case 'cpc': return '$'+val.toFixed(2);
      default: return val.toFixed(2);
    }
  }

  const mostSens =validGaps[0];
  const leastSens=validGaps[validGaps.length-1];
  const avgGap   =validGaps.reduce((s,g)=>s+g.gap,0)/validGaps.length;
  const labels   =validGaps.map(g=>g.label);
  const retainedData=validGaps.map(g=>+(g.retained*100).toFixed(2));
  const gapData  =validGaps.map(g=>+(g.gap*100).toFixed(2));

  el.innerHTML=`<div class="card" style="flex:1;display:flex;flex-direction:column">
    <div class="card-title">NB Exposure Sensitivity</div>
    <div class="card-sub">How much each brand metric closes when non-brand exposure is high vs. low. Sorted by sensitivity gap \u2014 most affected metric at top.</div>
    <div style="position:relative;flex:1;min-height:${chartH}px"><canvas id="gap-bar-canvas"></canvas></div>
    <div class="ld-stats-row" style="grid-template-columns:repeat(3,1fr)">
      <div class="ld-stat">
        <div class="ld-stat-label">Most sensitive</div>
        <div class="ld-stat-val" style="color:#E24B4A">${mostSens.label}</div>
        <div class="ld-stat-sub">\u2212${(mostSens.gap*100).toFixed(1)}% gap</div>
      </div>
      <div class="ld-stat">
        <div class="ld-stat-label">Least sensitive</div>
        <div class="ld-stat-val" style="color:#1D9E75">${leastSens.label}</div>
        <div class="ld-stat-sub">\u2212${(leastSens.gap*100).toFixed(1)}% gap</div>
      </div>
      <div class="ld-stat">
        <div class="ld-stat-label">Avg. gap</div>
        <div class="ld-stat-val">\u2212${(avgGap*100).toFixed(1)}%</div>
        <div class="ld-stat-sub">across ${n} metric${n!==1?'s':''}</div>
      </div>
    </div>
    <div class="ld-footer-note" style="font-style:italic">Gap is defined as the proportional performance difference between high and low NB exposure weeks within the same account and period. This isolates exposure association, not causal lift.</div>
  </div>`;

  if(gapBarChart){gapBarChart.destroy();gapBarChart=null;}

  // Defer Chart.js init to after the flex layout has settled so the canvas
  // container already has its final stretched height when Chart.js measures it.
  requestAnimationFrame(() => {
  const canvas=document.getElementById('gap-bar-canvas');
  if(!canvas) return; // guard against re-renders that swap out the DOM
  const ctx=canvas.getContext('2d');

  const gapPlugin={
    id:'gapAnnotation',
    afterDraw(chart){
      const{ctx:c,scales:{x,y}}=chart;
      const x100=x.getPixelForValue(100);

      // Dashed reference line at 100% ("High NB" baseline)
      c.save();
      c.beginPath();
      c.setLineDash([4,3]);
      c.strokeStyle='rgba(127,119,221,0.45)';
      c.lineWidth=1.5;
      c.moveTo(x100,y.top);
      c.lineTo(x100,y.bottom);
      c.stroke();
      c.setLineDash([]);

      // "High NB" label above the line
      c.font='10px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif';
      c.fillStyle='#7F77DD';
      c.textAlign='center';
      c.textBaseline='bottom';
      c.fillText('High NB',x100,y.top-2);

      // Gap % labels inside the rose segment (only when wide enough)
      const meta=chart.getDatasetMeta(1);
      meta.data.forEach((bar,i)=>{
        const gPct=gapData[i];
        if(!gPct) return;
        const segW=bar.x-bar.base;
        if(segW<28) return;
        const midX=(bar.base+bar.x)/2;
        c.font='700 10px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif';
        c.fillStyle='#A32D2D';
        c.textAlign='center';
        c.textBaseline='middle';
        c.fillText('\u2212'+gPct.toFixed(1)+'%',midX,bar.y);
      });

      c.restore();
    }
  };

  gapBarChart=new Chart(ctx,{
    type:'bar',
    plugins:[gapPlugin],
    data:{
      labels,
      datasets:[
        {
          label:'Retained',
          data:retainedData,
          backgroundColor:'#1D9E75',
          borderColor:'#0F6E56',
          borderWidth:0.5,
          borderRadius:{topLeft:0,topRight:0,bottomLeft:3,bottomRight:3},
          borderSkipped:false,
          stack:'gap',
        },
        {
          label:'Gap',
          data:gapData,
          backgroundColor:'rgba(252,235,235,0.9)',
          borderColor:'#F09595',
          borderWidth:0.5,
          borderRadius:{topLeft:3,topRight:3,bottomLeft:0,bottomRight:0},
          borderSkipped:false,
          stack:'gap',
        },
      ]
    },
    options:{
      indexAxis:'y',
      responsive:true,
      maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{
          callbacks:{
            title(items){return items[0].label;},
            label(item){
              const g=validGaps[item.dataIndex];
              if(item.datasetIndex===0)
                return `Retained: ${(g.retained*100).toFixed(1)}% of high NB value`;
              return `Gap: \u2212${(g.gap*100).toFixed(1)}%`;
            },
            afterBody(items){
              const g=validGaps[items[0].dataIndex];
              return[
                `High NB: ${fmtMetricVal(g.key,g.highVal)}`,
                `Low NB:  ${fmtMetricVal(g.key,g.lowVal)}`,
                g.higherIsBetter?'Higher is better':'Lower is better',
              ];
            }
          }
        }
      },
      scales:{
        x:{
          stacked:true,
          min:0,
          max:100,
          title:{display:true,text:'% of high NB week value',color:'#888780',font:{size:11}},
          grid:{color:'rgba(128,128,128,0.06)'},
          ticks:{color:'#888780',font:{size:11},callback:v=>v+'%'},
        },
        y:{
          stacked:true,
          grid:{display:false},
          border:{display:false},
          ticks:{
            color:ctx=>ctx.index===0?'#E24B4A':'#6b7280',
            font:{size:12},
          }
        }
      }
    }
  });
  }); // end requestAnimationFrame
}

function openAwSidebar(aw){
  const {corrResults, reliableMax, peakLag, peakR, sharpness, weeks, nbSeries}=aw;
  const nWeeks=weeks.length;

  // General data quality flags
  const flags=[];
  if(nWeeks<10) flags.push(`Only ${nWeeks} complete weeks — more data will improve reliability.`);
  if(peakR<0.35) flags.push('Peak correlation is weak (r < 35%). Interpret with caution.');
  if(sharpness==='Flat') flags.push('No clear peak across lags — the attribution signal is noisy or absent.');
  if(peakLag===reliableMax&&reliableMax<14) flags.push(`Peak falls at the reliability boundary (lag ${reliableMax}). A longer date range may reveal a later true peak.`);

  // Contextual note: smart bidding on brand campaigns
  const brandCamps=Object.entries(META.campaignBrandMap).filter(([,v])=>v).map(([k])=>k);
  const smartBidding=brandCamps.some(c=>{
    const bs=(META.campBidCache[c]||'').toLowerCase();
    return bs.includes('target')||bs.includes('maximize')||bs.includes('smart');
  });

  const sharpCls=sharpness==='Sharp'?'sharp-sharp':sharpness==='Moderate'?'sharp-moderate':'sharp-flat';

  // Sharpness bar
  const relR=corrResults.filter(c=>c.lag>0&&c.lag<=reliableMax);
  const avgR=relR.length>0?relR.reduce((s,c)=>s+Math.max(0,c.r),0)/relR.length:0;
  const sharpRatio=avgR>0?peakR/avgR:0;
  const sharpPct=Math.min(100,Math.max(4,(sharpRatio/3)*100));
  const sharpBarColor=sharpness==='Sharp'?'#27500A':sharpness==='Moderate'?'#EF9F27':'#9ca3af';
  const sharpDesc=sharpness==='Sharp'
    ?`Peak is ${sharpRatio.toFixed(1)}\u00d7 the average — clear single-lag signal`
    :sharpness==='Moderate'
    ?`Peak is ${sharpRatio.toFixed(1)}\u00d7 the average — moderate concentration`
    :`Peak is ${sharpRatio.toFixed(1)}\u00d7 the average — distributed across many lags`;

  // ── Section 3: Position Tier Breakdown ──────────────────────────────────────
  const fmtN=v=>v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e3?(v/1e3).toFixed(1)+'k':Math.round(v).toLocaleString();
  let absTopTotal=0,topTotal=0,otherTotal=0,rawTotal=0,weightedTotal=0;
  for(const w of weeks){
    for(const r of w.rows.filter(r=>!r.isBrand)){
      const absTop=r.imprAbsTopPct*r.impr;
      const topNotAbs=Math.max(0,r.imprTopPct-r.imprAbsTopPct)*r.impr;
      const other=(1-r.imprTopPct)*r.impr;
      absTopTotal+=absTop; topTotal+=topNotAbs; otherTotal+=other;
      rawTotal+=r.impr;
      weightedTotal+=absTop*1.0+topNotAbs*0.6+other*0.2;
    }
  }
  const qualDiscount=rawTotal>0?((1-weightedTotal/rawTotal)*100):0;
  const tierBars=[
    {label:'Abs. Top',val:absTopTotal,color:'#1D9E75',weight:'1.0\u00d7'},
    {label:'Top (not abs.)',val:topTotal,color:'#5DCAA5',weight:'0.6\u00d7'},
    {label:'Other',val:otherTotal,color:'#B4B2A9',weight:'0.2\u00d7'},
  ];
  const tierBarsHtml=rawTotal>0?tierBars.map(t=>{
    const pct=(t.val/rawTotal*100);
    return `<div>
      <div style="display:flex;justify-content:space-between;align-items:center;font-size:11px;margin-bottom:3px">
        <span style="color:${t.color};font-weight:600">${t.label}</span>
        <span style="color:var(--muted)">${pct.toFixed(1)}% &nbsp;<span style="color:${t.color};font-weight:700">${t.weight}</span></span>
      </div>
      <div style="height:5px;border-radius:3px;background:#f0f0f0;overflow:hidden">
        <div style="height:100%;width:${pct.toFixed(1)}%;background:${t.color};border-radius:3px"></div>
      </div>
    </div>`;
  }).join(''):'<div style="font-size:12px;color:var(--muted)">No NB impression data available</div>';

  // ── Section 4: Per-week metric flags ─────────────────────────────────────────
  // Brand IS per week (already computed as brandSeries in aw)
  const brandISweek=aw.brandSeries||[];
  const avgBrandIS=brandISweek.length>0?brandISweek.reduce((s,v)=>s+v,0)/brandISweek.length:0;
  // NB click share per week: NB clicks / total clicks
  const nbClickShareWeek=weeks.map(w=>{
    const nbCl=w.rows.filter(r=>!r.isBrand).reduce((s,r)=>s+r.clicks,0);
    const brCl=w.rows.filter(r=>r.isBrand).reduce((s,r)=>s+r.clicks,0);
    const tot=nbCl+brCl;
    return tot>0?nbCl/tot:0;
  });
  const avgNbClickShare=nbClickShareWeek.length>0?nbClickShareWeek.reduce((s,v)=>s+v,0)/nbClickShareWeek.length:0;
  const weekAnomalies=weeks.map((w,i)=>{
    const dt=new Date(w.weekStart+'T00:00:00');
    const lbl=dt.toLocaleDateString('en-GB',{month:'short',day:'numeric'});
    const wFlags=[];
    if(avgBrandIS>0&&brandISweek[i]<avgBrandIS*0.5) wFlags.push(`Brand IS ${(brandISweek[i]*100).toFixed(0)}% vs avg ${(avgBrandIS*100).toFixed(0)}%`);
    if(avgNbClickShare>0&&nbClickShareWeek[i]<avgNbClickShare*0.5) wFlags.push(`NB click share ${(nbClickShareWeek[i]*100).toFixed(0)}% vs avg ${(avgNbClickShare*100).toFixed(0)}%`);
    return wFlags.length>0?{lbl,flags:wFlags}:null;
  }).filter(Boolean);

  document.getElementById('aw-sidebar-body').innerHTML=`
    <!-- 1. Signal Strength -->
    <div>
      <div class="sb-section-title">Signal Strength</div>
      <div class="sb-strength-row">
        <div>
          <div class="sb-strength-val">${(peakR*100).toFixed(1)}%</div>
          <div style="font-size:11px;color:var(--muted);margin-top:2px">Peak Pearson r &mdash; lag ${peakLag}d</div>
        </div>
        <span class="aw-sharpness ${sharpCls}">${sharpness}</span>
      </div>
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:3px">Correlation (r)</div>
      <div class="sb-r-bar-wrap"><div class="sb-r-bar" style="width:${Math.max(2,Math.min(100,Math.round(peakR*100)))}%"></div></div>
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:3px">Signal sharpness</div>
      <div class="sb-sharpness-bar-bg"><div class="sb-sharpness-bar-fill" style="width:${sharpPct.toFixed(1)}%;background:${sharpBarColor}"></div></div>
      <div style="font-size:12px;color:var(--muted)">${sharpDesc}</div>
      <div style="font-size:12px;color:var(--muted);margin-top:6px">Correlation between non-brand position-weighted exposure (shifted ${peakLag}d forward) and brand Search Impression Share.</div>
      <div class="aw2-lag-chart-wrap" style="margin-top:12px"><canvas id="aw-sb-lag-canvas" aria-label="Lag correlation bar chart"></canvas></div>
      <div style="font-size:10px;color:var(--muted);margin-top:4px">Lag offset (NB exposure &#8594; Brand Search IS)</div>
    </div>

    <!-- 2. How Calculated -->
    <div>
      <div class="sb-section-title">How This Is Calculated</div>
      <div style="font-size:13px;color:var(--text);display:flex;flex-direction:column;gap:8px">
        <p style="margin:0"><strong>Step 1:</strong> Each week&rsquo;s NB exposure score is the sum of position-weighted non-brand impressions (Abs. Top &times;1.0, Top &times;0.6, Other &times;0.2).</p>
        <p style="margin:0"><strong>Step 2:</strong> Brand signal = impression-eligible-weighted average brand Search IS per week.</p>
        <p style="margin:0"><strong>Step 3:</strong> Pearson r is computed at lags 0&ndash;14 by shifting NB exposure forward. The lag with the highest r (and &ge;3 data pairs) is the estimated window. Sharpness = peak&divide;average &mdash; Sharp &gt;1.6&times;, Moderate &gt;1.3&times;, Flat &le;1.3&times;.</p>
      </div>
    </div>

    <!-- 3. Position Tier Breakdown -->
    <div>
      <div class="sb-section-title">Position Tier Breakdown</div>
      <div class="sb-metric-row"><span>Weighted total score</span><span class="sb-metric-val" style="color:#1D9E75">${fmtN(weightedTotal)}</span></div>
      <div class="sb-metric-row"><span>Raw total impressions</span><span class="sb-metric-val">${fmtN(rawTotal)}</span></div>
      <div class="sb-metric-row"><span>Quality discount</span><span class="sb-metric-val">${qualDiscount.toFixed(1)}%</span></div>
      <div style="margin-top:10px;display:flex;flex-direction:column;gap:8px">${tierBarsHtml}</div>
    </div>

    <!-- 4. Data Quality + Per-week flags -->
    <div>
      <div class="sb-section-title">Data Quality</div>
      <div class="sb-metric-row"><span>Complete weeks analysed</span><span class="sb-metric-val">${nWeeks}</span></div>
      <div class="sb-metric-row"><span>Reliable lag range</span><span class="sb-metric-val">0&ndash;${reliableMax} days</span></div>
      <div class="sb-metric-row"><span>Max lags tested</span><span class="sb-metric-val">0&ndash;14 days</span></div>
      ${weekAnomalies.length>0?`
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:10px 0 6px">Weeks with anomalies</div>
        ${weekAnomalies.map(wf=>`<div class="sb-flag"><span class="sb-flag-icon">&#9888;</span><div><div style="font-weight:600;margin-bottom:2px">${wf.lbl}</div>${wf.flags.map(f=>`<div>${f}</div>`).join('')}</div></div>`).join('')}
      `:'<div style="font-size:12px;color:var(--green);font-weight:600;margin-top:6px">&#10003; No week-level anomalies detected</div>'}
      ${flags.length?flags.map(f=>`<div class="sb-flag" style="margin-top:6px"><span class="sb-flag-icon">&#9888;</span><span>${f}</span></div>`).join(''):''}
    </div>

    <!-- 5. Contextual Notes -->
    <div>
      <div class="sb-section-title">Contextual Notes</div>
      <div style="font-size:13px;color:var(--text);display:flex;flex-direction:column;gap:8px">
        ${smartBidding?`<p style="margin:0">&#9888; One or more brand campaigns use smart bidding. Smart bidding responds to branded demand independently, which may compress or amplify the measured window.</p>`:''}
        <p style="margin:0">This analysis operates at a population level — it reflects aggregate patterns across all users in the period, not individual conversion paths.</p>
        <p style="margin:0">Cross-device behaviour is not captured here. A user exposed on mobile may convert on desktop; this appears as no lag when the actual window was days.</p>
        <p style="margin:0">External factors — seasonality, PR, promotions — may independently influence brand search volume and introduce spurious correlations.</p>
      </div>
    </div>`;

  document.getElementById('aw-overlay').style.display='block';
  document.getElementById('aw-sidebar').classList.add('sidebar-open');

  // Render lag bar chart in sidebar after DOM is ready
  if(awSidebarBarChart){awSidebarBarChart.destroy();awSidebarBarChart=null;}
  awSidebarBarChart=renderLagBarsChart('aw-sb-lag-canvas', corrResults, peakLag, reliableMax);
}

function closeAwSidebar(){
  document.getElementById('aw-sidebar').classList.remove('sidebar-open');
  document.getElementById('aw-overlay').style.display='none';
  if(awSidebarBarChart){awSidebarBarChart.destroy();awSidebarBarChart=null;}
}

// ─── INIT ─────────────────────────────────────────────────────────────────
function init(payload){
  RAW  = payload.rows;
  META = payload.meta;

  // Reset state
  state.activeCampaign = null;
  state.lastCampaign   = null;
  state.activeKeyword  = null;
  state.lastKeyword    = null;
  state.activeKpi      = null;
  state.customRange    = null;
  state.activePage     = 'overview';
  sisBdMode                = 'device';
  campSort                 = { key:null, dir:1 };
  kwSort                   = { key:null, dir:1 };
  ngramSize=1; ngramSort={col:'clicks',dir:'desc'}; ngramShowAll=false;
  state.cvrFloor=null; state.ctrFloor=null; state.cpaTarget=null;
  state.bubbleMetric='cost'; state.expandedBucket=null;
  state.activeKw=null; state.activeKwSource=null;
  if(kwEfficiencyChart){kwEfficiencyChart.destroy();kwEfficiencyChart=null;}
  v1Metric                 = 0;
  if(v1Chart){      v1Chart.destroy();      v1Chart=null; }
  if(kwTrendChart){ kwTrendChart.destroy(); kwTrendChart=null; }
  state.kwPageSelectedKpi  = null;
  state.kwPageSelectedKw   = null;
  state.kwPageSelectedMt   = null;
  state.kwPageFilter       = 'all';
  kwInlineVisible=true; kwSidebarClosed=false;
  if(kwSidebarObserver){kwSidebarObserver.disconnect();kwSidebarObserver=null;}
  [kwSbKpiChart,kwSbKwChart,kwSbMtChart,kwOverlayChart].forEach(c=>{if(c)c.destroy();});
  kwSbKpiChart=kwSbKwChart=kwSbMtChart=kwOverlayChart=null;
  _kwPageData=null;
  document.getElementById('kw-overlay')?.remove();
  const kwSbReset=document.getElementById('kw-sidebar');
  if(kwSbReset){kwSbReset.classList.remove('kw-sb-open');}
  const kwTabReset=document.getElementById('kw-sidebar-tab');
  if(kwTabReset) kwTabReset.style.display='none';
  const kwCntReset=document.getElementById('kw-sidebar-count');
  if(kwCntReset) kwCntReset.style.display='none';

  // Default period — 90D or longest available
  if(META.totalDays>=90)      state.activePeriod='90D';
  else if(META.totalDays>=30) state.activePeriod='30D';
  else if(META.totalDays>=7)  state.activePeriod='7D';
  else                        state.activePeriod='all';

  // Pill visibility
  const pv = period => {
    const btn=document.querySelector(`.period-pill[data-period="${period}"]`);
    if(btn) btn.style.display='none';
  };
  document.querySelectorAll('.period-pill').forEach(b=>b.style.display='');
  if(META.totalDays<7)  pv('7D');
  if(META.totalDays<30) pv('30D');
  if(META.totalDays<90) pv('90D');

  document.getElementById('date-range-label').textContent = META.dateRangeLabel;

  // Show/hide keywords nav item based on data
  const kwNav=document.getElementById('nav-keywords');
  if(kwNav) kwNav.style.display=META.hasKeywordData?'':'none';

  // Show dashboard + nav
  document.getElementById('upload-panel').style.display='none';
  document.getElementById('dashboard').style.display='block';
  document.getElementById('page-nav').style.display='block';
  switchPage('overview'); // resets page visibility + nav highlight
}

// ─── FILE HANDLING ────────────────────────────────────────────────────────
async function handleFile(file){
  const errEl = document.getElementById('upload-error');
  errEl.style.display='none';
  try {
    let rows2d;
    const name=file.name.toLowerCase();
    if(name.endsWith('.csv')){
      rows2d = parseCSV(await file.text());
    } else if(name.endsWith('.xlsx')||name.endsWith('.xls')){
      const buf = await file.arrayBuffer();
      const wb  = XLSX.read(buf,{type:'array'});
      const ws  = wb.Sheets[wb.SheetNames[0]];
      rows2d    = XLSX.utils.sheet_to_json(ws,{header:1,raw:false});
    } else {
      throw new Error('Please upload a .csv or .xlsx file');
    }
    init(buildPayload(rows2d));
  } catch(e){
    errEl.textContent = e.message;
    errEl.style.display='block';
    console.error(e);
  }
}

// ─── EVENT WIRING ─────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', ()=>{
  const dropZone = document.getElementById('drop-zone');
  const fileInput= document.getElementById('file-input');

  // Drop zone
  dropZone.addEventListener('click', ()=>fileInput.click());
  dropZone.addEventListener('dragover', e=>{ e.preventDefault(); dropZone.classList.add('drag-over') });
  dropZone.addEventListener('dragleave',  ()=>dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e=>{
    e.preventDefault(); dropZone.classList.remove('drag-over');
    if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', e=>{ if(e.target.files[0]) handleFile(e.target.files[0]) });

  // "Upload new file" button — show upload panel, reset file input
  document.getElementById('new-file-btn').addEventListener('click', ()=>{
    fileInput.value='';
    document.getElementById('upload-error').style.display='none';
    document.getElementById('dashboard').style.display='none';
    document.getElementById('upload-panel').style.display='flex';
  });

  // Campaign table popup — event delegation (works across re-renders)
  let popShowTimer=null, popHideTimer=null;
  const popup=document.getElementById('popup');
  const campWrap=document.getElementById('campaign-table-wrap');

  campWrap.addEventListener('mouseover', e=>{
    const td=e.target.closest('td.mc');
    if(!td) return;
    clearTimeout(popHideTimer); clearTimeout(popShowTimer);
    if(popup.style.display==='block'){
      showCampPopup(td, e.clientX, e.clientY); // instant update between cells
    } else {
      popShowTimer=setTimeout(()=>showCampPopup(td,e.clientX,e.clientY), 200);
    }
  });
  campWrap.addEventListener('mouseout', e=>{
    if(!e.target.closest('td.mc')) return;
    clearTimeout(popShowTimer);
    popHideTimer=setTimeout(()=>{ popup.style.display='none' }, 150);
  });
  popup.addEventListener('mouseenter', ()=>clearTimeout(popHideTimer));
  popup.addEventListener('mouseleave', ()=>{
    popHideTimer=setTimeout(()=>{ popup.style.display='none' }, 150);
  });

  // Period pills (event delegation)
  document.querySelector('.period-pills').addEventListener('click', e=>{
    const btn=e.target.closest('.period-pill');
    if(!btn) return;
    state.activePeriod=btn.dataset.period;
    state.customRange=null; // period pill always clears custom range
    // Efficiency scatter floors are period-relative — recompute on next render
    state.cvrFloor=null; state.ctrFloor=null;
    state.expandedBucket=null; state.activeKw=null; state.activeKwSource=null;
    renderAll();
  });

  // Page nav
  document.getElementById('nav-toggle').addEventListener('click', ()=>{
    document.getElementById('page-nav').classList.toggle('nav-collapsed');
    const collapsed = document.getElementById('page-nav').classList.contains('nav-collapsed');
    document.getElementById('nav-toggle').textContent = collapsed ? '›' : '‹';
  });
  document.querySelectorAll('#page-nav .nav-item').forEach(item=>{
    item.addEventListener('click', ()=>switchPage(item.dataset.page));
  });

  // Attribution sidebar close
  document.getElementById('aw-close').addEventListener('click', closeAwSidebar);
  document.getElementById('aw-overlay').addEventListener('click', closeAwSidebar);

  // Keyword sidebar controls
  document.getElementById('kw-sidebar-close').addEventListener('click',()=>{kwSidebarClosed=true;renderKwSidebar();});
  document.getElementById('kw-sidebar-clear').addEventListener('click',()=>{
    state.kwPageSelectedKpi=null;state.kwPageSelectedKw=null;state.kwPageSelectedMt=null;state.activeKeyword=null;
    renderKeywordsPage();
  });
  document.getElementById('kw-sidebar-tab').addEventListener('click',()=>{kwSidebarClosed=false;renderKwSidebar();});

  // ── Trend chart drag-to-select date range ─────────────────────────────────
  const trendCanvas = document.getElementById('trend-chart');
  const trendWrap   = trendCanvas.parentElement;

  // Selection highlight div (lives inside chart container, pointer-events:none)
  const selDiv = document.createElement('div');
  selDiv.style.cssText = 'position:absolute;top:0;bottom:0;background:rgba(55,138,221,0.13);border-left:1.5px solid rgba(55,138,221,0.45);border-right:1.5px solid rgba(55,138,221,0.45);pointer-events:none;display:none;z-index:4;transition:none';
  trendWrap.appendChild(selDiv);
  trendCanvas.style.cursor = 'crosshair';

  let dragStartX = null, dragMoved = false;

  trendCanvas.addEventListener('mousedown', e=>{
    if(!trendChart) return;
    const rect = trendCanvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const ca = trendChart.chartArea;
    if(x < ca.left || x > ca.right) return;
    dragStartX = x;
    dragMoved = false;
    selDiv.style.top    = ca.top+'px';
    selDiv.style.height = (ca.bottom-ca.top)+'px';
    selDiv.style.left   = x+'px';
    selDiv.style.width  = '0';
    selDiv.style.display= 'block';
  });

  trendCanvas.addEventListener('mousemove', e=>{
    if(dragStartX===null) return;
    const rect = trendCanvas.getBoundingClientRect();
    const ca   = trendChart.chartArea;
    const x    = Math.max(ca.left, Math.min(ca.right, e.clientX-rect.left));
    selDiv.style.left  = Math.min(dragStartX,x)+'px';
    selDiv.style.width = Math.abs(x-dragStartX)+'px';
    if(Math.abs(x-dragStartX)>5) dragMoved=true;
  });

  document.addEventListener('mouseup', e=>{
    if(dragStartX===null) return;
    selDiv.style.display='none';
    if(!dragMoved || !trendChart){ dragStartX=null; return; }

    const rect   = trendCanvas.getBoundingClientRect();
    const ca     = trendChart.chartArea;
    const endX   = Math.max(ca.left, Math.min(ca.right, e.clientX-rect.left));
    const leftX  = Math.min(dragStartX, endX);
    const rightX = Math.max(dragStartX, endX);
    dragStartX   = null;

    const labels = trendChart.data.labels;
    const n      = labels.length;
    if(n<2) return;

    const toIdx = px => Math.max(0, Math.min(n-1, Math.round((px-ca.left)/(ca.right-ca.left)*(n-1))));
    const si = toIdx(leftX), ei = toIdx(rightX);
    if(si>=ei) return;

    const startMs = new Date(labels[si]).getTime();
    const endMs   = new Date(labels[ei]).getTime() + (isWeeklyMode()?7*86400000:86400000) - 1;
    if(isNaN(startMs)||isNaN(endMs)) return;

    state.customRange = { startMs, endMs };
    renderAll();
  });
});
</script>
