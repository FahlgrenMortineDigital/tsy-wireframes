<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ohio Regions Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,600;1,700;1,800&family=Saira+Condensed:ital,wght@0,500;0,600;0,700;1,600;1,700;1,800&family=Oswald:wght@500;600;700&family=Sora:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&family=Libre+Franklin:ital,wght@0,400;0,600;0,700;1,600&display=swap" rel="stylesheet" />
<style>
  :root {
    /* ---- editable color tokens (defaults = soft 3D) ---- */
    --region-grad-1: #cfdaf3;
    --region-grad-2: #ddd6ef;
    --region-grad-3: #f4d9e8;
    --wall: #9c97d2;
    --accent: #5b54b0;
    --wall-active: color-mix(in srgb, var(--wall) 62%, var(--accent) 38%);
    --divider: #3b3a6e;
    --map-label: #2a2b61;
    --lake: #84b7dd;
    --lake-edge: #6ba3cf;
    --terrain: #e9e9ea;
    --terrain-green: #dfe7d6;
    --terrain-tan: #ece5d8;
    --state-name: #adb0b6;
    --state-border: #c9ccd1;
    --city-major: #21234d;
    --city-minor: #3b3a6e;
    --city-label: #2a2b61;
    --capital: #e23b3b;
    /* ---- editable type tokens ---- */
    --font-display: 'Archivo', sans-serif;
    --font-region: 'Saira Condensed', sans-serif;
    --font-body: 'Archivo', sans-serif;
    /* ---- perspective tilt ---- */
    --tilt-x: 20deg;
    --tilt-z: -5deg;
    --tilt-scale: 1.04;
    /* ---- surface ---- */
    --panel: #eaf2fb;
    --ink: #16234a;
    --ink-soft: #5c6781;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--font-body);
    background: #f4f8fd;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .app {
    height: 100vh;
    display: grid;
    grid-template-columns: minmax(340px, 33%) 1fr;
    background:
      radial-gradient(1200px 900px at 78% 40%, #eef5fc 0%, #f4f8fd 60%);
  }

  /* ---------------- left column ---------------- */
  .panel {
    padding: clamp(28px, 4vh, 56px) clamp(26px, 2.4vw, 52px);
    display: flex;
    flex-direction: column;
    gap: 22px;
    overflow-y: auto;
    border-right: 1px solid #e1e9f2;
  }
  .eyebrow {
    font-family: var(--font-region);
    font-style: italic;
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
    font-size: 14px;
    color: var(--accent);
    margin: 0;
  }
  .title {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(34px, 3.4vw, 54px);
    line-height: 1.02;
    letter-spacing: -0.015em;
    margin: 0;
    color: var(--ink);
    text-wrap: balance;
  }
  .title .seven { color: var(--accent); }
  .lead {
    margin: 0;
    font-size: 16px;
    line-height: 1.55;
    color: #5c6781;
    max-width: 42ch;
  }

  .region-list {
    list-style: none;
    margin: 6px 0 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .region-item {
    -webkit-appearance: none; appearance: none;
    background: transparent;
    border: 0;
    border-top: 1px solid #e2e9f1;
    width: 100%;
    text-align: left;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 10px 14px 6px;
    font-family: var(--font-display);
    color: var(--ink);
    transition: padding-left .22s ease, color .18s ease, background .18s ease;
    border-radius: 8px;
  }
  .region-item:last-child { border-bottom: 1px solid #e2e9f1; }
  .region-item .chev {
    color: var(--accent);
    font-size: 20px;
    line-height: 1;
    transition: transform .22s ease;
    display: inline-block;
  }
  .region-item .ri-name {
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    font-size: 16px;
  }
  .region-item .ri-tag {
    margin-left: auto;
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 12.5px;
    letter-spacing: 0;
    text-transform: none;
    color: #97a3b8;
    opacity: 0;
    transform: translateX(6px);
    transition: opacity .2s ease, transform .2s ease;
    max-width: 46%;
    text-align: right;
  }
  .region-item:hover, .region-item.active {
    background: #ffffff;
    padding-left: 16px;
    color: var(--accent);
    box-shadow: 0 6px 20px -14px rgba(40,40,90,.4);
  }
  .region-item:hover .chev, .region-item.active .chev { transform: translateX(3px); }
  .region-item.active .ri-tag { opacity: 1; transform: none; }
  .region-item.pinned { background: linear-gradient(90deg, #ffffff, #f3f0fc); }
  .region-item.pinned::after {
    content: '📌'; margin-left: 8px; font-size: 12px; filter: grayscale(.2);
  }

  /* ---------------- detail panel (floats on map) ---------------- */
  .detail {
    position: absolute;
    left: clamp(18px, 2.4vw, 40px);
    bottom: clamp(18px, 3vh, 40px);
    width: min(310px, 36%);
    border-radius: 16px;
    background: linear-gradient(160deg, rgba(255,255,255,.96), rgba(244,241,252,.96));
    backdrop-filter: blur(6px);
    border: 1px solid #e7e1f6;
    padding: 20px;
    opacity: 0;
    transform: translateY(12px);
    pointer-events: none;
    transition: opacity .3s ease, transform .3s ease;
    box-shadow: 0 26px 50px -28px rgba(50,40,110,.55);
    z-index: 5;
  }
  .detail.show { opacity: 1; transform: none; }
  .detail-eyebrow {
    font-family: var(--font-region); font-style: italic; font-weight: 700;
    text-transform: uppercase; letter-spacing: .14em; font-size: 11.5px; color: var(--accent);
  }
  .detail-name {
    font-family: var(--font-display); font-weight: 800; font-size: 26px;
    margin: 4px 0 2px; letter-spacing: -0.01em; color: var(--ink);
  }
  .detail-tag { margin: 0 0 12px; font-size: 14px; color: #69748d; line-height: 1.4; }
  .detail-cities { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .detail-cities span {
    font-size: 12px; font-weight: 600; letter-spacing: .02em;
    background: #ece7fa; color: #4a3f8f; border-radius: 20px; padding: 4px 11px;
  }
  .detail-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .detail-list li {
    position: relative; padding-left: 20px; font-size: 13.5px; line-height: 1.4; color: #44506b;
  }
  .detail-list li::before {
    content: ''; position: absolute; left: 2px; top: 7px; width: 8px; height: 8px;
    border-radius: 2px; background: var(--accent); transform: rotate(45deg);
  }

  .hint {
    margin-top: auto;
    padding-top: 14px;
    font-size: 12.5px;
    color: #9aa6ba;
    display: flex; align-items: center; gap: 8px;
  }
  .hint kbd {
    font-family: var(--font-body); font-size: 11px; background: #fff; border: 1px solid #dde5ef;
    border-radius: 5px; padding: 1px 6px; color: #6b7790;
  }

  /* ---------------- map ---------------- */
  .stage {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    padding: 1.5vw 2vw;
    min-width: 0;
    perspective: 1700px;
    perspective-origin: 50% 42%;
  }
  #map-root {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    transform-style: preserve-3d;
    transform: rotateX(var(--tilt-x, 20deg)) rotateZ(var(--tilt-z, -5deg)) scale(var(--tilt-scale, 1.04));
    transition: transform .45s cubic-bezier(.4,0,.2,1);
  }
  #map-svg { width: 100%; height: 100%; display: block; }

  /* region faces + walls */
  #state .top {
    stroke: var(--divider);
    stroke-width: 0.8;
    stroke-linejoin: round;
    transition: stroke .2s ease;
  }
  #state .walls path { fill: var(--wall); }
  .region.active .walls path { fill: var(--wall-active); }
  .region.active .top {
    filter: saturate(1.5) brightness(1.045);
    stroke: var(--accent);
    stroke-width: 1.4;
  }
  .region { cursor: pointer; }

  /* map region labels */
  .rlabel {
    font-family: var(--font-region);
    font-style: italic;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: .005em;
    fill: var(--map-label);
    pointer-events: none;
    paint-order: stroke;
    stroke: rgba(255,255,255,.4);
    stroke-width: 1.1px;
  }

  /* cities */
  .dot-major { fill: #fff; stroke: var(--city-major); stroke-width: 1.5; }
  .dot-major-in { fill: var(--city-major); }
  .dot-minor { fill: var(--city-minor); }
  .city .star { fill: var(--capital); stroke: #fff; stroke-width: 0.7; }
  .city-label {
    font-family: var(--font-body); font-weight: 600; font-size: 7.5px;
    fill: var(--city-label); pointer-events: none;
    paint-order: stroke; stroke: rgba(255,255,255,.6); stroke-width: 1px;
  }
  .city-label-major { font-weight: 800; font-size: 9.5px; letter-spacing: .02em; }

  /* state names */
  .state-name {
    font-family: var(--font-display);
    font-weight: 800;
    fill: var(--state-name);
    letter-spacing: .04em;
  }

  /* toggles */
  .hide-cities #state .rcities { display: none; }
  .hide-states #state-names, .hide-states #state-borders { display: none; }
  .hide-terrain #bg-terrain { display: none; }

  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; overflow: auto; }
    .panel { border-right: 0; border-bottom: 1px solid #e1e9f2; }
    body { overflow: auto; }
    .stage { min-height: 60vh; }
  }
</style>
</head>
<body>
  <div class="app">
    <!-- LEFT -->
    <aside class="panel">
      <p class="eyebrow">Why Ohio · Explore Our Regions</p>
      <h1 class="title">Live in one of Ohio's <span class="seven">7 unique</span> regions</h1>
      <p class="lead">A centralized location, world-class talent, and seven distinct regions — each with its own industries, cities, and character. Hover a region to lift it; click to pin.</p>

      <ul class="region-list" id="region-list">
        <li><button class="region-item" data-key="northeast"><span class="chev">›</span><span class="ri-name">Northeast</span><span class="ri-tag">Cleveland · Akron · Canton</span></button></li>
        <li><button class="region-item" data-key="southwest"><span class="chev">›</span><span class="ri-name">Southwest</span><span class="ri-tag">Cincinnati</span></button></li>
        <li><button class="region-item" data-key="central"><span class="chev">›</span><span class="ri-name">Central</span><span class="ri-tag">Columbus</span></button></li>
        <li><button class="region-item" data-key="west"><span class="chev">›</span><span class="ri-name">West</span><span class="ri-tag">Dayton · Lima</span></button></li>
        <li><button class="region-item" data-key="southeast"><span class="chev">›</span><span class="ri-name">Southeast</span><span class="ri-tag">Athens · Chillicothe</span></button></li>
        <li><button class="region-item" data-key="northwest"><span class="chev">›</span><span class="ri-name">Northwest</span><span class="ri-tag">Toledo · Findlay</span></button></li>
        <li><button class="region-item" data-key="east"><span class="chev">›</span><span class="ri-name">Eastern</span><span class="ri-tag">Youngstown</span></button></li>
      </ul>

      <div class="hint"><kbd>Hover</kbd> to raise · <kbd>Click</kbd> to pin a region</div>
    </aside>

    <!-- RIGHT -->
    <main class="stage">
      <div id="map-root"></div>
      <div class="detail" id="detail"></div>
    </main>
  </div>

  <div id="tweaks-root"></div>

  <!-- bundler splash thumbnail -->
  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" fill="#5b54b0"/>
      <path d="M28 30 H62 L68 36 V52 L60 60 H46 L40 70 H30 L26 60 V40 Z" fill="#ddd6ef" stroke="#2a2b61" stroke-width="2"/>
      <circle cx="46" cy="48" r="3" fill="#e23b3b"/>
    </svg>
  </template>

  <!-- map (vanilla) -->
  <script src="svg-geo.js?v=15"></script>
  <script src="map-data.js?v=15"></script>
  <script src="map.js?v=15"></script>

  <!-- react + tweaks -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="app.jsx?v=15"></script>
</body>
</html>
