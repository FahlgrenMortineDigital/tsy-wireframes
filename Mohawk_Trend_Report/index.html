    var KEY = "mtr-key";
    function u8(b) { return Uint8Array.from(atob(b), function (c) { return c.charCodeAt(0); }); }
    function show(html) { document.open(); document.write(html); document.close(); }
    async function keyFrom(pw) {
      var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
      return crypto.subtle.deriveKey({ name: "PBKDF2", salt: u8(P.s), iterations: P.n, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
    }
    async function open(key) {
      var pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: u8(P.i) }, key, u8(P.c));
      return new TextDecoder().decode(pt);

      try {
