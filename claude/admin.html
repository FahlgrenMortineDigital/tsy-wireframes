<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Claude Questions — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0E1014;
    --surface:#161A21;
    --surface-2:#1E232C;
    --border:#2A2F3A;
    --text:#F5F5F2;
    --muted:#9AA0AB;
    --accent:#D97757;
    --accent-hover:#E48A6E;
    --error:#F45B5B;
    --radius:14px;
    --radius-sm:10px;
  }
  html,body{min-height:100%}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg);color:var(--text);
    -webkit-font-smoothing:antialiased;line-height:1.5;
    padding:24px 18px 48px;
  }
  .wrap{max-width:1100px;margin:0 auto}

  header{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    margin-bottom:24px;flex-wrap:wrap;
  }
  .title{display:flex;flex-direction:column;gap:4px}
  .title h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
  .title .sub{font-size:13px;color:var(--muted)}
  .actions{display:flex;gap:8px;flex-wrap:wrap}

  .btn{
    background:var(--surface);
    color:var(--text);
    border:1px solid var(--border);
    font:inherit;font-size:14px;font-weight:500;
    padding:9px 14px;border-radius:var(--radius-sm);
    cursor:pointer;transition:border-color .15s, color .15s;
    display:inline-flex;align-items:center;gap:6px;
  }
  .btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.primary{background:var(--accent);color:#1A1208;border-color:var(--accent)}
  .btn.primary:hover:not(:disabled){background:var(--accent-hover);border-color:var(--accent-hover);color:#1A1208}

  .gate{
    max-width:420px;margin:48px auto 0;
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:28px;
  }
  .gate h2{font-size:18px;font-weight:600;margin-bottom:6px}
  .gate p{color:var(--muted);font-size:14px;margin-bottom:16px}
  .gate label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
  .gate input{
    width:100%;background:var(--surface-2);border:1px solid var(--border);
    color:var(--text);font:inherit;font-size:16px;padding:12px 14px;
    border-radius:var(--radius-sm);outline:none;
  }
  .gate input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(217,119,87,.18)}
  .gate-row{display:flex;gap:8px;margin-top:14px}
  .gate-row .btn{flex:1;justify-content:center}

  .stats{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:10px;margin-bottom:18px;
  }
  .stat{
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-sm);padding:14px 16px;
  }
  .stat .num{font-size:22px;font-weight:700;letter-spacing:-.01em}
  .stat .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}

  .filters{
    display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;
  }
  .filters input,.filters select{
    background:var(--surface-2);border:1px solid var(--border);
    color:var(--text);font:inherit;font-size:14px;
    padding:8px 12px;border-radius:var(--radius-sm);outline:none;
  }
  .filters input{flex:1;min-width:200px}
  .filters input:focus,.filters select:focus{border-color:var(--accent)}

  .list{display:flex;flex-direction:column;gap:10px}
  .item{
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-sm);padding:16px 18px;
  }
  .item-meta{
    display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);
    margin-bottom:8px;align-items:center;
  }
  .pill{
    background:var(--surface-2);border:1px solid var(--border);
    padding:2px 8px;border-radius:999px;font-size:11px;
  }
  .pill.topic{border-color:rgba(217,119,87,.4);color:var(--accent)}
  .item-q{font-size:15px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
  .item-name{font-weight:600;color:var(--text)}

  .empty{
    text-align:center;padding:48px 16px;color:var(--muted);
    background:var(--surface);border:1px dashed var(--border);
    border-radius:var(--radius);
  }
  .err{
    background:rgba(244,91,91,.1);border:1px solid rgba(244,91,91,.4);
    color:#FFB3B3;padding:12px 14px;border-radius:var(--radius-sm);
    margin-bottom:14px;font-size:14px;display:none;
  }
  .err.show{display:block}

  @media (max-width:560px){
    .item-meta{font-size:11px}
    .stats{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- Gate -->
  <section class="gate" id="gate">
    <h2>Admin access</h2>
    <p>Enter the admin key to view and export submitted questions.</p>
    <label for="key">Admin key</label>
    <input type="password" id="key" autocomplete="off" placeholder="Paste key">
    <div class="gate-row">
      <button class="btn primary" id="unlock-btn">Unlock</button>
    </div>
    <div class="err" id="gate-err"></div>
  </section>

  <!-- App -->
  <main id="app" hidden>
    <header>
      <div class="title">
        <h1>Claude questions</h1>
        <span class="sub">Submissions from the Enterprise rollout announcement</span>
      </div>
      <div class="actions">
        <button class="btn" id="refresh-btn">Refresh</button>
        <button class="btn primary" id="export-btn">Export CSV</button>
        <button class="btn" id="export-json-btn">Export JSON</button>
        <button class="btn" id="logout-btn">Lock</button>
      </div>
    </header>

    <div class="err" id="app-err"></div>

    <div class="stats">
      <div class="stat"><div class="num" id="s-total">—</div><div class="lbl">Total</div></div>
      <div class="stat"><div class="num" id="s-today">—</div><div class="lbl">Today</div></div>
      <div class="stat"><div class="num" id="s-named">—</div><div class="lbl">Named</div></div>
      <div class="stat"><div class="num" id="s-anon">—</div><div class="lbl">Anonymous</div></div>
    </div>

    <div class="filters">
      <input type="search" id="filter-text" placeholder="Search questions, names, teams…">
      <select id="filter-topic"><option value="">All topics</option></select>
    </div>

    <div class="list" id="list"></div>
  </main>
</div>

<script>
  // ⬇️ UPDATE THIS after deploying the Netlify backend
  const API_URL = 'https://claude-questions-sync.netlify.app/api/questions';
  const STORAGE_KEY = 'cq-admin-key';

  const gate = document.getElementById('gate');
  const app  = document.getElementById('app');
  const keyInput = document.getElementById('key');
  const unlockBtn = document.getElementById('unlock-btn');
  const gateErr = document.getElementById('gate-err');
  const appErr  = document.getElementById('app-err');

  const listEl = document.getElementById('list');
  const filterText = document.getElementById('filter-text');
  const filterTopic = document.getElementById('filter-topic');

  let allQuestions = [];
  let adminKey = '';

  function showGateErr(msg){ gateErr.textContent = msg; gateErr.classList.add('show'); }
  function clearGateErr(){ gateErr.textContent = ''; gateErr.classList.remove('show'); }
  function showAppErr(msg){ appErr.textContent = msg; appErr.classList.add('show'); }
  function clearAppErr(){ appErr.textContent = ''; appErr.classList.remove('show'); }

  async function fetchQuestions(key){
    const res = await fetch(API_URL, { headers:{ 'X-Admin-Key': key } });
    if (res.status === 401 || res.status === 403){
      throw new Error('Invalid admin key.');
    }
    if (!res.ok){
      throw new Error(`Request failed (${res.status})`);
    }
    return res.json();
  }

  function escapeHtml(s){
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function fmtDate(iso){
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleString(undefined, {
      month:'short', day:'numeric', hour:'numeric', minute:'2-digit'
    });
  }

  function isToday(iso){
    if (!iso) return false;
    const d = new Date(iso);
    const n = new Date();
    return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth() && d.getDate()===n.getDate();
  }

  function render(){
    const q = filterText.value.trim().toLowerCase();
    const topic = filterTopic.value;
    const filtered = allQuestions.filter(item => {
      if (topic && item.topic !== topic) return false;
      if (!q) return true;
      const hay = [item.question, item.name, item.team, item.topic].filter(Boolean).join(' ').toLowerCase();
      return hay.includes(q);
    });

    if (filtered.length === 0){
      listEl.innerHTML = `<div class="empty">${allQuestions.length === 0 ? 'No submissions yet.' : 'No matches for the current filter.'}</div>`;
      return;
    }

    listEl.innerHTML = filtered.map(item => `
      <div class="item">
        <div class="item-meta">
          <span class="item-name">${item.name ? escapeHtml(item.name) : '<span style="color:var(--muted);font-weight:400">Anonymous</span>'}</span>
          ${item.team ? `<span class="pill">${escapeHtml(item.team)}</span>` : ''}
          ${item.topic ? `<span class="pill topic">${escapeHtml(item.topic)}</span>` : ''}
          <span style="margin-left:auto">${escapeHtml(fmtDate(item.ts))}</span>
        </div>
        <div class="item-q">${escapeHtml(item.question)}</div>
      </div>
    `).join('');
  }

  function renderStats(){
    document.getElementById('s-total').textContent = allQuestions.length;
    document.getElementById('s-today').textContent = allQuestions.filter(i => isToday(i.ts)).length;
    document.getElementById('s-named').textContent = allQuestions.filter(i => i.name).length;
    document.getElementById('s-anon').textContent  = allQuestions.filter(i => !i.name).length;

    const topics = [...new Set(allQuestions.map(i => i.topic).filter(Boolean))].sort();
    const current = filterTopic.value;
    filterTopic.innerHTML = '<option value="">All topics</option>' +
      topics.map(t => `<option value="${escapeHtml(t)}"${t===current?' selected':''}>${escapeHtml(t)}</option>`).join('');
  }

  async function load(){
    clearAppErr();
    try {
      const data = await fetchQuestions(adminKey);
      allQuestions = (data.questions || []).slice().sort((a,b) => (b.ts||'').localeCompare(a.ts||''));
      renderStats();
      render();
    } catch (err) {
      console.error(err);
      if (/401|403|Invalid/i.test(err.message)){
        adminKey = '';
        sessionStorage.removeItem(STORAGE_KEY);
        showGate();
        showGateErr('Saved key was rejected. Please re-enter.');
      } else {
        showAppErr(err.message || 'Failed to load submissions.');
      }
    }
  }

  function showApp(){
    gate.hidden = true;
    app.hidden = false;
  }
  function showGate(){
    gate.hidden = false;
    app.hidden = true;
    setTimeout(()=>keyInput.focus(), 50);
  }

  unlockBtn.addEventListener('click', tryUnlock);
  keyInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });

  async function tryUnlock(){
    clearGateErr();
    const k = keyInput.value.trim();
    if (!k){ showGateErr('Enter the admin key.'); return; }
    unlockBtn.disabled = true;
    try {
      const data = await fetchQuestions(k);
      adminKey = k;
      sessionStorage.setItem(STORAGE_KEY, k);
      allQuestions = (data.questions || []).slice().sort((a,b) => (b.ts||'').localeCompare(a.ts||''));
      showApp();
      renderStats();
      render();
    } catch (err) {
      showGateErr(err.message || 'Failed to verify.');
    } finally {
      unlockBtn.disabled = false;
    }
  }

  document.getElementById('refresh-btn').addEventListener('click', load);

  document.getElementById('logout-btn').addEventListener('click', () => {
    adminKey = '';
    sessionStorage.removeItem(STORAGE_KEY);
    keyInput.value = '';
    allQuestions = [];
    showGate();
  });

  filterText.addEventListener('input', render);
  filterTopic.addEventListener('change', render);

  // CSV export
  function csvEscape(v){
    const s = String(v ?? '');
    if (/[",\n\r]/.test(s)) return `"${s.replace(/"/g,'""')}"`;
    return s;
  }
  document.getElementById('export-btn').addEventListener('click', () => {
    if (allQuestions.length === 0){ showAppErr('Nothing to export yet.'); return; }
    const cols = ['ts','name','team','topic','question','id'];
    const header = cols.join(',');
    const rows = allQuestions.map(it => cols.map(c => csvEscape(it[c])).join(','));
    const csv = '﻿' + [header, ...rows].join('\r\n');
    const blob = new Blob([csv], { type:'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `claude-questions-${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  });

  document.getElementById('export-json-btn').addEventListener('click', () => {
    if (allQuestions.length === 0){ showAppErr('Nothing to export yet.'); return; }
    const blob = new Blob([JSON.stringify(allQuestions, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `claude-questions-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  });

  // Auto-unlock if a session key is saved
  const saved = sessionStorage.getItem(STORAGE_KEY);
  if (saved){
    keyInput.value = saved;
    tryUnlock();
  } else {
    setTimeout(()=>keyInput.focus(), 50);
  }
</script>
</body>
</html>
