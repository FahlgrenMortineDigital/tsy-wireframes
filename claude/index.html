<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Got a question about Claude? — The Shipyard</title>
<style>
  /* Pull GT America from the live Shipyard site so we match exactly. Fallbacks below if CORS blocks them. */
  @font-face{
    font-family:"GT-America-Standard-Regular";
    src:url("https://theshipyard.com/wp-content/themes/the-shipyard/assets/fonts/licensed/GT-America-Standard-Regular.woff") format("woff");
    font-display:swap;
  }
  @font-face{
    font-family:"GT-America-Standard-Medium";
    src:url("https://theshipyard.com/wp-content/themes/the-shipyard/assets/fonts/licensed/GT-America-Standard-Medium.woff") format("woff");
    font-display:swap;
  }
  @font-face{
    font-family:"GT-America-Compressed-Bold";
    src:url("https://theshipyard.com/wp-content/themes/the-shipyard/assets/fonts/licensed/GT-America-Compressed-Bold.woff") format("woff");
    font-display:swap;
  }

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --black:#000;
    --white:#fff;
    --red:#DF3400;
    --red-hover:#fe4a25;
    --sky:#8BD8FF;
    --paper:#fafaf8;
    --line:#000;
    --muted:#666;
    --font-body:"GT-America-Standard-Regular", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-md:"GT-America-Standard-Medium", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-display:"GT-America-Compressed-Bold", "Archivo Narrow", "Inter", sans-serif;
  }

  html,body{min-height:100%}
  body{
    font-family:var(--font-body);
    background:var(--white);
    color:var(--black);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    line-height:1.5;
    font-size:17px;
  }

  .page{
    max-width:640px;
    margin:0 auto;
    padding:32px 22px 64px;
  }

  /* Claude mark */
  .brand{
    display:flex;align-items:center;
    margin-bottom:48px;
  }
  .claude-mark{
    width:48px;height:48px;
    flex-shrink:0;
    display:block;
  }

  /* Headline */
  h1{
    font-family:var(--font-display);
    font-weight:700;
    text-transform:uppercase;
    line-height:.95;
    letter-spacing:.005em;
    font-size:clamp(48px, 13vw, 84px);
    margin-bottom:20px;
  }
  h1 .red{color:var(--red)}

  .lede{
    font-size:18px;
    line-height:1.45;
    color:var(--black);
    max-width:32ch;
    margin-bottom:40px;
  }

  /* Form */
  form{display:flex;flex-direction:column;gap:24px}

  .field label{
    display:block;
    font-family:var(--font-md);
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.08em;
    margin-bottom:10px;
  }
  .field label .opt{
    color:var(--muted);
    text-transform:none;
    letter-spacing:0;
    font-family:var(--font-body);
    font-size:13px;
    margin-left:6px;
  }

  input[type="text"],
  textarea{
    width:100%;
    background:transparent;
    border:none;
    border-bottom:2px solid var(--black);
    color:var(--black);
    font:inherit;
    font-size:18px;
    padding:8px 0 12px;
    outline:none;
    border-radius:0;
    -webkit-appearance:none;
    appearance:none;
    transition:border-color .15s;
  }
  textarea{
    min-height:120px;
    resize:vertical;
    line-height:1.5;
  }
  input:focus,textarea:focus{border-color:var(--red)}
  input::placeholder,textarea::placeholder{color:#aaa}

  /* Submit button — Shipyard style: pill, bold, with arrow */
  .submit-row{margin-top:16px}
  button[type="submit"]{
    display:inline-flex;align-items:center;gap:14px;
    background:var(--black);
    color:var(--white);
    border:none;
    font-family:var(--font-display);
    text-transform:uppercase;
    font-size:18px;
    letter-spacing:.04em;
    padding:18px 28px;
    border-radius:999px;
    cursor:pointer;
    transition:background .15s, transform .05s;
  }
  button[type="submit"]:hover:not(:disabled){background:var(--red)}
  button[type="submit"]:active:not(:disabled){transform:translateY(1px)}
  button[type="submit"]:disabled{opacity:.6;cursor:not-allowed}
  button[type="submit"] .arrow{
    display:inline-flex;align-items:center;justify-content:center;
    width:22px;height:22px;
    transition:transform .15s;
  }
  button[type="submit"]:hover:not(:disabled) .arrow{transform:translateX(3px)}
  .spinner{
    display:none;
    width:16px;height:16px;border-radius:50%;
    border:2px solid rgba(255,255,255,.3);
    border-top-color:var(--white);
    animation:spin .8s linear infinite;
  }
  button.loading .spinner{display:block}
  button.loading .arrow{display:none}
  @keyframes spin{to{transform:rotate(360deg)}}

  .status{
    display:none;
    margin-top:16px;
    font-size:14px;
    color:var(--red);
  }
  .status.show{display:block}

  /* Success state */
  .success{display:none}
  .success.show{display:block}
  .success h2{
    font-family:var(--font-display);
    text-transform:uppercase;
    font-size:clamp(40px, 11vw, 72px);
    line-height:.95;
    margin-bottom:18px;
  }
  .success h2 .red{color:var(--red)}
  .success p{
    font-size:18px;line-height:1.45;
    margin-bottom:32px;max-width:34ch;
  }
  .ghost-btn{
    background:transparent;
    color:var(--black);
    border:2px solid var(--black);
    font-family:var(--font-display);
    text-transform:uppercase;
    font-size:16px;letter-spacing:.04em;
    padding:14px 24px;border-radius:999px;
    cursor:pointer;transition:background .15s, color .15s;
  }
  .ghost-btn:hover{background:var(--black);color:var(--white)}

  footer{
    margin-top:64px;
    font-family:var(--font-md);
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.1em;
    color:var(--muted);
  }

  @media (min-width:680px){
    .page{padding:56px 40px 80px}
    .brand{margin-bottom:64px}
    .lede{font-size:20px;margin-bottom:48px}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }
</style>
</head>
<body>
<div class="page">

  <div class="brand">
    <img class="claude-mark" src="claude-ai.svg" alt="Claude" width="48" height="48">
  </div>

  <main id="form-view">
    <h1>Got a <span class="red">question</span> about Claude?</h1>
    <p class="lede">Ask anything. Big, small, technical, or "wait, what does this mean for me?" — they all help.</p>

    <form id="q-form" novalidate>
      <div class="field">
        <label for="question">Your question</label>
        <textarea id="question" name="question" required maxlength="2000" placeholder="Type whatever's on your mind…"></textarea>
      </div>

      <div class="field">
        <label for="name">Name <span class="opt">— optional, leave blank to stay anonymous</span></label>
        <input type="text" id="name" name="name" autocomplete="name" maxlength="80" placeholder="">
      </div>

      <div class="submit-row">
        <button type="submit" id="submit-btn">
          <span class="label">Send it</span>
          <span class="spinner" aria-hidden="true"></span>
          <span class="arrow" aria-hidden="true">
            <svg width="22" height="14" viewBox="0 0 22 14" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M0 7H20M20 7L14 1M20 7L14 13" stroke="currentColor" stroke-width="2"/>
            </svg>
          </span>
        </button>
        <div class="status" id="status" role="alert"></div>
      </div>
    </form>
  </main>

  <section class="success" id="success-view" aria-live="polite">
    <h2>Got it. <span class="red">Thanks.</span></h2>
    <p>Your question is in. We'll round everything up and follow up with the team.</p>
    <button type="button" class="ghost-btn" id="another-btn">Ask another</button>
  </section>

  <footer>The Shipyard · Claude Enterprise</footer>
</div>

<script>
  // ⬇️ UPDATE THIS after deploying the Netlify backend
  const API_URL = 'https://claude-questions-sync.netlify.app/api/questions';

  const form     = document.getElementById('q-form');
  const formView = document.getElementById('form-view');
  const successView = document.getElementById('success-view');
  const btn      = document.getElementById('submit-btn');
  const status   = document.getElementById('status');
  const ta       = document.getElementById('question');
  const anotherBtn = document.getElementById('another-btn');

  function showError(msg){
    status.textContent = msg;
    status.classList.add('show');
  }
  function clearError(){
    status.textContent = '';
    status.classList.remove('show');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearError();

    const question = ta.value.trim();
    if (!question){
      showError('Add a question first.');
      ta.focus();
      return;
    }

    const payload = {
      name: document.getElementById('name').value.trim() || null,
      question,
      ua: navigator.userAgent.slice(0, 200),
    };

    btn.classList.add('loading');
    btn.disabled = true;

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      if (!res.ok){
        const text = await res.text().catch(()=>'');
        throw new Error(text || `Request failed (${res.status})`);
      }
      formView.style.display = 'none';
      successView.classList.add('show');
      window.scrollTo({ top:0, behavior:'smooth' });
    } catch (err) {
      console.error(err);
      showError("Couldn't send it just now — try again, or grab one of us in person.");
    } finally {
      btn.classList.remove('loading');
      btn.disabled = false;
    }
  });

  anotherBtn.addEventListener('click', () => {
    form.reset();
    successView.classList.remove('show');
    formView.style.display = '';
    window.scrollTo({ top:0, behavior:'smooth' });
    setTimeout(()=>document.getElementById('question').focus(), 200);
  });
</script>
</body>
</html>
